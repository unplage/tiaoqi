<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#160d0a">
<title>三国群英斩 · TiaoQi Arcade</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="../../icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../icons/icon-180.png" sizes="180x180">
<style>
:root{--bg:#0d0807;--line:#3a2418;--gold:#f5c451;--red:#e0503c;--jade:#5fd0b0;--txt:#f0e2cc;--mut:#9a8270}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 15% -10%,rgba(245,196,81,.10),transparent 55%),radial-gradient(ellipse at 90% 110%,rgba(224,80,60,.10),transparent 55%),var(--bg);
color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#shell{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;
padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom));
padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
#screen{position:relative;width:min(100%,1160px);aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;
box-shadow:0 30px 80px #0009,0 0 0 1px var(--line),0 0 60px rgba(245,196,81,.07)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.11) 0 1px,transparent 1px 3px);opacity:.65}
#bar{width:min(100%,1160px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;font-size:14px;color:var(--mut)}
#bar b{color:var(--gold);letter-spacing:.16em;font-size:12px}
.chip{font-family:inherit;font-size:12px;font-weight:700;padding:7px 11px;border-radius:99px;border:1px solid var(--line);
background:rgba(255,255,255,.03);color:var(--txt);cursor:pointer;transition:.18s}
.chip:hover{background:rgba(245,196,81,.14);transform:translateY(-2px)}
.chip:active{transform:translateY(1px)}
.chip:disabled{opacity:.35;cursor:not-allowed;transform:none}
:root{--stick:132px;--knob:56px;--act:64px}
#touch{width:min(100%,1160px);display:none;align-items:center;justify-content:space-between;gap:12px;padding:4px 12px;pointer-events:auto;touch-action:none}
body.is-touch #touch{display:flex}
.stick{position:relative;width:var(--stick);height:var(--stick);flex:0 0 auto;border-radius:50%;
  background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.22);
  box-shadow:inset 0 0 24px rgba(0,0,0,.4);touch-action:none;pointer-events:auto}
.stick::before,.stick::after{content:'';position:absolute;background:rgba(255,255,255,.12)}
.stick::before{left:50%;top:12%;width:2px;height:76%;transform:translateX(-50%)}
.stick::after{top:50%;left:12%;height:2px;width:76%;transform:translateY(-50%)}
.knob{position:absolute;left:50%;top:50%;width:var(--knob);height:var(--knob);border-radius:50%;
  background:rgba(245,196,81,.32);border:2px solid rgba(245,196,81,.8);
  transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 12px rgba(245,196,81,.3);
  transition:background .12s}
.stick.on .knob{background:rgba(245,196,81,.62)}
.actions{display:grid;grid-template-columns:repeat(3,var(--act));grid-auto-rows:var(--act);gap:8px;flex:0 0 auto}
.tb{position:relative;pointer-events:auto;touch-action:none;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
width:var(--act);height:var(--act);border-radius:16px;font-size:13px;font-weight:800;letter-spacing:.02em;
color:rgba(255,255,255,.9);background:rgba(255,255,255,.10);
border:2px solid rgba(255,255,255,.22);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
transition:background .12s,transform .08s,box-shadow .2s;white-space:nowrap}
.tb:active,.tb.on{background:rgba(245,196,81,.55);color:#241500;border-color:#ffe6a0;transform:scale(.94)}
.tb.atk{background:rgba(224,80,60,.24);border-color:rgba(224,80,60,.6);font-size:15px}
.tb.fin{background:rgba(245,196,81,.16);border-color:rgba(245,196,81,.5)}
.tb.skill{background:rgba(95,208,176,.16);border-color:rgba(95,208,176,.5)}
.tb.block{background:rgba(143,216,255,.16);border-color:rgba(143,216,255,.5)}
.tb.troop{background:rgba(168,140,240,.16);border-color:rgba(168,140,240,.5)}
.tb.menu{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.28);font-size:12px}
.tb.ready{box-shadow:0 0 16px 3px rgba(245,196,81,.65);animation:pulse .7s ease-in-out infinite alternate}
.tb.ready.cool{box-shadow:0 0 14px 2px rgba(95,208,176,.5)}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.45)}}
body.fullscreen #shell{gap:0;padding:0;background:#000}
body.fullscreen #screen{width:min(100vw,calc(100vh*16/9));max-height:100vh;border-radius:0;box-shadow:none}
body.fullscreen #bar{display:none}
body.fullscreen #touch{
  position:fixed;left:0;right:0;bottom:0;height:auto;z-index:20;
  pointer-events:none;background:transparent;padding:0 2vw 1.5vh;
  align-items:flex-end;justify-content:space-between;
}
body.fullscreen .stick,body.fullscreen .actions{opacity:.55;transition:opacity .15s}
body.fullscreen .stick:hover,body.fullscreen .actions:hover,
body.fullscreen .stick:active,body.fullscreen .actions:active{opacity:1}
body.fullscreen .tb{pointer-events:auto;box-shadow:0 2px 10px rgba(0,0,0,.5)}
body.fullscreen .tb.ready{box-shadow:0 0 16px 3px rgba(245,196,81,.65)}
#cExitFull{display:none;position:absolute;right:10px;top:10px;z-index:9;
  width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer;opacity:.6}
body.fullscreen #cExitFull{display:block}
#rotate{display:none;position:absolute;inset:0;z-index:40;background:rgba(10,6,5,.96);
  align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px}
#rotate b{font-size:26px;color:#f5c451;letter-spacing:.2em}
#rotate span{font-size:14px;color:#9a8270}
#rotate button{margin-top:6px;padding:9px 18px;border-radius:99px;border:1px solid #3a2418;background:rgba(255,255,255,.05);color:#f0e2cc;font:700 13px sans-serif}
body.is-touch.portrait #rotate{display:flex}
body.skipRotate #rotate{display:none!important}
@media(max-width:760px){#bar{font-size:12px}.chip{font-size:11px;padding:6px 9px}}
@media(orientation:landscape){
  :root{--stick:108px;--knob:44px;--act:48px}
  #shell{gap:3px;padding:3px}
  #screen{width:min(100vw,calc((100vh - 168px)*16/9));max-height:calc(100vh - 168px);border-radius:8px}
  #bar{font-size:12px;gap:4px 8px}
  #bar .tip{display:none}
  #touch{height:auto;padding:2px 10px}
  .actions{gap:6px;grid-template-columns:repeat(5,var(--act))}
  .tb{font-size:11px;border-radius:12px}
  .tb.atk{font-size:13px}
  .stick{border-radius:50%}
}
body.is-touch #bar{display:none}
body.is-touch #shell{gap:0;padding:0;justify-content:center;background:#000}
body.is-touch #screen{width:min(100vw,calc(100vh*16/9));max-height:100vh;height:auto;aspect-ratio:16/9;border-radius:0;box-shadow:none}
body.is-touch #touch{
  position:fixed;left:0;right:0;bottom:0;z-index:20;height:auto;
  pointer-events:none;background:transparent;padding:0 1.5vw 1.2vh;
  align-items:flex-end;justify-content:space-between;
}
body.is-touch .tb{pointer-events:auto;box-shadow:0 2px 10px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="shell">
  <div id="screen">
    <canvas id="game"></canvas>
    <div class="scan"></div>
    <button id="cExitFull" title="退出全屏">&#10005;</button>
    <div id="rotate">
      <b>请横屏游玩</b>
      <span>横屏可获得完整战斗视野与操作空间</span>
      <button id="rotateSkip">仍要竖屏</button>
    </div>
  </div>
  <div id="touch">
    <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
    <div class="actions">
      <div class="tb atk" id="bAtk">连斩</div>
      <div class="tb skill" id="bSkill">技能</div>
      <div class="tb fin" id="bFin">狂斩</div>
      <div class="tb" id="bDodge">闪避</div>
      <div class="tb block" id="bBlock">格挡</div>
      <div class="tb troop" id="bTroop">召兵</div>
      <div class="tb troop" id="bNext">换兵</div>
      <div class="tb" id="bWeapon">武器</div>
      <div class="tb menu" id="bPause">暂停</div>
    </div>
  </div>
  <div id="bar">
    <b>三国群英斩</b>
    <span class="tip">WASD移动 · J连斩 · K技能 · L狂斩 · Shift闪避 · I格挡 · Q/E换武器 · 1-6换兵 · P暂停</span>
    <button class="chip" id="cNew">新游戏</button>
    <button class="chip" id="cCont" disabled>继续</button>
    <button class="chip" id="cSound">音效开</button>
    <button class="chip" id="cPause">暂停</button>
    <button class="chip" id="cFull">横屏</button>
    <button class="chip" id="cBack">返回游戏集</button>
  </div>
</div>
<script>
(function(){
'use strict';

const VW=960,VH=540,STEP=1/120;
const GY0=352,GY1=500;
const LEFT=26,RIGHT=934;
const PYMIN=GY0+20,PYMAX=GY1-8;
const MAXENEMY=30,MAXTROOP=8;

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hitRect=(a,b,pad)=>{
  const p=pad||0;
  return a.x-p<b.x+b.w&&a.x+a.w+p>b.x&&a.y-p<b.y+b.h&&a.y+a.h+p>b.y;
};
const box=o=>({x:o.x-o.w/2,y:o.y-o.h,w:o.w,h:o.h});
const $=id=>document.getElementById(id);

const AU={
  ctx:null,master:null,muted:false,
  init(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    try{
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=0.65;
      this.master.connect(this.ctx.destination);
    }catch(e){this.ctx=null;}
  },
  resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});},
  setMuted(m){this.muted=m;if(this.master)this.master.gain.value=m?0:0.65;},
  tone(f0,f1,dur,type,vol,when){
    if(!this.ctx||this.muted)return;
    try{
      const c=this.ctx,t=(when||0)||c.currentTime,o=c.createOscillator(),g=c.createGain();
      o.type=type||'square';
      o.frequency.setValueAtTime(Math.max(20,f0),t);
      if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.05),t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.03);
    }catch(e){}
  },
  noise(dur,vol,freq){
    if(!this.ctx||this.muted)return;
    try{
      const c=this.ctx,n=Math.max(1,Math.floor(c.sampleRate*dur));
      const buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
      const s=c.createBufferSource();s.buffer=buf;
      const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||1400;
      const g=c.createGain();g.gain.value=vol||0.1;
      s.connect(f);f.connect(g);g.connect(this.master);s.start();
    }catch(e){}
  }
};
const SFX={
  slash(){AU.tone(900,300,.08,'sawtooth',.045);AU.noise(.06,.04,3000);},
  heavy(){AU.tone(520,150,.14,'sawtooth',.065);AU.noise(.12,.07,1800);},
  hit(){AU.tone(320,130,.05,'square',.05);AU.noise(.05,.04,2400);},
  hurt(){AU.tone(260,80,.24,'square',.09);AU.noise(.18,.08,900);},
  skill(){[392,523,659,784].forEach((f,i)=>AU.tone(f,f*1.5,.16,'triangle',.055,i*.06));},
  finish(){[523,659,784,1046,1318].forEach((f,i)=>AU.tone(f,f*1.2,.18,'sawtooth',.06,i*.05));AU.noise(.3,.1,2600);},
  musou(){[196,262,392,523,784,1046].forEach((f,i)=>AU.tone(f,f*1.25,.2,'sawtooth',.06,i*.045));AU.noise(.5,.13,2200);},
  summon(){AU.tone(180,420,.12,'triangle',.06);},
  arrow(){AU.tone(760,420,.07,'sine',.035);},
  die(){AU.tone(220,60,.3,'square',.08);},
  win(){[392,523,659,784,1046].forEach((f,i)=>AU.tone(f,f,.18,'triangle',.065,i*.12));},
  ui(){AU.tone(520,660,.06,'square',.035);},
  warn(){AU.tone(160,160,.14,'square',.05);},
  parry(){AU.tone(1250,1900,.12,'triangle',.08);AU.tone(620,940,.16,'sine',.05);AU.noise(.06,.05,3800);},
  guard(){AU.tone(180,60,.24,'square',.1);AU.noise(.2,.12,600);},
  buy(){AU.tone(880,1180,.07,'triangle',.05);AU.tone(1180,1560,.09,'triangle',.045,.07);},
  heal(){[520,660,780].forEach((f,i)=>AU.tone(f,f*1.1,.12,'sine',.045,i*.05));},
  levelup(){[392,523,659,784,988].forEach((f,i)=>AU.tone(f,f,.14,'triangle',.055,i*.06));}
};
const SCALE=[0,2,4,7,9,12,14,16,19,21];
const MUS={
  on:false,timer:null,next:0,i:0,
  start(){
    if(this.on)return;
    this.on=true;
    this.next=AU.ctx?AU.ctx.currentTime+0.08:0;
    clearInterval(this.timer);
    this.timer=setInterval(()=>this.tick(),32);
  },
  stop(){this.on=false;clearInterval(this.timer);this.timer=null;},
  tick(){
    if(!this.on||!AU.ctx||AU.muted)return;
    const c=AU.ctx;
    const boss=!!(G.boss&&!G.boss.dead);
    const step=boss?.135:.16;
    while(this.next<c.currentTime+0.16){
      const s=this.i%16;
      if(s%2===0){
        const n=SCALE[(this.i/2|0)%SCALE.length];
        AU.tone(110*Math.pow(2,(n-12)/12),null,boss?.2:.24,'triangle',.04,this.next);
      }
      if(s%4===1||(boss&&s%4===3)){
        const n=SCALE[(this.i*3|0)%SCALE.length]+12;
        AU.tone(110*Math.pow(2,n/12),null,.16,'square',boss?.032:.024,this.next);
      }
      if(s%8===0)AU.noise(.09,.03,900);
      this.next+=step;this.i++;
    }
  }
};

const KB={left:false,right:false,up:false,down:false,atk:false,block:false};
const TACT={left:0,right:0,up:0,down:0,atk:0,block:0};
const STICK={active:false,id:null,x:0,y:0,left:false,right:false,up:false,down:false};
const act=a=>((KB[a]?1:0)+(TACT[a]||0)+(STICK[a]?1:0))>0;
const MOVE={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};
let touchMode=false;

function vib(pattern){
  if(!save.haptic)return;
  try{if(navigator.vibrate)navigator.vibrate(pattern);}catch(e){}
}

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(G.state==='menu'){
    if(k==='a'||k==='arrowleft'){e.preventDefault();setDiff(save.diff-1);return;}
    if(k==='d'||k==='arrowright'){e.preventDefault();setDiff(save.diff+1);return;}
    if(k==='enter'){e.preventDefault();AU.resume();startNew();return;}
    if(k==='c'){e.preventDefault();AU.resume();continueGame();return;}
    return;
  }
  if(G.state==='shop'){
    if(k>='1'&&k<='4'){e.preventDefault();if(k==='4')buySupply();else upgrade(+k-1);return;}
    if(k==='enter'){e.preventDefault();nextLevel();return;}
    return;
  }
  if(G.state==='over'){
    if(k==='enter'){e.preventDefault();continueGame();return;}
    if(k==='r'){e.preventDefault();startNew();return;}
    return;
  }
  if(G.state==='win'){
    if(k==='enter'){e.preventDefault();startNew();return;}
    return;
  }
  if(G.state==='paused'){
    if(k==='p'||k==='escape'){e.preventDefault();togglePause();return;}
    if(k==='r'){e.preventDefault();restartLevel();return;}
    if(k==='m'){e.preventDefault();toggleSound();return;}
    return;
  }
  if(k in MOVE){e.preventDefault();AU.resume();KB[MOVE[k]]=true;return;}
  if(k==='j'||k===' '){e.preventDefault();AU.resume();KB.atk=true;doAttack();return;}
  if(k==='k'){e.preventDefault();AU.resume();doSkill();return;}
  if(k==='l'){e.preventDefault();AU.resume();doFin();return;}
  if(k==='shift'){e.preventDefault();AU.resume();doDodge();return;}
  if(k==='i'){e.preventDefault();AU.resume();KB.block=true;return;}
  if(k==='q'){e.preventDefault();AU.resume();switchWeapon(-1);return;}
  if(k==='e'){e.preventDefault();AU.resume();switchWeapon(1);return;}
  if(k==='p'||k==='escape'){e.preventDefault();togglePause();return;}
  if(k>='1'&&k<='6'){e.preventDefault();setTroop(+k-1);return;}
},{passive:false});

addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k in MOVE)KB[MOVE[k]]=false;
  if(k==='j'||k===' ')KB.atk=false;
  if(k==='i')KB.block=false;
});

addEventListener('blur',()=>{
  for(const k in KB)KB[k]=false;
  for(const k in TACT)TACT[k]=0;
  STICK.active=false;STICK.id=null;STICK.x=0;STICK.y=0;STICK.left=STICK.right=STICK.up=STICK.down=false;
  if(knobEl)knobEl.style.transform='translate(-50%,-50%)';
  if(stickEl)stickEl.classList.remove('on');
  if(G.state==='playing'){G.state='paused';MUS.stop();}
});

function bindHold(el,action,onDown){
  if(!el)return;
  let pid=null;
  const down=e=>{
    if(pid!==null)return;
    e.preventDefault();AU.resume();
    pid=e.pointerId;
    try{el.setPointerCapture(e.pointerId);}catch(err){}
    el.classList.add('on');
    TACT[action]++;
    if(onDown)onDown();
  };
  const up=e=>{
    if(pid!==e.pointerId)return;
    e.preventDefault();
    pid=null;
    TACT[action]=Math.max(0,TACT[action]-1);
    el.classList.remove('on');
  };
  el.addEventListener('pointerdown',down,{passive:false});
  el.addEventListener('pointerup',up,{passive:false});
  el.addEventListener('pointercancel',up,{passive:false});
  el.addEventListener('lostpointercapture',up,{passive:false});
}
function bindTap(el,fn){
  if(!el)return;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();AU.resume();
    el.classList.add('on');
    fn();
    setTimeout(()=>el.classList.remove('on'),120);
  },{passive:false});
}

if(('ontouchstart' in window)||navigator.maxTouchPoints>0||window.matchMedia('(pointer:coarse)').matches){
  touchMode=true;
  document.body.classList.add('is-touch');
}
bindHold($('bAtk'),'atk',()=>doAttack());
bindHold($('bBlock'),'block');
bindTap($('bSkill'),doSkill);
bindTap($('bFin'),doFin);
bindTap($('bDodge'),doDodge);
bindTap($('bTroop'),doSummon);
bindTap($('bNext'),cycleTroop);
bindTap($('bWeapon'),()=>switchWeapon(1));
bindTap($('bPause'),togglePause);

const stickEl=$('stick'),knobEl=$('knob');
function stickUpdate(e){
  if(!STICK.active||e.pointerId!==STICK.id)return;
  const r=stickEl.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const kr=knobEl.getBoundingClientRect();
  const max=r.width/2-kr.width/2;
  const len=Math.hypot(dx,dy)||1;
  const c=Math.min(len,max);
  dx=dx/len*c;dy=dy/len*c;
  knobEl.style.transform='translate(calc(-50% + '+dx.toFixed(1)+'px),calc(-50% + '+dy.toFixed(1)+'px))';
  const nx=dx/max,ny=dy/max;
  STICK.x=nx;STICK.y=ny;
  STICK.left=nx<-.22;STICK.right=nx>.22;STICK.up=ny<-.22;STICK.down=ny>.22;
}
function stickRelease(e){
  if(e.pointerId!==STICK.id)return;
  STICK.active=false;STICK.id=null;STICK.x=0;STICK.y=0;
  STICK.left=STICK.right=STICK.up=STICK.down=false;
  knobEl.style.transform='translate(-50%,-50%)';
  stickEl.classList.remove('on');
}
if(stickEl){
  stickEl.addEventListener('pointerdown',e=>{
    e.preventDefault();AU.resume();
    STICK.active=true;STICK.id=e.pointerId;
    try{stickEl.setPointerCapture(e.pointerId);}catch(err){}
    stickEl.classList.add('on');
    stickUpdate(e);
  },{passive:false});
  stickEl.addEventListener('pointermove',stickUpdate,{passive:false});
  stickEl.addEventListener('pointerup',stickRelease,{passive:false});
  stickEl.addEventListener('pointercancel',stickRelease,{passive:false});
  stickEl.addEventListener('lostpointercapture',stickRelease,{passive:false});
}

const canvas=$('game'),ctx=canvas.getContext('2d');
let scale=1,drag=null;
function resize(){
  const r=canvas.getBoundingClientRect();
  const d=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.max(2,Math.round(r.width*d));
  canvas.height=Math.max(2,Math.round(r.height*d));
  scale=canvas.width/VW;
  ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,300));
function localPoint(e){
  const r=canvas.getBoundingClientRect();
  return{x:(e.clientX-r.left)*VW/r.width,y:(e.clientY-r.top)*VH/r.height};
}
let uiButtons=[];
canvas.addEventListener('pointerdown',e=>{
  AU.resume();
  const p=localPoint(e);
  if(G.state==='playing'){
    drag={x:p.x,y:p.y,t:performance.now(),id:e.pointerId};
    try{canvas.setPointerCapture(e.pointerId);}catch(err){}
    return;
  }
  for(const b of uiButtons){
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn();return;}
  }
},{passive:true});
canvas.addEventListener('pointermove',e=>{
  if(!drag||G.state!=='playing')return;
  const p=localPoint(e),t=performance.now();
  const dx=p.x-drag.x,dy=p.y-drag.y,dt=Math.max(1,t-drag.t),len=Math.hypot(dx,dy);
  if(len>30&&len/dt>0.55){
    tryFin(Math.atan2(dy,dx));
    drag.x=p.x;drag.y=p.y;drag.t=t;
  }
},{passive:true});
canvas.addEventListener('pointerup',()=>{drag=null;},{passive:true});
canvas.addEventListener('pointercancel',()=>{drag=null;},{passive:true});

function blankSave(){
  return{level:1,unlocked:0,gold:0,up:{skill:1,troop:1,armor:1},muted:false,diff:1,ach:{},
    bestBy:{},rankBy:{},shake:true,haptic:true};
}
let save=blankSave();
function loadSave(){
  let d=null;
  try{const raw=localStorage.getItem(SKEY);if(raw)d=JSON.parse(raw);}catch(e){}
  if(!d){
    try{const raw=localStorage.getItem(OLDKEY);if(raw)d=JSON.parse(raw);}catch(e){}
  }
  if(!d)return;
  save.level=clamp(d.level||1,1,6);
  save.unlocked=clamp(d.unlocked||0,0,6);
  save.gold=Math.max(0,d.gold||0);
  if(d.up)save.up={skill:Math.max(1,d.up.skill||1),troop:Math.max(1,d.up.troop||1),armor:Math.max(1,d.up.armor||1)};
  save.muted=!!d.muted;
  save.diff=[0,1,2,3].includes(d.diff)?d.diff:1;
  save.ach=d.ach&&typeof d.ach==='object'?d.ach:{};
  save.shake=d.shake!==false;
  save.haptic=d.haptic!==false;
  save.bestBy=d.bestBy&&typeof d.bestBy==='object'?d.bestBy:{};
  save.rankBy=d.rankBy&&typeof d.rankBy==='object'?d.rankBy:{};
  if(typeof d.best==='number'&&!save.bestBy[save.diff])save.bestBy[save.diff]=d.best;
  if(typeof d.rank==='string'&&!save.rankBy[save.diff]&&d.rank!=='C')save.rankBy[save.diff]=d.rank;
}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}

    dead:[mk('dead')]

function drawUnitArt(set,pose,frame,x,y,w,h,flip){
  const arr=set[pose]||set.idle;
  const im=arr[((frame|0)%arr.length+arr.length)%arr.length];
  const sx=Math.round(x),sy=Math.round(y);
  ctx.save();
  if(flip){ctx.translate(sx+w,sy);ctx.scale(-1,1);ctx.drawImage(im,0,0,w,h);}
  else ctx.drawImage(im,sx,sy,w,h);
  ctx.restore();
}

let enemies=[],troops=[],arrows=[],effects=[],floats=[],dust=[];

function fg(){return clamp(G.level-1,0,LEVELS.length-1);}
function diff(){return DIFFS[clamp(save.diff|0,0,DIFFS.length-1)];}
function bestFor(d){return save.bestBy[d]||0;}
function maxHpForArmor(){return 100+(P.armorLv-1)*12;}
function applyUpgrades(){
  P.skillLv=Math.max(1,save.up.skill|0);
  P.troopLv=Math.max(1,save.up.troop|0);
  P.armorLv=Math.max(1,save.up.armor|0);
  P.maxHp=maxHpForArmor();
}
function msg(txt,dur){G.message=txt;G.messageT=dur||2;}
function toast(txt,dur){G.toast=txt;G.toastT=dur||1.6;}
function banner(main,sub,dur){G.banner=main;G.bannerSub=sub||'';G.bannerT=dur||1.8;}
function setDiff(i){
  save.diff=clamp(i,0,DIFFS.length-1);persist();
  toast('难度 · '+DIFFS[save.diff].name+'（'+DIFFS[save.diff].lives+' 命）',1.2);SFX.ui();
}
function unlockAch(k){
  if(save.ach[k])return;
  save.ach[k]=true;persist();
  toast('成就解锁 · '+ACH[k],2.2);
  SFX.skill();
}
function rankOf(){
  let p=0;
  if(G.perf.hits===0)p+=3;else if(G.perf.hits<=3)p+=1;
  if(G.maxCombo>=20)p++;
  if(G.maxCombo>=40)p++;
  if(G.perf.kills>=12+G.level*2)p++;
  if(G.perf.time<LEVELS[fg()].targetTime)p++;
  return p>=6?'S':p>=4?'A':p>=2?'B':'C';
}
function shake(n){if(save.shake)G.shake=Math.max(G.shake,n);}
function addFX(x,y,kind,color,n,opt){
  const count=n||10;
  for(let i=0;i<count;i++){
    const e={
      x:x,y:y,vx:rnd(-170,170),vy:rnd(-230,30),
      life:rnd(.25,.75),max:.75,color:color||'#f5c451',
      size:rnd(2,5),kind:kind||'dot',ang:rnd(0,6.283),rot:rnd(-8,8)
    };
    if(opt)Object.assign(e,opt);
    effects.push(e);
  }
  if(effects.length>300)effects.splice(0,effects.length-300);
}
function floatText(x,y,txt,color,size){
  floats.push({x:x,y:y,txt:txt,color:color||'#f5c451',life:.95,max:.95,size:size||15});
  if(floats.length>44)floats.shift();
}
function addWarn(type,x,y,opt){
  G.warns.push(Object.assign({type:type,x:x,y:y,life:.55,max:.55},opt||{}));
  if(G.warns.length>40)G.warns.shift();
}

function newEnemy(type,x,y,elite){
  const c=ENEMY[type]||ENEMY.shield,d=diff();
  const hp=Math.round(c.hp*(1+G.level*.16)*d.hp*(elite?1.7:1));
  return{
    type:type,kind:c.kind,name:c.name,x:x,y:y,w:c.w,h:c.h,hp:hp,maxHp:hp,
    spd:c.spd*(1+G.level*.045)*d.spd,atk:c.atk*(1+G.level*.10)*d.dmg*(elite?1.25:1)*G.assist,
    range:c.range,wait:rnd(.4,1.4),state:'walk',t:0,hitT:0,stagger:0,kb:0,face:-1,
    dead:false,deadT:0,score:c.score,gold:c.gold,cool:c.cool,art:c.art,
    elite:!!elite,healT:rnd(2,4),next:'melee',windDur:.5,hitDone:false,slamR:86,anim:rnd(0,10)
  };
}
function newTroop(type,x,y){
  const lv=P.troopLv,c=TROOPS[type];
  const hp=Math.round((c.hp+lv*10)*(1+G.level*.06));
  return{
    type:c.key,name:c.name,x:x,y:y,w:46,h:72,hp:hp,maxHp:hp,
    spd:c.spd,atk:(c.atk+lv*2)*(1+G.level*.05),range:c.range,
    wait:rnd(.2,.7),state:'walk',t:0,hitT:0,kb:0,face:1,dead:false,healT:2.5,art:'troop_'+c.key,anim:rnd(0,10)
  };
}
function makeGate(){
  const hp=Math.round((240+G.level*95)*diff().hp);
  return{x:878,y:462,w:86,h:176,hp:hp,maxHp:hp};
}
function makeBoss(){
  const L=LEVELS[fg()];
  const hp=Math.round(L.bossHp*diff().hp);
  return{
    x:790,y:456,w:122,h:152,hp:hp,maxHp:hp,state:'intro',t:0,wait:1.4,face:-1,
    hitT:0,stagger:0,kb:0,phase:1,dead:false,atkT:0,next:'melee',windDur:.62,hitDone:false,
    anim:0
  };
}
function makeArrow(x,y,vx,vy,dmg,friendly,counter){
  arrows.push({x:x,y:y,vx:vx,vy:vy,life:2.4,dmg:dmg,friendly:!!friendly,counter:counter||null});
  if(arrows.length>110)arrows.shift();
}
function aimNearest(){
  let best=null,bd=1e9;
  for(const e of enemies){
    if(e.dead)continue;
    if(Math.abs(e.y-P.y)<110){
      const d=Math.abs(e.x-P.x);
      if(d<bd){bd=d;best=e;}
    }
  }
  if(best&&bd<260){P.face=best.x>=P.x?1:-1;return;}
  if(G.boss&&!G.boss.dead&&Math.abs(G.boss.y-P.y)<130&&Math.abs(G.boss.x-P.x)<340){
    P.face=G.boss.x>=P.x?1:-1;
  }else if((!best||bd>=260)&&G.gate&&Math.abs(G.gate.y-P.y)<130&&Math.abs(G.gate.x-P.x)<320){
    P.face=G.gate.x>=P.x?1:-1;
  }
}

function startNew(){
  AU.resume();
  G.level=1;G.score=0;G.gold=0;G.lives=diff().lives;
  G.assist=1;G.recentHits=0;G.hitWindow=0;
  save.gold=0;
  applyUpgrades();
  beginLevel();
  SFX.ui();
}
function continueGame(){
  if(!save.unlocked)return;
  AU.resume();
  G.level=clamp(save.unlocked||save.level||1,1,LEVELS.length);
  G.score=0;G.gold=save.gold||0;G.lives=diff().lives;
  G.assist=1;G.recentHits=0;G.hitWindow=0;
  applyUpgrades();
  beginLevel();
  SFX.ui();
}
function beginLevel(){
  const L=LEVELS[fg()];
  G.wave=0;G.waveMax=L.waves;G.spawnT=1.2;G.spawnQueue=[];G.stage=0;
  G.boss=null;G.gate=null;G.bossIntro=0;G.ambushT=L.hazard==='fog'?16:999;
  G.skillCd=0;G.finCd=0;G.finMeter=0;G.troopCd=0;
  G.combo=0;G.comboT=0;G.maxCombo=0;G.shake=0;G.flash=0;G.hitStop=0;
  G.messageT=0;G.bannerT=0;G.toastT=0;G.morale=0;G.moraleT=0;G.shopMsgT=0;
  G.perf={kills:0,time:0,hits:0,parries:0};
  G.rank='C';G.hazards=[];G.warns=[];
  enemies=[];troops=[];arrows=[];effects=[];floats=[];dust=[];
  P.x=180;P.y=440;P.vx=0;P.vy=0;P.face=1;P.state='idle';P.t=0;
  P.atkStep=0;P.queue=0;P.hitDone=false;P.inv=1.2;P.hitT=0;
  P.dodgeT=0;P.dodgeCd=0;P.block=false;P.blockT=0;P.guardBreak=0;
  P.stam=P.maxStam=100;P.stamDelay=0;P.finT=0;
  applyUpgrades();P.hp=P.maxHp;
  G.state='playing';
  save.level=G.level;
  save.unlocked=Math.max(save.unlocked,G.level);
  persist();refreshUI();
  msg('第 '+G.level+' 关 · '+L.name+' · '+HAZARD_NAME[L.hazard],2.6);
  banner(L.name,L.sub,1.8);
  MUS.start();
}
function restartLevel(){
  if(G.state==='paused')G.state='playing';
  const score=G.score,gold=G.gold,lives=G.lives;
  beginLevel();
  G.score=score;G.gold=gold;G.lives=lives;
  MUS.start();
}
function nextLevel(){
  if(G.level>=LEVELS.length){winGame();return;}
  G.level++;
  beginLevel();
  SFX.ui();
}
function gameOver(){
  G.state='over';G.result='GAME OVER';MUS.stop();SFX.die();
  save.gold=G.gold;
  save.bestBy[save.diff]=Math.max(bestFor(save.diff),G.score);
  const rk=save.rankBy[save.diff];
  if(!rk||RANK_ORDER[G.rank]>(RANK_ORDER[rk]||0))save.rankBy[save.diff]=G.rank;
  persist();refreshUI();
}
function winGame(){
  G.state='win';G.result='ALL CLEAR';MUS.stop();
  unlockAch('allclear');
  save.unlocked=Math.max(save.unlocked,LEVELS.length);
  save.level=LEVELS.length;
  save.gold=G.gold;
  save.bestBy[save.diff]=Math.max(bestFor(save.diff),G.score);
  const rk=save.rankBy[save.diff];
  if(!rk||RANK_ORDER[G.rank]>(RANK_ORDER[rk]||0))save.rankBy[save.diff]=G.rank;
  persist();refreshUI();SFX.win();
}
function defeatBoss(){
  if(!G.boss||G.boss.dead)return;
  const b=G.boss;
  b.dead=true;G.boss=null;
  G.score+=900+G.level*320;
  G.gold+=90+G.level*22;
  addFX(b.x,b.y-b.h*.5,'ring','#f5c451',44);
  addFX(b.x,b.y-b.h*.5,'shock','#ffd24a',34);
  addFX(b.x,b.y-b.h*.5,'slash','#ffd24a',24);
  shake(18);G.flash=.55;G.hitStop=.2;
  G.rank=rankOf();
  if(G.perf.hits===0)unlockAch('noHit');
  if(G.rank==='S')unlockAch('srank');
  unlockAch('first');
  save.unlocked=Math.max(save.unlocked,Math.min(LEVELS.length,G.level+1));
  save.level=Math.min(LEVELS.length,G.level+1);
  save.gold=G.gold;
  save.bestBy[save.diff]=Math.max(bestFor(save.diff),G.score);
  const rk=save.rankBy[save.diff];
  if(!rk||RANK_ORDER[G.rank]>(RANK_ORDER[rk]||0))save.rankBy[save.diff]=G.rank;
  persist();refreshUI();
  G.state='shop';G.shopMsg='';G.shopMsgT=0;
  MUS.stop();SFX.win();
}
function loseLife(){
  G.lives--;
  if(G.lives<=0){gameOver();return;}
  P.hp=P.maxHp;P.inv=2.2;P.stam=P.maxStam;P.block=false;P.state='idle';
  P.guardBreak=0;P.dodgeT=0;P.finT=0;P.t=0;
  P.x=180;P.y=440;
  G.combo=0;G.comboT=0;
  G.assist=Math.max(.7,G.assist-.05);
  arrows=arrows.filter(a=>a.friendly);
  for(const e of enemies){
    if(Math.abs(e.x-P.x)<170)e.x=clamp(e.x+(e.x>=P.x?1:-1)*190,LEFT-40,RIGHT+50);
  }
  msg('再战！',1.5);toast('援军接应 · 继续奋战',1.8);SFX.die();shake(10);
}
function damagePlayer(raw,src){
  if(G.state!=='playing'||P.inv>0)return;
  if(P.block){
    if(P.blockT<0.26){
      G.perf.parries++;
      if(G.perf.parries>=10)unlockAch('parry');
      P.stam=Math.min(P.maxStam,P.stam+8);
      G.finMeter=clamp(G.finMeter+8,0,100);
      G.hitStop=Math.max(G.hitStop,.06);G.flash=.14;
      addFX(P.x+P.face*32,P.y-42,'ring','#8fd8ff',16);
      floatText(P.x,P.y-66,'完美格挡','#8fd8ff',20);
      SFX.parry();vib(15);
      if(src&&!src.dead&&src!==G.gate){
        src.stagger=Math.max(src.stagger||0,1.0);
        src.hitT=.35;src.kb=P.face*150;
      }
      return;
    }
    const dmg=Math.max(1,Math.round(raw*.18));
    P.stam-=raw*2.4;P.stamDelay=.5;
    P.hp-=dmg;P.hitT=.1;P.inv=.3;
    floatText(P.x,P.y-58,'格挡 -'+dmg,'#8fd8ff',16);
    addFX(P.x+P.face*26,P.y-36,'ring','#8fd8ff',8);
    SFX.hit();vib(8);
    if(P.stam<=0)breakGuard();
    if(P.hp<=0){P.hp=0;loseLife();}
    return;
  }
  const dmg=Math.max(1,Math.round(raw*(1-(P.armorLv-1)*.035)));
  P.hp-=dmg;P.inv=.85;P.hitT=.3;P.state='hurt';P.t=0;
  G.combo=0;G.comboT=0;
  G.perf.hits++;
  G.recentHits++;G.hitWindow=6;
  if(G.recentHits>=6&&G.assist>.7){
    G.assist=Math.max(.7,G.assist-.08);G.recentHits=0;
    toast('敌军士气动摇 · 承受伤害降低',2);
  }
  G.flash=.2;shake(9);vib(25);
  addFX(P.x+P.w/2,P.y-42,'dot','#e0503c',14);
  floatText(P.x,P.y-62,'-'+dmg,'#ff6a58',22);
  SFX.hurt();
  if(P.hp<=0){P.hp=0;loseLife();}
}
function breakGuard(){
  P.stam=0;P.guardBreak=.85;P.block=false;P.state='guardbreak';P.t=0;
  msg('破防！',1.2);toast('格挡被击破',1.4);
  SFX.guard();shake(6);vib(30);
}
function hitFX(e,dmg,color){
  G.combo++;G.comboT=2.2;
  if(G.combo>G.maxCombo)G.maxCombo=G.combo;
  if(G.combo>=20)unlockAch('combo20');
  if(troops.length>=3)unlockAch('legion');
  if(P.finT<=0)G.finMeter=clamp(G.finMeter+4.5,0,100);
  G.morale=clamp(G.morale+2,0,100);
  if(G.moraleT<=0&&G.morale>=100)triggerMorale();
  G.score+=Math.round(dmg*2*(1+Math.min(5,Math.floor(G.combo/8))));
  G.hitStop=Math.max(G.hitStop,.026);
  addFX(e.x,Math.max(60,e.y-e.h*.55),'dot',color||'#ffd24a',6);
  floatText(e.x,e.y-e.h-4,String(Math.round(dmg)),'#ffe08a',14+Math.min(8,Math.round(dmg*.08)));
  if(G.combo>0&&G.combo%20===0)toast(G.combo+' 连斩！',1.1);
  SFX.hit();
}
function triggerMorale(){
  G.morale=0;G.moraleT=8;
  msg('奋勇！全军突击',1.8);
  toast('全军士气高涨 · 伤害与速度提升',2);
  addFX(P.x,P.y-24,'ring','#f5c451',28);
  SFX.skill();vib(20);
}
function killEnemy(e){
  if(!e||e.dead||e.hp>=1)return;
  e.dead=true;e.deadT=0;
  G.perf.kills++;
  const mult=1+Math.min(5,Math.floor(G.combo/8));
  const sc=Math.round(e.score*mult);
  G.score+=sc;G.gold+=e.gold;
  if(P.finT<=0)G.finMeter=clamp(G.finMeter+5,0,100);
  addFX(e.x,e.y-e.h*.5,'dot','#f5c451',12);
  addFX(e.x,e.y-e.h*.5,'coin','#f5c451',3);
  floatText(e.x,e.y-e.h,'+'+sc,'#f5c451',14);
}
function switchWeapon(d){
  if(G.state!=='playing')return;
  P.weapon=((P.weapon+d)%WEAPONS.length+WEAPONS.length)%WEAPONS.length;
  toast('武器 · '+WEAPONS[P.weapon].name+'（'+WEAPONS[P.weapon].skill+'）',1.3);
  SFX.ui();
}
function setTroop(t){
  if(G.state!=='playing')return;
  G.troopType=clamp(t,0,TROOPS.length-1);
  toast('兵种 · '+TROOPS[G.troopType].name,1.1);
  SFX.ui();
}
function cycleTroop(){
  if(G.state!=='playing')return;
  G.troopType=(G.troopType+1)%TROOPS.length;
  toast('兵种 · '+TROOPS[G.troopType].name,1.1);
  SFX.ui();
}
function cancelBlock(){
  KB.block=false;TACT.block=0;P.block=false;P.blockT=0;
}
function doAttack(){
  if(G.state!=='playing')return;
  if(P.block)cancelBlock();
  if(P.dodgeT>0||P.finT>0||P.guardBreak>0||P.state==='hurt')return;
  const w=WEAPONS[P.weapon];
  if(P.state==='atk'){
    if(P.queue<2)P.queue++;
    return;
  }
  if(P.state!=='idle'&&P.state!=='walk')return;
  if(!act('left')&&!act('right'))aimNearest();
  P.atkStep=(P.atkStep+1)%w.steps;
  P.state='atk';P.t=0;P.hitDone=false;P.queue=0;
  SFX[P.atkStep===w.steps-1?'heavy':'slash']();
}
function attackHit(){
  const w=WEAPONS[P.weapon];
  const reach=(96+P.atkStep*16)*w.reach;
  let any=false;
  for(const e of enemies){
    if(e.dead)continue;
    const fw=(e.x-P.x)*P.face;
    if(fw>-24&&fw<reach&&Math.abs(e.y-P.y)<66){
      const dmg=Math.max(1,Math.round((8+P.atkStep*5+G.level*1.2+P.skillLv*1.2)*w.dmg*(G.moraleT>0?1.3:1)));
      e.hp-=dmg;e.hitT=.22;
      e.stagger=Math.max(e.stagger,.22);
      e.kb=P.face*w.kb*(P.atkStep===w.steps-1?1.5:1);
      hitFX(e,dmg);any=true;
    }
  }
  if(G.boss){
    const fw=(G.boss.x-P.x)*P.face;
    if(fw>-30&&fw<reach*1.25&&Math.abs(G.boss.y-P.y)<86){
      const dmg=Math.max(1,Math.round((8+P.atkStep*5+G.level*1.2+P.skillLv*1.2)*w.dmg*1.05*(G.moraleT>0?1.3:1)));
      G.boss.hp-=dmg;G.boss.hitT=.2;G.boss.stagger=Math.max(G.boss.stagger||0,.06);
      hitFX(G.boss,dmg);any=true;
    }
  }
  if(G.gate){
    const fw=(G.gate.x-P.x)*P.face;
    if(fw>-40&&fw<reach*1.4&&Math.abs(G.gate.y-P.y)<105){
      const dmg=Math.max(1,Math.round((8+P.atkStep*5+G.level*1.2+P.skillLv*1.2)*w.dmg));
      G.gate.hp-=dmg;
      addFX(G.gate.x-20,G.gate.y-70,'dot','#e8c08a',5);
      any=true;
    }
  }
  if(any)shake(3);
}
function doSkill(){
  if(G.state!=='playing'||G.skillCd>0||P.dodgeT>0||P.finT>0||P.guardBreak>0)return;
  if(P.block)cancelBlock();
  const w=WEAPONS[P.weapon];
  G.skillCd=Math.max(4,9-P.skillLv*.55);
  const R=205*w.reach;
  const base=(30+P.skillLv*11+G.level*4)*w.dmg;
  for(const e of enemies){
    if(e.dead)continue;
    if(Math.hypot(e.x-P.x,(e.y-P.y)*1.35)<R*1.05){
      const dmg=Math.max(1,Math.round(base));
      e.hp-=dmg;e.hitT=.35;e.stagger=Math.max(e.stagger,.5);
      e.kb=(e.x>=P.x?1:-1)*220;
      hitFX(e,dmg,w.color);
    }
  }
  if(G.boss&&Math.hypot(G.boss.x-P.x,(G.boss.y-P.y)*1.3)<R+40){
    const dmg=Math.max(1,Math.round(base*1.15));
    G.boss.hp-=dmg;G.boss.hitT=.35;G.boss.stagger=Math.max(G.boss.stagger,.2);
    hitFX(G.boss,dmg,w.color);
  }
  if(G.gate&&Math.abs(G.gate.x-P.x)<R)G.gate.hp-=Math.round(base);
  addFX(P.x,P.y-26,'ring',w.color,30);
  for(let i=0;i<8;i++){
    const a=i/8*6.283;
    addFX(P.x+Math.cos(a)*90,P.y-24+Math.sin(a)*50,'slash',w.color,3,{ang:a});
  }
  G.flash=.2;shake(9);G.hitStop=.055;
  P.inv=Math.max(P.inv,.3);
  floatText(P.x,P.y-76,w.skill,w.color,22);
  SFX.skill();vib(20);
}
function doFin(){
  if(G.state!=='playing'||G.finMeter<100||G.finCd>0||P.guardBreak>0)return;
  if(P.block)cancelBlock();
  const w=WEAPONS[P.weapon];
  G.finMeter=0;G.finCd=1.2;
  P.inv=Math.max(P.inv,1.05);P.finT=.75;P.state='idle';P.t=0;
  G.hitStop=.15;G.flash=.5;shake(18);
  const R=380;
  let kills=0;
  for(const e of enemies){
    if(e.dead)continue;
    if(Math.hypot(e.x-P.x,(e.y-P.y)*1.3)<R){
      const dmg=Math.max(1,Math.round((70+G.level*12+P.skillLv*8)*w.dmg));
      e.hp-=dmg;e.hitT=.45;e.stagger=1;e.kb=(e.x>=P.x?1:-1)*280;
      hitFX(e,dmg,'#ffd24a');
      if(e.hp<=0){killEnemy(e);kills++;}
    }
  }
  if(G.boss&&Math.hypot(G.boss.x-P.x,(G.boss.y-P.y)*1.3)<R+60){
    const dmg=Math.max(1,Math.round((100+G.level*16+P.skillLv*6)*w.dmg));
    G.boss.hp-=dmg;G.boss.hitT=.5;G.boss.stagger=Math.max(G.boss.stagger,.5);
    hitFX(G.boss,dmg,'#ffd24a');
  }
  if(G.gate&&Math.abs(G.gate.x-P.x)<R)G.gate.hp-=Math.round((80+G.level*10)*w.dmg);
  for(let i=0;i<14;i++){
    const a=i/14*6.283;
    addFX(P.x+Math.cos(a)*130,P.y-30+Math.sin(a)*76,'slash','#ffd24a',4,{ang:a});
  }
  addFX(P.x,P.y-42,'ring','#ffd24a',44);
  addFX(P.x,P.y-42,'shock','#ff7a3c',28);
  floatText(P.x,P.y-92,'无双乱舞','#ffd24a',30);
  if(kills>=5)unlockAch('musou');
  SFX.musou();vib([20,30,40]);
}
function tryFin(ang){
  if(G.state!=='playing'||G.finMeter<100||G.finCd>0)return;
  if(ang<-Math.PI/2&&P.face>0)P.face=-1;
  else if(ang>-Math.PI/2&&ang<Math.PI/2&&P.face<0)P.face=1;
  doFin();
}
function doDodge(){
  if(G.state!=='playing'||P.dodgeCd>0||P.finT>0||P.guardBreak>0||P.state==='hurt')return;
  if(P.block)cancelBlock();
  if(P.stam<18){toast('体力不足 · 无法闪避',1);SFX.ui();return;}
  P.stam-=18;P.stamDelay=.35;
  let dx=0,dy=0;
  if(act('left'))dx-=1;
  if(act('right'))dx+=1;
  if(act('up'))dy-=1;
  if(act('down'))dy+=1;
  if(!dx&&!dy)dx=-P.face;
  const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  P.dodgeT=.32;P.dodgeCd=.62;P.inv=Math.max(P.inv,.35);P.state='idle';P.t=0;
  P.dodgeVX=dx*250;P.dodgeVY=dy*180;
  addFX(P.x,P.y-20,'ring','#cfe8ff',8);
  SFX.arrow();vib(8);
}
function doSummon(){
  if(G.state!=='playing'||G.troopCd>0)return;
  const c=TROOPS[G.troopType];
  if(troops.length>=MAXTROOP){toast('兵力已满',1.1);SFX.ui();return;}
  if(G.gold<c.cost){toast('金币不足 · 需要 '+c.cost,1.2);SFX.ui();return;}
  G.gold-=c.cost;
  G.troopCd=Math.max(2.5,7-P.troopLv*.55);
  const n=1+Math.floor(P.troopLv/3);
  for(let i=0;i<n&&troops.length<MAXTROOP;i++){
    troops.push(newTroop(G.troopType,P.x-rnd(8,44),P.y+rnd(-16,16)));
  }
  if(troops.length>=3)unlockAch('legion');
  addFX(P.x,P.y-16,'ring','#f5c451',14);
  SFX.summon();
  floatText(P.x,P.y-66,'召唤 '+c.name,'#f5c451',16);
}
function togglePause(){
  if(G.state==='playing'){
    G.state='paused';P.block=false;
    for(const k in KB)KB[k]=false;
    for(const k in TACT)TACT[k]=0;
    MUS.stop();
  }else if(G.state==='paused'){
    G.state='playing';MUS.start();
  }
}
function toggleSound(){
  AU.resume();
  AU.setMuted(!AU.muted);
  save.muted=AU.muted;persist();refreshUI();
  if(!AU.muted)SFX.ui();
}
function buySupply(){
  if(G.state!=='shop')return;
  const cost=60+G.level*15;
  if(G.gold<cost){showShopMsg('金币不足 · 需要 '+cost);SFX.ui();return;}
  G.gold-=cost;G.lives++;
  save.gold=G.gold;persist();
  showShopMsg('求援成功 · 生命 +1');SFX.heal();
}
function upgrade(k){
  if(G.state!=='shop')return;
  const lv=k===0?P.skillLv:(k===1?P.troopLv:P.armorLv);
  const cost=k===0?40*lv:(k===1?35*lv:30*lv);
  if(G.gold<cost){showShopMsg('金币不足 · 需要 '+cost);SFX.ui();return;}
  G.gold-=cost;
  if(k===0){P.skillLv++;save.up.skill=P.skillLv;}
  else if(k===1){P.troopLv++;save.up.troop=P.troopLv;}
  else{P.armorLv++;save.up.armor=P.armorLv;P.maxHp=maxHpForArmor();P.hp=P.maxHp;}
  save.gold=G.gold;persist();
  showShopMsg('升级成功 · '+['技能','兵种','护甲'][k]+' Lv.'+[P.skillLv,P.troopLv,P.armorLv][k]);
  SFX.levelup();vib(15);
}
function showShopMsg(t){G.shopMsg=t;G.shopMsgT=2.2;}

function spawnEnemy(type,elite){
  if(enemies.filter(e=>!e.dead).length>=MAXENEMY)return;
  const side=1;
  const x=RIGHT+52;
  const y=rnd(GY0+34,GY1-14);
  const e=newEnemy(type,x,y,elite);
  e.face=-side;e.entering=.8;
  enemies.push(e);
  addWarn('edge',x,y,{side:side,life:.7,max:.7});
}
function buildWave(){
  const L=LEVELS[fg()];
  const count=3+G.wave+Math.floor(G.level*.8);
  G.spawnQueue=[];
  for(let i=0;i<count;i++){
    const type=pick(L.pool);
    const elite=(i===count-1&&G.wave>=2&&Math.random()<.4)||Math.random()<.05+G.level*.01;
    G.spawnQueue.push({type:type,elite:elite,gap:rnd(.28,.55)});
  }
  if(L.elite>0&&G.wave>=L.waves-1){
    for(let i=0;i<L.elite;i++)G.spawnQueue.push({type:'captain',elite:true,gap:.7});
  }
  G.spawnT=.2;
}
function breakGate(){
  if(!G.gate)return;
  const gx=G.gate.x,gy=G.gate.y;
  G.gate=null;
  addFX(gx-10,gy-80,'shock','#e8c08a',34);
  addFX(gx-10,gy-60,'ring','#f5c451',26);
  shake(16);G.flash=.3;
  const L=LEVELS[fg()];
  G.boss=makeBoss();G.bossIntro=1.6;
  banner('BOSS · '+L.bossName,'万军之中取上将首级',2.4);
  msg('城门已破 · '+L.bossName+' 现身',2.4);
  SFX.warn();MUS.stop();setTimeout(()=>{if(G.state==='playing')MUS.start();},400);
}
function nearestFoe(e){
  let best=null,bd=1e9;
  const consider=(o,isP)=>{
    const d=Math.hypot(o.x-e.x,(o.y-e.y)*1.15);
    if(d<bd){bd=d;best={x:o.x,y:o.y,obj:o,player:isP};}
  };
  consider(P,true);
  for(const t of troops)if(!t.dead)consider(t,false);
  return best;
}
function clampEnemy(e){
  e.x=clamp(e.x,LEFT-80,RIGHT+70);
  e.y=clamp(e.y,GY0+16,GY1-4);
}
function enemyMeleeHit(e,range,dmg,spread){
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy);
  if(d<range+26&&Math.abs(dy)<64){
    damagePlayer(dmg,e);
  }
  for(const t of troops){
    if(t.dead)continue;
    if(Math.hypot(t.x-e.x,(t.y-e.y)*1.1)<range+18)damageTroop(t,dmg*.8);
  }
  addFX(e.x+e.face*24,e.y-26,'slash','#ff8a6a',4,{ang:e.face>0?0:Math.PI});
}
function damageTroop(t,dmg){
  if(t.dead)return;
  t.hp-=dmg;t.hitT=.2;
  floatText(t.x,t.y-58,'-'+Math.round(dmg),'#ff8a6a',12);
  if(t.hp<=0){t.dead=true;t.deadT=0;addFX(t.x,t.y-20,'dot','#8fd8ff',10);SFX.die();}
}
function updatePlayer(dt){
  P.t+=dt;
  P.inv=Math.max(0,P.inv-dt);
  P.hitT=Math.max(0,P.hitT-dt);
  P.dodgeCd=Math.max(0,P.dodgeCd-dt);
  G.skillCd=Math.max(0,G.skillCd-dt);
  G.finCd=Math.max(0,G.finCd-dt);
  G.troopCd=Math.max(0,G.troopCd-dt);
  P.guardBreak=Math.max(0,P.guardBreak-dt);
  G.comboT=Math.max(0,G.comboT-dt);
  if(G.comboT<=0)G.combo=0;
  G.moraleT=Math.max(0,G.moraleT-dt);
  if(G.moraleT<=0)G.morale=0;
  G.hitWindow=Math.max(0,G.hitWindow-dt);
  if(G.hitWindow<=0)G.recentHits=0;
  P.stamDelay=Math.max(0,P.stamDelay-dt);
  if(P.finT>0){
    P.finT-=dt;
    if(P.finT<=0){P.state='idle';P.t=0;}
  }
  if(P.dodgeT>0){
    P.dodgeT-=dt;
    P.x+=P.dodgeVX*dt;P.y+=P.dodgeVY*dt;
    if(P.dodgeT<=0)P.inv=Math.max(P.inv,.12);
  }else if(P.state==='atk'){
    const w=WEAPONS[P.weapon];
    const dur=.32*w.spd;
    if(!P.hitDone&&P.t>=dur*.42){
      P.hitDone=true;attackHit();
    }
    if(P.t>=dur){
      if(P.queue>0){P.queue--;P.atkStep=(P.atkStep+1)%w.steps;P.t=0;P.hitDone=false;SFX.slash();}
      else{P.state='idle';P.t=0;P.atkStep=0;}
    }
  }else if(P.state==='hurt'){
    if(P.t>.32){P.state='idle';P.t=0;}
  }else if(P.state==='guardbreak'){
    if(P.t>=P.guardBreak){P.state='idle';P.t=0;}
  }
  const canBlock=(P.state==='idle'||P.state==='walk')&&P.stam>0&&P.guardBreak<=0&&P.dodgeT<=0&&P.finT<=0;
  P.block=canBlock&&act('block');
  if(P.block){
    P.blockT+=dt;
    if(P.stamDelay<=0)P.stam=Math.max(0,P.stam-4*dt);
    if(P.stam<=0)breakGuard();
  }else{
    P.blockT=0;
    if(P.stamDelay<=0)P.stam=Math.min(P.maxStam,P.stam+24*dt);
  }
  let mx=0,my=0;
  if(P.dodgeT<=0&&P.finT<=0&&P.state!=='hurt'&&P.state!=='guardbreak'){
    if(STICK.active){mx=STICK.x;my=STICK.y;}
    else{
      if(act('left'))mx--;
      if(act('right'))mx++;
      if(act('up'))my--;
      if(act('down'))my++;
    }
    if(mx&&my&&!STICK.active){mx*=.7071;my*=.7071;}
    if(mx)P.face=mx>0?1:-1;
  }
  const canMove=!P.block&&P.state!=='atk'&&P.dodgeT<=0&&P.finT<=0&&P.state!=='hurt'&&P.state!=='guardbreak';
  const spd=225*(G.moraleT>0?1.15:1);
  if(canMove){
    P.x+=mx*spd*dt;P.y+=my*spd*dt;
    if(mx||my){
      P.state='walk';
      if(Math.random()<dt*10){
        dust.push({x:P.x+rnd(-14,14),y:P.y-2,vx:rnd(-30,30),vy:rnd(-40,-10),life:.4,max:.4,size:rnd(2,4)});
      }
    }else if(P.state==='walk')P.state='idle';
  }
  if(P.state==='idle'||P.state==='walk')aimNearest();
  P.x=clamp(P.x,LEFT+16,RIGHT-16);
  P.y=clamp(P.y,PYMIN,PYMAX);
  if(act('atk')&&P.state!=='atk'&&!P.block&&P.dodgeT<=0&&P.finT<=0&&P.guardBreak<=0){
    if(P.state==='idle'||P.state==='walk')doAttack();
  }
}
function updateEnemies(dt){
  for(const e of enemies){
    e.anim+=dt*6;
    if(e.dead){e.deadT+=dt;continue;}
    e.hitT=Math.max(0,e.hitT-dt);
    e.kb*=Math.max(0,1-9*dt);
    if(e.stagger>0){
      e.stagger-=dt;e.x+=e.kb*dt;clampEnemy(e);continue;
    }
    e.wait=Math.max(0,e.wait-dt);
    const tgt=nearestFoe(e);
    if(!tgt)continue;
    const dx=tgt.x-e.x,dy=tgt.y-e.y,d=Math.hypot(dx,dy);
    e.face=dx>=0?1:-1;
    if(e.state==='wind'){
      e.t+=dt;
      if(e.t>=e.windDur){
        e.state='cool';e.wait=e.cool;e.t=0;
        if(e.kind==='archer'){
          const ang=Math.atan2(tgt.y-e.y,tgt.x-e.x);
          makeArrow(e.x+e.face*16,e.y-40,Math.cos(ang)*310,Math.sin(ang)*310,e.atk,false);
        }else if(e.kind==='healer'){
          const ally=e.healTarget;
          if(ally&&!ally.dead&&Math.hypot(ally.x-e.x,ally.y-e.y)<260){
            ally.hp=Math.min(ally.maxHp,ally.hp+Math.round(7+G.level*2));
            addFX(ally.x,ally.y-ally.h*.5,'ring','#8ff0e0',10);
            floatText(ally.x,ally.y-ally.h,'+治疗','#8ff0e0',13);
          }
        }else if(e.kind==='cavalry'){
          e.state='charge';e.t=0;e.hitDone=false;
          const ca=Math.atan2(e.aimY-e.y,e.aimX-e.x);
          e.cvx=Math.cos(ca)*360;e.cvy=Math.sin(ca)*260;
        }else if(e.kind==='slam'){
          if(Math.hypot(P.x-e.aimX,P.y-e.aimY)<e.slamR+18)damagePlayer(e.atk,e);
          for(const t of troops)if(!t.dead&&Math.hypot(t.x-e.aimX,t.y-e.aimY)<e.slamR)damageTroop(t,e.atk);
          addFX(e.aimX,e.aimY-16,'shock','#e8c08a',18);shake(7);SFX.heavy();
        }else{
          enemyMeleeHit(e,e.range,e.atk);
        }
      }
      continue;
    }
    if(e.state==='charge'){
      e.t+=dt;
      e.x+=e.cvx*dt;e.y+=e.cvy*dt;
      if(!e.hitDone&&Math.hypot(P.x-e.x,P.y-e.y)<62){e.hitDone=true;damagePlayer(e.atk*1.25,e);shake(5);}
      for(const t of troops)if(!t.dead&&!e.hitDone&&Math.hypot(t.x-e.x,t.y-e.y)<56){e.hitDone=true;damageTroop(t,e.atk);}
      if(e.t>.42){e.state='cool';e.wait=e.cool*.9;e.t=0;}
      clampEnemy(e);
      continue;
    }
    if(e.state==='cool'){
      if(e.wait<=0)e.state='walk';
      continue;
    }
    if(e.kind==='archer'){
      if(d<160){e.x-=Math.sign(dx)*e.spd*.7*dt;e.y+=(dy>0?1:-1)*e.spd*.25*dt;}
      else if(d>290){e.x+=Math.sign(dx)*e.spd*.6*dt;}
      else e.y+=(P.y>e.y?1:-1)*e.spd*.35*dt;
      if(e.wait<=0&&d<340){
        e.state='wind';e.t=0;e.windDur=.55;
        addWarn('line',e.x,e.y-40,{ang:Math.atan2(dy,dx),len:d+40,width:16,life:.55,max:.55});
        SFX.warn();
      }
    }else if(e.kind==='healer'){
      const ally=lowestAlly(e);
      if(d<190)e.x-=Math.sign(dx)*e.spd*.8*dt;
      else if(d>300)e.x+=Math.sign(dx)*e.spd*.5*dt;
      if(e.wait<=0&&ally&&ally.hp<ally.maxHp*.85){
        e.healTarget=ally;e.state='wind';e.t=0;e.windDur=.6;
        addWarn('line',e.x,e.y-36,{ang:Math.atan2(ally.y-e.y,ally.x-e.x),len:260,width:12,color:'#8ff0e0',life:.6,max:.6});
        SFX.warn();
      }
    }else if(e.kind==='cavalry'){
      if(d<280&&e.wait<=0&&Math.abs(dy)<120){
        e.state='wind';e.t=0;e.windDur=.45;e.aimX=tgt.x;e.aimY=tgt.y;
        const ang=Math.atan2(tgt.y-e.y,tgt.x-e.x);
        addWarn('line',e.x,e.y-30,{ang:ang,len:320,width:22,life:.45,max:.45});
        SFX.warn();
      }else if(e.state!=='wind'&&d>e.range){

function update(dt){
  if(G.state!=='playing'){
    updateDecor(dt);
    updateEffects(dt);
    return;
  }
  for(const en of enemies)if(en.hp<1&&!en.dead)killEnemy(en);
  if(G.boss&&G.boss.hp<1&&!G.boss.dead)defeatBoss();
  if(G.hitStop>0){G.hitStop-=dt;dt*=.3;}
  G.time+=dt;
  G.shake=Math.max(0,G.shake-dt*40);
  G.flash=Math.max(0,G.flash-dt*2.4);
  G.messageT=Math.max(0,G.messageT-dt);
  G.toastT=Math.max(0,G.toastT-dt);
  G.bannerT=Math.max(0,G.bannerT-dt);
  G.perf.time+=dt;
  updatePlayer(dt);
  if(G.state!=='playing')return;
  if(!G.gate&&!G.boss){
    if(G.spawnQueue.length){
      G.spawnT-=dt;
      if(G.spawnT<=0){
        const item=G.spawnQueue.shift();
        spawnEnemy(item.type,item.elite);
        G.spawnT=item.gap;
      }
    }else if(!enemies.some(e=>!e.dead)){
      if(G.wave<G.waveMax){
        G.wave++;
        buildWave();
        msg('第 '+G.wave+' / '+G.waveMax+' 波',1.5);
      }else{
        G.gate=makeGate();
        msg('城门出现 · 击破城门！',2.2);
        toast('攻破城门可逼出敌将',2);
        SFX.warn();
      }
    }
  }
  updateEnemies(dt);
  updateBoss(dt);
  updateTroops(dt);
  updateArrows(dt);
  updateHazards(dt);
  updateEffects(dt);
  if(G.state!=='playing')return;
  if(G.gate&&G.gate.hp<1)breakGate();
  if(G.boss&&!G.boss.dead&&G.boss.hp<1)defeatBoss();
  if(G.state!=='playing')return;
  for(const en of enemies)if(en.hp<1&&!en.dead)killEnemy(en);
  if(G.gate&&G.gate.hp<1)breakGate();
  if(G.boss&&!G.boss.dead&&G.boss.hp<1)defeatBoss();
  enemies=enemies.filter(e=>!e.dead||e.deadT<.75);
  troops=troops.filter(t=>!t.dead||t.deadT<.6);
  if(P.hp<=0&&G.state==='playing')loseLife();
}

function rr(x,y,w,h,r){
  const k=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+k,y);ctx.lineTo(x+w-k,y);ctx.quadraticCurveTo(x+w,y,x+w,y+k);
  ctx.lineTo(x+w,y+h-k);ctx.quadraticCurveTo(x+w,y+h,x+w-k,y+h);
  ctx.lineTo(x+k,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-k);
  ctx.lineTo(x,y+k);ctx.quadraticCurveTo(x,y,x+k,y);
  ctx.closePath();
}

function renderGame(){
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.clearRect(0,0,VW,VH);
  const sh=G.shake;
  ctx.save();
  if(sh>0.2)ctx.translate(rnd(-sh,sh),rnd(-sh,sh));
  drawBackground();
  if(G.state!=='menu'){
    drawHazards();
    drawGate();
    drawWarns();
    drawDust();
    for(const t of troops)drawTroop(t);
    for(const e of enemies)drawEnemy(e);
    drawBoss();
    drawPlayer();
    drawArrows();
    drawEffects();
  }else{
    drawDust();
  }
  ctx.restore();
  if(G.state!=='menu')drawAtmosphere();
  if(G.flash>0){
    ctx.fillStyle='rgba(255,240,200,'+Math.min(.55,G.flash).toFixed(2)+')';
    ctx.fillRect(0,0,VW,VH);
  }
  if(G.state==='playing'||G.state==='paused')drawHUD();
  uiButtons=[];
  if(G.state==='menu')drawMenu();
  else if(G.state==='shop')drawShop();
  else if(G.state==='paused')drawPause();
  else if(G.state==='over')drawOver();
  else if(G.state==='win')drawWin();
  if(G.state==='playing'||G.state==='paused')drawBannerAndToast();
}
let fullBusy=false;
async function lockLandscape(){
  const so=screen&&screen.orientation;
  if(!so||!so.lock)return false;
  try{ await so.lock('landscape'); return true; }
  catch(e){
    try{ await so.lock('landscape-primary'); return true; }
    catch(e2){ return false; }
  }
}
async function toggleFullscreen(){
  if(fullBusy)return;
  fullBusy=true;
  const d=document;
  try{
    if(!d.fullscreenElement&&!d.webkitFullscreenElement){
      const el=d.documentElement;
      const req=el.requestFullscreen||el.webkitRequestFullscreen;
      if(req){ try{ await req.call(el); }catch(e){} }
      const locked=await lockLandscape();
      document.body.classList.add('fullscreen');
      setTimeout(resize,150);
      if(!locked)toast('无法自动锁定方向，请手动旋转手机',2.2);
    }else{
      const so=screen&&screen.orientation;
      if(so&&so.unlock){ try{ so.unlock(); }catch(e){} }
      const ex=d.exitFullscreen||d.webkitExitFullscreen;
      if(ex){ try{ await ex.call(d); }catch(e){} }
      document.body.classList.remove('fullscreen');
      setTimeout(resize,150);
    }
  }finally{ fullBusy=false; }
}
$('cNew').onclick=()=>{AU.resume();startNew();};
$('cCont').onclick=()=>continueGame();
$('cSound').onclick=()=>toggleSound();
$('cPause').onclick=()=>{if(G.state==='playing'||G.state==='paused')togglePause();};
$('cFull').onclick=()=>toggleFullscreen();
$('cExitFull').onclick=()=>{
  const so=screen&&screen.orientation;
  if(so&&so.unlock){try{so.unlock();}catch(e){}}
  if(document.fullscreenElement||document.webkitFullscreenElement){
    const ex=document.exitFullscreen||document.webkitExitFullscreen;
    if(ex)ex.call(document);
  }else document.body.classList.remove('fullscreen');
};
$('cBack').onclick=()=>{location.href='../../';};
function syncFullClass(){
  const on=!!(document.fullscreenElement||document.webkitFullscreenElement);
  document.body.classList.toggle('fullscreen',on);
  setTimeout(resize,80);
}
document.addEventListener('fullscreenchange',syncFullClass);
document.addEventListener('webkitfullscreenchange',syncFullClass);
let lastT=performance.now(),accT=0,uiT=0;
function frame(now){
  const dt=Math.min(.06,(now-lastT)/1000);
  lastT=now;
  accT+=dt;
  let guard=0;
  while(accT>=STEP&&guard<12){update(STEP);accT-=STEP;guard++;}
  if(accT>STEP*4)accT=0;
  uiT+=dt;
  if(uiT>=.15){uiT=0;refreshUI();}
  renderGame();
  requestAnimationFrame(frame);
}
buildArt();
resize();
refreshUI();
requestAnimationFrame(frame);
window.__SANGUO__={
  get state(){return G.state;},
  get save(){return save;},
  get player(){return P;},
  get game(){return G;},
  get enemies(){return enemies;},
  get troops(){return troops;},
  get boss(){return G.boss;},
  get gate(){return G.gate;},
  start(){startNew();},
  startAt(level,diffIdx){
    if(diffIdx!=null){save.diff=clamp(diffIdx,0,DIFFS.length-1);persist();}
    G.level=clamp(level||1,1,LEVELS.length);
    G.score=0;G.gold=save.gold||0;G.lives=DIFFS[save.diff].lives;
    G.assist=1;G.recentHits=0;G.hitWindow=0;
    applyUpgrades();beginLevel();
  },
  attack(){doAttack();},
  skill(){doSkill();},
  fin(){doFin();},
  dodge(){doDodge();},
  summon(){doSummon();},
  weapon(i){if(i!=null)P.weapon=clamp(i,0,WEAPONS.length-1);else switchWeapon(1);},
  troop(i){if(i!=null)setTroop(i);else cycleTroop();},
  pause(){togglePause();},
  upgrade(k){upgrade(k);},
  supply(){buySupply();},
  next(){nextLevel();},
  setDiff(i){setDiff(i);},
  giveGold(n){G.gold+=n;},
  fillFin(){G.finMeter=100;},
  setHp(v){P.hp=v;},
  spawn(type,elite){spawnEnemy(type||'shield',!!elite);},
  forceGate(){if(!G.gate)G.gate=makeGate();G.gate.hp=0;breakGate();},
  forceBoss(){G.gate=null;G.boss=makeBoss();G.boss.state='walk';G.bossIntro=0;},
  killBoss(){if(G.boss)G.boss.hp=0;},
  killAll(){for(const e of enemies){if(!e.dead){e.hp=0;killEnemy(e);}}},
  tick(n){for(let i=0;i<(n||1);i++)update(STEP);},
  render(){renderGame();},
  refresh(){refreshUI();}
};
})();
