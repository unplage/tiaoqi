<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#160d0a">
<title>三国群英斩 · TiaoQi Arcade</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="../../icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../icons/icon-180.png" sizes="180x180">
<style>
:root{--bg:#0d0807;--line:#3a2418;--gold:#f5c451;--red:#e0503c;--jade:#5fd0b0;--txt:#f0e2cc;--mut:#9a8270}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 15% -10%,rgba(245,196,81,.10),transparent 55%),radial-gradient(ellipse at 90% 110%,rgba(224,80,60,.10),transparent 55%),var(--bg);
color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#shell{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;
padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom));
padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
#screen{position:relative;width:min(100%,1160px);aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;
box-shadow:0 30px 80px #0009,0 0 0 1px var(--line),0 0 60px rgba(245,196,81,.07)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.11) 0 1px,transparent 1px 3px);opacity:.65}
#bar{width:min(100%,1160px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;font-size:14px;color:var(--mut)}
#bar b{color:var(--gold);letter-spacing:.16em;font-size:12px}
.chip{font-family:inherit;font-size:12px;font-weight:700;padding:7px 11px;border-radius:99px;border:1px solid var(--line);
background:rgba(255,255,255,.03);color:var(--txt);cursor:pointer;transition:.18s}
.chip:hover{background:rgba(245,196,81,.14);transform:translateY(-2px)}
.chip:active{transform:translateY(1px)}
.chip:disabled{opacity:.35;cursor:not-allowed;transform:none}
:root{--pad:64px;--dpad:192px;--act:66px}
#touch{width:min(100%,1160px);display:none;align-items:center;justify-content:space-between;gap:12px;padding:4px 12px;pointer-events:auto;touch-action:none}
body.is-touch #touch{display:flex}
.dpad{position:relative;width:var(--dpad);height:var(--dpad);flex:0 0 auto}
.dpad .tb{position:absolute;width:var(--pad);height:var(--pad);border-radius:18px;font-size:19px}
#bUp{left:var(--pad);top:0}
#bLeft{left:0;top:var(--pad)}
#bRight{left:calc(var(--pad)*2);top:var(--pad)}
#bDown{left:var(--pad);top:calc(var(--pad)*2)}
.actions{display:grid;grid-template-columns:repeat(4,var(--act));grid-auto-rows:var(--act);gap:8px;flex:0 0 auto}
.tb{position:relative;pointer-events:auto;touch-action:none;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
width:var(--act);height:var(--act);border-radius:18px;font-size:13px;font-weight:800;letter-spacing:.02em;
color:rgba(255,255,255,.9);background:rgba(255,255,255,.10);
border:2px solid rgba(255,255,255,.22);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
transition:background .12s,transform .08s,box-shadow .2s}
.tb:active,.tb.on{background:rgba(245,196,81,.55);color:#241500;border-color:#ffe6a0;transform:scale(.94)}
.tb.atk{background:rgba(224,80,60,.24);border-color:rgba(224,80,60,.6);font-size:15px}
.tb.fin{background:rgba(245,196,81,.16);border-color:rgba(245,196,81,.5)}
.tb.skill{background:rgba(95,208,176,.16);border-color:rgba(95,208,176,.5)}
.tb.block{background:rgba(143,216,255,.16);border-color:rgba(143,216,255,.5)}
.tb.troop{background:rgba(168,140,240,.16);border-color:rgba(168,140,240,.5)}
.tb.ready{box-shadow:0 0 16px 3px rgba(245,196,81,.65);animation:pulse .7s ease-in-out infinite alternate}
.tb.ready.cool{box-shadow:0 0 14px 2px rgba(95,208,176,.5)}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.45)}}
body.fullscreen #shell{gap:0;padding:0;background:#000}
body.fullscreen #screen{width:min(100vw,calc(100vh*16/9));max-height:100vh;border-radius:0;box-shadow:none}
body.fullscreen #bar{display:none}
body.fullscreen #touch{
  position:fixed;left:0;right:0;bottom:0;height:auto;z-index:20;
  pointer-events:none;background:transparent;padding:0 2vw 2vh;
  align-items:flex-end;
}
body.fullscreen .dpad,body.fullscreen .actions{opacity:.5;transition:opacity .15s}
body.fullscreen .dpad:hover,body.fullscreen .actions:hover,
body.fullscreen .dpad:active,body.fullscreen .actions:active{opacity:1}
body.fullscreen .tb{pointer-events:auto;box-shadow:0 2px 10px rgba(0,0,0,.5)}
body.fullscreen .tb.ready{box-shadow:0 0 16px 3px rgba(245,196,81,.65)}
#cExitFull{display:none;position:absolute;right:10px;top:10px;z-index:9;
  width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer;opacity:.55}
body.fullscreen #cExitFull{display:block}
@media(max-width:760px){#bar{font-size:12px}.chip{font-size:11px;padding:6px 9px}}
@media(orientation:landscape){
  :root{--pad:46px;--dpad:138px;--act:54px}
  #shell{gap:3px;padding:3px}
  #screen{width:min(100vw,calc((100vh - 168px)*16/9));max-height:calc(100vh - 168px);border-radius:8px}
  #bar{font-size:12px;gap:4px 8px}
  #bar .tip{display:none}
  #touch{height:128px;padding:2px 10px}
  .actions{gap:6px}
  .tb{font-size:12px}
  .tb.atk{font-size:14px}
}
</style>
</head>
<body>
<div id="shell">
  <div id="screen">
    <canvas id="game"></canvas>
    <div class="scan"></div>
    <button id="cExitFull" title="退出全屏">&#10005;</button>
  </div>
  <div id="touch">
    <div class="dpad">
      <div class="tb" id="bUp">&#9650;</div>
      <div class="tb" id="bLeft">&#9664;</div>
      <div class="tb" id="bRight">&#9654;</div>
      <div class="tb" id="bDown">&#9660;</div>
    </div>
    <div class="actions">
      <div class="tb atk" id="bAtk">连斩</div>
      <div class="tb skill" id="bSkill">技能</div>
      <div class="tb fin" id="bFin">狂斩</div>
      <div class="tb" id="bDodge">闪避</div>
      <div class="tb block" id="bBlock">格挡</div>
      <div class="tb troop" id="bTroop">召兵</div>
      <div class="tb troop" id="bNext">换兵</div>
      <div class="tb" id="bWeapon">武器</div>
    </div>
  </div>
  <div id="bar">
    <b>三国群英斩</b>
    <span class="tip">WASD移动 · J攻击 · K技能 · L狂斩 · Q/E换武器 · Shift闪 · I格挡 · 1-6换兵 · P暂停</span>
    <button class="chip" id="cNew">新游戏</button>
    <button class="chip" id="cCont" disabled>继续</button>
    <button class="chip" id="cSound">音效开</button>
    <button class="chip" id="cPause">暂停</button>
    <button class="chip" id="cFull">横屏</button>
    <button class="chip" id="cBack">返回游戏集</button>
  </div>
</div>
<script>
(function(){
'use strict';

/* ==================== 0. 常量与工具 ==================== */
const VW=960,VH=540,STEP=1/120;
const GY0=352,GY1=500,GY=GY0+150;
const LEFT=24,RIGHT=934;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const hit=(a,b,pad)=>{
  const p=pad||0;
  return a.x-p<b.x+b.w&&a.x+a.w+p>b.x&&a.y-p<b.y+b.h&&a.y+a.h+p>b.y;
};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const box=o=>({x:o.x-o.w/2,y:o.y-o.h,w:o.w,h:o.h});

/* ==================== 1. 音频（程序化，离线可用） ==================== */
const AU={
  ctx:null,master:null,muted:false,next:0,step:0,timer:null,
  init(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    try{
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=0.7;
      this.master.connect(this.ctx.destination);
    }catch(e){this.ctx=null;}
  },
  resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});},
  setMuted(m){this.muted=m;if(this.master)this.master.gain.value=m?0:0.7;},
  tone(f0,f1,dur,type,vol,when){
    if(!this.ctx||this.muted)return;
    try{
      const c=this.ctx,t=(when||0)||c.currentTime,o=c.createOscillator(),g=c.createGain();
      o.type=type||'square';
      o.frequency.setValueAtTime(Math.max(20,f0),t);
      if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.05),t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.03);
    }catch(e){}
  },
  noise(dur,vol,freq){
    if(!this.ctx||this.muted)return;
    try{
      const c=this.ctx,n=Math.max(1,Math.floor(c.sampleRate*dur));
      const buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
      const s=c.createBufferSource();s.buffer=buf;
      const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||1400;
      const g=c.createGain();g.gain.value=vol||0.1;
      s.connect(f);f.connect(g);g.connect(this.master);s.start();
    }catch(e){}
  }
};
const SFX={
  slash(){AU.tone(900,300,.08,'sawtooth',.05);AU.noise(.07,.05,3000);},
  heavy(){AU.tone(520,150,.14,'sawtooth',.07);AU.noise(.13,.08,1800);},
  hit(){AU.tone(300,120,.06,'square',.06);AU.noise(.06,.05,2200);},
  hurt(){AU.tone(260,80,.24,'square',.09);AU.noise(.18,.08,900);},
  skill(){[392,523,659,784].forEach((f,i)=>AU.tone(f,f*1.5,.16,'triangle',.06,i*.06));},
  finish(){[523,659,784,1046,1318].forEach((f,i)=>AU.tone(f,f*1.2,.18,'sawtooth',.07,i*.05));AU.noise(.3,.1,2600);},
  summon(){AU.tone(180,420,.12,'triangle',.07);},
  arrow(){AU.tone(760,420,.07,'sine',.04);},
  die(){AU.tone(220,60,.3,'square',.08);},
  win(){[392,523,659,784,1046].forEach((f,i)=>AU.tone(f,f,.18,'triangle',.07,i*.12));},
  ui(){AU.tone(520,660,.06,'square',.04);},
  warn(){AU.tone(160,160,.14,'square',.05);}
};
const SCALE=[0,2,4,7,9,12,14,16,19,21];
const MUS={
  on:false,timer:null,next:0,i:0,
  start(){
    if(this.on)return;
    this.on=true;
    this.next=AU.ctx?AU.ctx.currentTime+0.1:0;
    clearInterval(this.timer);
    this.timer=setInterval(()=>this.tick(),32);
  },
  stop(){this.on=false;clearInterval(this.timer);this.timer=null;},
  tick(){
    if(!this.on||!AU.ctx||AU.muted)return;
    const c=AU.ctx;
    while(this.next<c.currentTime+0.14){
      const s=this.i%16;
      if(s%2===0){
        const n=SCALE[(this.i/2|0)%SCALE.length];
        AU.tone(110*Math.pow(2,(n-12)/12),null,.24,'triangle',.045,this.next);
      }
      if(s%4===1){
        const n=SCALE[(this.i*3|0)%SCALE.length]+12;
        AU.tone(110*Math.pow(2,n/12),null,.18,'square',.026,this.next);
      }
      if(s%8===0)AU.noise(.09,.035,900);
      this.next+=0.16;this.i++;
    }
  }
};

/* ==================== 2. 输入 ==================== */
const IN={left:false,right:false,up:false,down:false};
const KMAP={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};
function act(k,v){if(k in IN)IN[k]=v;}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k in KMAP){e.preventDefault();AU.resume();act(KMAP[k],true);}
  if(k==='j'||k===' '){e.preventDefault();AU.resume();doAttack();}
  if(k==='k'){e.preventDefault();AU.resume();doSkill();}
  if(k==='l'){e.preventDefault();AU.resume();doFinish();}
  if(k==='1'){setTroop(0);}
  if(k==='2'){setTroop(1);}
  if(k==='3'){setTroop(2);}
  if(k==='4'){setTroop(3);}
  if(k==='5'){setTroop(4);}
  if(k==='6'){setTroop(5);}
  if(k==='p'||k==='escape'){e.preventDefault();togglePause();}
  if(k==='enter'){e.preventDefault();AU.resume();onConfirm();}
},{passive:false});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in KMAP)act(KMAP[k],false);if(k==='i')P.block=false;});

const TC={left:0,right:0,up:0,down:0},PACT=new Map();
function bind(el,key,fn){
  if(!el)return;
  const dn=e=>{
    e.preventDefault();AU.resume();
    try{el.setPointerCapture(e.pointerId);}catch(err){}
    PACT.set(e.pointerId,key);
    if(key in TC){TC[key]++;act(key,true);}
    el.classList.add('on');
    if(fn)fn();
  };
  const up=e=>{
    e.preventDefault();
    if(!PACT.has(e.pointerId))return;
    PACT.delete(e.pointerId);
    if(key in TC){TC[key]=Math.max(0,TC[key]-1);if(TC[key]===0)act(key,false);}
    if(key==='block')P.block=false;
    el.classList.remove('on');
  };
  el.addEventListener('pointerdown',dn,{passive:false});
  el.addEventListener('pointerup',up,{passive:false});
  el.addEventListener('pointercancel',up,{passive:false});
  el.addEventListener('lostpointercapture',up,{passive:false});
}
const $=id=>document.getElementById(id);
bind($('bLeft'),'left');bind($('bRight'),'right');bind($('bUp'),'up');bind($('bDown'),'down');
bind($('bAtk'),'atk',doAttack);
bind($('bSkill'),'skill',doSkill);
bind($('bFin'),'fin',doFinish);
bind($('bTroop'),'troop',doSummon);
bind($('bNext'),'next',()=>setTroop((G.troopType+1)%TROOPS.length));
bind($('bWeapon'),'weapon',()=>switchWeapon(1));
bind($('bDodge'),'dodge',doDodge);
bind($('bBlock'),'block',()=>{P.block=true;});
if(('ontouchstart' in window)||navigator.maxTouchPoints>0)document.body.classList.add('is-touch');

/* ==================== 3. 画布与画布内输入（划屏狂斩） ==================== */
const canvas=$('game'),ctx=canvas.getContext('2d');
let scale=1,drag=null;
function resize(){
  const r=canvas.getBoundingClientRect();
  const d=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.max(2,Math.round(r.width*d));
  canvas.height=Math.max(2,Math.round(r.height*d));
  scale=canvas.width/VW;
  ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,300));

function localPoint(e){
  const r=canvas.getBoundingClientRect();
  return{x:(e.clientX-r.left)*VW/r.width,y:(e.clientY-r.top)*VH/r.height};
}
canvas.addEventListener('pointerdown',e=>{
  AU.resume();
  const p0=localPoint(e);
  if(G.state==='menu'){
    const p=p0;
    if(p.y>360&&p.y<404){
      const i=clamp(Math.floor((p.x-VW/2+180)/90),0,DIFFS.length-1);
      setDiff(i);return;
    }
  }
  if(G.state!=='playing'){onConfirm();return;}
  drag={x:p0.x,y:p0.y,t:performance.now(),id:e.pointerId};
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
},{passive:true});
canvas.addEventListener('pointermove',e=>{
  if(!drag||G.state!=='playing')return;
  const p=localPoint(e),t=performance.now();
  const dx=p.x-drag.x,dy=p.y-drag.y,dt=Math.max(1,t-drag.t);
  if(Math.hypot(dx,dy)>26&&Math.hypot(dx,dy)/dt>0.55){
    tryFinish(p.x,p.y,Math.atan2(dy,dx));
    drag.x=p.x;drag.y=p.y;drag.t=t;
  }
},{passive:true});
canvas.addEventListener('pointerup',()=>{drag=null;},{passive:true});
canvas.addEventListener('pointercancel',()=>{drag=null;},{passive:true});

/* ==================== 4. 存档 ==================== */
const SKEY='tiaoqi.sanguo.v1';
let save={best:0,level:1,gold:0,up:{skill:1,troop:1,armor:1},muted:false,unlocked:0,diff:1,rank:'C',ach:{}};
function loadSave(){
  try{
    const raw=localStorage.getItem(SKEY);
    if(raw){
      const d=JSON.parse(raw);
      save.best=d.best||0;
      save.level=d.level||1;
      save.gold=d.gold||0;
      if(d.up)save.up={skill:d.up.skill||1,troop:d.up.troop||1,armor:d.up.armor||1};
      save.muted=!!d.muted;
      save.unlocked=d.unlocked||0;
      save.diff=[0,1,2,3].includes(d.diff)?d.diff:1;
      save.rank=d.rank||'C';
      save.ach=d.ach&&typeof d.ach==='object'?d.ach:{};
    }
  }catch(e){}
}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}
loadSave();
AU.muted=save.muted;


/* ==================== 5. 程序化像素精灵 ==================== */
function art(w,h,paint){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  paint(c.getContext('2d'),w,h);return c;
}
const PAL={
  hero:{a:'#d8dce4',b:'#f5c451',s:'#f0c49a',d:'#2b1812',w:'#eef4ff',n:'#1c100c',cape:'#c8352c',plume:'#e0503c'},
  shield:{a:'#6b6f7a',b:'#c9ccd2',s:'#e2bb94',d:'#262a30',w:'#9aa0aa',n:'#191c20'},
  spear:{a:'#7a48b8',b:'#c39af0',s:'#e6c09a',d:'#2a1740',w:'#cfd6e0',n:'#1b1028'},
  archer:{a:'#2f8f5e',b:'#8fe0ae',s:'#e6c09a',d:'#163a26',w:'#a8743c',n:'#102a1c',plume:'#c8a860'},
  captain:{a:'#8a2d24',b:'#e8a05a',s:'#dfb48c',d:'#2a100c',w:'#e0d8c8',n:'#1a0a08',cape:'#5a1c18',plume:'#f5c451'},
  boss:{a:'#2a2028',b:'#e8b447',s:'#d8a878',d:'#120c12',w:'#e8d0a0',n:'#0a060a',cape:'#7a1f1f',plume:'#e0503c'},
  troop:{a:'#d89232',b:'#ffe08a',s:'#e8c09a',d:'#3a2410',w:'#d0d6dc',n:'#241408'},
  t_spear:{a:'#2a6cc8',b:'#8fd8ff',s:'#e8c09a',d:'#142948',w:'#dfe8f0',n:'#0d1c30'},
  t_shield:{a:'#1f8f8a',b:'#8ff0e0',s:'#e8c09a',d:'#123b38',w:'#d0e8e4',n:'#0b2825'},
  t_archer:{a:'#3a86c8',b:'#a8e0ff',s:'#e8c09a',d:'#16324e',w:'#cfe4f0',n:'#0d1e30'},
  t_cavalry:{a:'#4a72d0',b:'#b8d0ff',s:'#e8c09a',d:'#1e2c50',w:'#e0e8ff',n:'#111a30'},
  t_healer:{a:'#2fa88a',b:'#a8ffe0',s:'#e8c09a',d:'#124437',w:'#d0f0e4',n:'#0b2a22'},
  t_hammer:{a:'#50607e',b:'#b8cce8',s:'#e8c09a',d:'#222c3e',w:'#dde6f2',n:'#131a28'}
};
function paintFighter(g,w,h,o){
  const R=(x,y,ww,hh,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(ww),Math.round(hh));};
  const p=o.pal,pose=o.pose,style=o.style||'soldier';
  const big=o.big?1.18:1;
  const cx=w/2;
  const lean=pose==='atk2'?1:(pose==='atk3'?-1:0);
  const step=pose==='walk1'?-2:(pose==='walk3'?2:0);
  const top=2+(pose==='walk1'||pose==='walk3'?1:0);
  const cape=p.cape;
  const plume=p.plume||'#c8352c';

  if(pose==='dead'){
    R(2,h-7,w-4,5,p.a);
    R(4,h-3,7,3,p.d);R(w-11,h-3,7,3,p.d);
    R(cx-5,h-13,10,5,p.s);
    R(cx-7,h-16,14,3,p.b);
    return;
  }

  /* 披风（主将/敌将） */
  if(cape){
    R(cx-9+lean,top+10,18,17,cape);
    R(cx-10+lean,top+14,4,12,p.d);
    R(cx+7+lean,top+14,4,12,p.d);
    R(cx-8+lean,top+24,16,3,p.d);
  }

  /* 头盔 / 斗笠 */
  const hy=top;
  if(style==='archer'){
    g.fillStyle=p.d;
    g.beginPath();
    g.moveTo(cx-11,hy+6);g.lineTo(cx,hy-3);g.lineTo(cx+11,hy+6);g.closePath();g.fill();
    R(cx-11,hy+5,22,2,p.b);
  }else{
    R(cx-6+lean,hy+1,12,5,p.a);
    R(cx-7+lean,hy+5,14,2,p.b);
    if(style==='boss'||style==='captain'){
      R(cx-9+lean,hy-1,3,5,p.b);R(cx+7+lean,hy-1,3,5,p.b);
      R(cx-10+lean,hy-4,3,4,p.b);R(cx+8+lean,hy-4,3,4,p.b);
    }
    R(cx-1+lean,hy-4,3,5,plume);
    R(cx-3+lean,hy-6,6,2,plume);
  }

  /* 面部 */
  const fy=hy+7;
  R(cx-4+lean,fy,8,6,p.s);
  R(cx-3+lean,fy+2,2,2,p.n);
  R(cx+2+lean,fy+2,2,2,p.n);
  R(cx-2+lean,fy+5,4,1,p.d);

  /* 身躯：明光铠 */
  const by=fy+6;
  R(cx-7+lean,by,14,11,p.a);
  R(cx-7+lean,by,14,2,p.b);
  R(cx-6+lean,by+3,12,1,p.b);
  R(cx-6+lean,by+6,12,1,p.b);
  R(cx-5+lean,by+9,10,1,p.b);
  R(cx-8+lean,by+1,3,6,p.d);
  R(cx+6+lean,by+1,3,6,p.d);
  R(cx-8+lean,by,4,3,p.b);
  R(cx+5+lean,by,4,3,p.b);
  R(cx-7+lean,by+10,14,2,p.d);
  R(cx-1+lean,by+10,2,2,p.b);

  /* 战裙与腿 */
  const sy=by+12;
  R(cx-8+lean,sy,5,7,p.a);R(cx-1+lean,sy,5,7,p.a);
  R(cx-8+lean,sy+6,5,1,p.b);R(cx-1+lean,sy+6,5,1,p.b);
  R(cx-6+step,sy+7,5,6,p.d);R(cx+2-step,sy+7,5,6,p.d);
  R(cx-7+step,sy+11,7,3,p.n);R(cx+1-step,sy+11,7,3,p.n);

  /* 手臂 */
  const ay=by+2;
  let wx=cx+10+lean,wy=ay+2;
  if(pose==='atk1'){wx=cx+13;wy=ay-2;}
  else if(pose==='atk2'){wx=cx+14;wy=ay+4;}
  else if(pose==='atk3'){wx=cx+11;wy=ay-4;}
  else if(pose==='hurt'){wx=cx-11;wy=ay+2;}
  R(cx+7+lean,ay,4,7,p.a);
  R(cx+7+lean,ay+5,4,2,p.b);

  /* 兵器 */
  if(o.shield){
    R(cx-4,ay+1,9,11,p.d);
    R(cx-3,ay+2,7,9,p.b);
    R(cx,ay+5,3,3,p.a);
  }
  if(o.spear||style==='hero'||style==='boss'){
    const len=17;
    R(wx,wy-len,2,len+7,p.d);
    R(wx-1,wy-len-4,4,5,p.w);
    R(wx,wy-len-6,2,3,p.b);
    R(wx+1,wy-2,4,2,plume);
  }else if(o.bow){
    g.strokeStyle=p.d;g.lineWidth=2;
    g.beginPath();g.arc(wx+3,wy+4,8,-1.2,1.2);g.stroke();
    g.strokeStyle=p.b;g.beginPath();g.moveTo(wx+2,wy-4);g.lineTo(wx+2,wy+12);g.stroke();
  }else if(o.hammer){
    R(wx,wy-9,2,10,p.d);
    R(wx-3,wy-12,8,5,p.w);
    R(wx-2,wy-11,6,2,p.b);
  }else{
    const len=12;
    R(wx,wy-len,3,len,p.d);
    R(wx-1,wy-len-3,5,4,p.w);
    R(wx,wy-1,2,3,p.b);
  }
}
function buildFighter(pal,opt){
  const w=24,h=32,o=Object.assign({pal:pal,pose:'idle',big:false},opt||{});

    idle:[mk('idle'),mk('idle2')],

  };
}

function drawArt(set,pose,frame,x,y,w,h,flip){
  const arr=set[pose]||set.idle;
  const im=arr[frame%arr.length];

  ctx.save();
  if(flip){ctx.translate(sx+w,sy);ctx.scale(-1,1);ctx.drawImage(im,0,0,w,h);}
  else ctx.drawImage(im,sx,sy,w,h);
  ctx.restore();
}

  G.hitStop=0;G.combo=0;G.comboT=0;G.shake=0;G.flash=0;G.messageT=0;G.finMeter=0;G.finCd=0;
  enemies=[];troops=[];arrows=[];effects=[];floats=[];dust=[];

function spawnWave(){
  const L=LEVELS[G.level-1];
  G.wave++;
  const n=3+G.wave+Math.floor(G.level/2);
  for(let i=0;i<n;i++){
    const r=Math.random();
    let type=L.pool[Math.floor(r*L.pool.length)];
    if(G.wave===1&&i===0)type=L.pool[0];
    const isCap=G.wave>=G.waveMax&&i===n-1&&L.captain>0;
    const ty=isCap?'captain':type;
    const y=rnd(GY0+40,GY1-14);
    enemies.push(newEnemy(ty,Math.min(RIGHT-40,rnd(700,930)),y));
  }
  if(G.wave>=G.waveMax)msg('敌军已尽 · 攻破城门！',2.2);
  else msg('第 '+G.wave+' 波',1.4);
  SFX.warn();
}

  else if(G.state==='clear')advanceLevel();

function setTroop(t){
  if(G.state!=='playing')return;
  G.troopType=t;
  msg('兵种 · '+TROOPS[t].name,1.1);
  SFX.ui();
}
function doAttack(){
  if(G.state!=='playing')return;
  if(P.dodgeT>0||P.block)return;
  if((P.state==='idle'||P.state==='walk')&&!P.block&&P.dodgeT<=0){
    P.atkStep=(P.atkStep+1)%3;
    P.state='atk';P.t=0;P.hitDone=false;P.queue=0;
    SFX[P.atkStep===2?'heavy':'slash']();
  }else if(P.state==='atk'){
    P.queue=1;
  }
}
function doSkill(){
  if(G.state!=='playing'||G.skillCd>0||P.dodgeT>0)return;
  G.skillCd=Math.max(4,9-P.skillLv*.7);
  let dmg=26+P.skillLv*12;
  for(const e of enemies){
    if(e.dead)continue;
    if(Math.hypot(e.x-P.x,e.y-P.y)<220){
      dmg=Math.max(1,Math.round(dmg));e.hp-=dmg;e.hitT=.25;hitFX(e,dmg);
    }
  }
  if(G.boss&&Math.hypot(G.boss.x-P.x,G.boss.y-P.y)<190){
    G.boss.hp-=Math.max(1,Math.round(dmg*1.2));G.boss.hitT=.25;
  }
  if(G.gate&&Math.hypot(G.gate.x-P.x,G.gate.y-P.y)<190)G.gate.hp-=Math.max(1,Math.round(dmg));
  addFX(P.x+20,P.y-24,'ring','#5fd0b0',26);
  G.flash=.2;shake(9);G.hitStop=.05;
  SFX.skill();floatText(P.x,P.y-60,'横扫千军','#5fd0b0');
}
function doFinish(){
  if(G.state!=='playing')return;
  tryFinish(P.x+P.face*80,P.y-20,P.face>0?0:Math.PI);
}
function tryFinish(x,y,ang){
  if(G.state!=='playing'||G.finMeter<100||G.finCd>0)return;
  G.finMeter=0;G.finCd=2;G.hitStop=.14;G.flash=.38;shake(14);
  const dx=Math.cos(ang),dy=Math.sin(ang);
  let hitCount=0;
  for(const e of enemies){
    if(e.dead)continue;
    const rx=e.x-P.x,ry=(e.y-P.y)*1.6;
    if(rx*dx+ry*dy>-30&&Math.abs(-rx*dy+ry*dx)<128){
      e.hp-=70+P.level*10;e.hitT=.4;hitFX(e,70);hitCount++;
    }
  }
  if(G.boss){G.boss.hp-=90;G.boss.hitT=.4;hitCount++;}
  addFX(P.x+dx*90,P.y+dy*60,'slash','#f5c451',40);
  floatText(P.x,P.y-72,'狂 斩!','#f5c451');
  SFX.finish();
  if(hitCount>0)G.finMeter=Math.min(100,G.finMeter+hitCount*3);
}
function doSummon(){
  if(G.state!=='playing'||G.troopCd>0)return;
  const c=TROOPS[G.troopType],cost=c.cost;
  if(G.gold<cost){msg('金币不足 · 需要'+cost,1.1);SFX.ui();return;}
  G.gold-=cost;
  G.troopCd=Math.max(3.5,8-P.troopLv*.7);
  const n=1+Math.floor(P.troopLv/3);
  for(let i=0;i<n;i++){
    if(troops.length>=8)break;
    troops.push(newTroop(G.troopType,P.x-rnd(10,50),P.y+rnd(-14,14)));
  }
  addFX(P.x,P.y-10,'ring','#f5c451',12);
  SFX.summon();floatText(P.x,P.y-50,'召唤 '+c.name,'#f5c451');
}
function doDodge(){
  if(G.state!=='playing'||P.dodgeT>0||P.block)return;
  P.dodgeT=.34;P.inv=Math.max(P.inv,.34);P.state='idle';P.t=0;
  P.x=clamp(P.x-P.face*(58+WEAPONS[P.weapon].speed*10),LEFT,RIGHT);
  addFX(P.x,P.y-16,'ring','#cfe8ff',10);
  SFX.arrow();
}
function switchWeapon(d){
  if(G.state!=='playing')return;
  P.weapon=((P.weapon+d)%WEAPONS.length+WEAPONS.length)%WEAPONS.length;
  msg('武器 · '+WEAPONS[P.weapon].name+'（'+WEAPONS[P.weapon].desc+'）',1.3);
  SFX.ui();
}
function addMorale(n){
  G.morale=clamp(G.morale+n,0,100);
  if(G.moraleT<=0&&G.morale>=100){
    G.moraleT=9;G.morale=0;
    msg('奋勇！全军突击',2);
    addFX(P.x,P.y-20,'ring','#f5c451',30);
    SFX.skill();
  }
}
function hitFX(e,dmg){
  addFX(e.x+e.w/2,e.y-e.h*.5,'dot','#f5c451',8);
  G.combo++;G.comboT=2;
  if(G.combo>G.maxCombo)G.maxCombo=G.combo;
  if(G.combo>=20)unlockAch('combo20');
  if(troops.length>=3)unlockAch('legion');
  G.finMeter=clamp(G.finMeter+5,0,100);
  addMorale(2);
  G.score+=Math.round(dmg*2*(1+Math.min(4,Math.floor(G.combo/8))));
  G.gold+=1;
  G.hitStop=Math.max(G.hitStop,.035);
  shake(3);
  SFX.hit();
}
function damagePlayer(raw){
  if(P.inv>0||G.state!=='playing')return;
  if(P.block){
    const half=Math.max(1,Math.round(raw*.25));
    P.hp-=half;P.inv=.45;P.hitT=.12;
    addFX(P.x+P.w/2,P.y-24,'ring','#8fd8ff',8);
    floatText(P.x,P.y-52,'格挡 -'+half,'#8fd8ff');
    SFX.hit();
    if(P.hp<=0){P.hp=1;}
    return;
  }
  if(P.dodgeT>0)return;
  const dmg=Math.max(1,Math.round(raw*(1-(P.armorLv-1)*.09)));
  P.hp-=dmg;P.inv=1;P.hitT=.3;P.state='hurt';P.t=0;
  G.combo=0;G.comboT=0;G.morale=Math.max(0,G.morale-20);
  G.perf.hits++;G.flash=.18;shake(8);
  addFX(P.x+P.w/2,P.y-24,'dot','#e0503c',12);
  floatText(P.x,P.y-52,'-'+dmg,'#e0503c');
  SFX.hurt();
  if(P.hp<=0){
    P.hp=0;G.lives--;
    G.state=G.lives<=0?'over':'playing';
    if(G.state==='over'){
      G.result='GAME OVER';
      if(G.score>save.best){save.best=G.score;persist();}
      SFX.die();MUS.stop();
    }else{
      P.hp=P.maxHp;P.inv=2;P.x=180;P.y=430;
      msg('再战！',1.4);
    }
  }
}

/* ==================== 9. 更新 ==================== */
function defeatBoss(){
  if(!G.boss||G.boss.dead||G.boss.hp>=1)return;
  G.boss.dead=true;G.boss=null;
  G.score+=600+G.level*240;G.gold+=40+G.level*10;
  addFX(820,400,'ring','#f5c451',50);
  G.state='clear';G.clearT=0;
  G.rank=rankOf();
  if(G.perf.hits===0)unlockAch('noHit');
  if(G.rank==='S')unlockAch('srank');
  unlockAch('first');
  if(G.level>=save.unlocked)save.unlocked=Math.min(LEVELS.length,G.level+1);
  if(G.rank==='S')save.rank='S';else if(G.rank==='A'&&save.rank!=='S')save.rank='A';
  save.best=Math.max(save.best,G.score);persist();
  SFX.win();msg('关隘已破 · '+G.rank+' 评价！',2.4);
}
function update(dt){
  G.time+=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*26);
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt);
  if(G.messageT>0)G.messageT-=dt;
  for(const e of enemies)if(e.hp<1&&!e.dead)killEnemy(e);
  if(G.boss&&G.boss.hp<1&&!G.boss.dead)defeatBoss();
  if(G.hitStop>0){G.hitStop-=dt;return;}
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}
  if(G.state==='clear'){
    G.clearT+=dt;
    if(G.clearT>=8)advanceLevel();
    return;
  }
  if(G.state!=='playing')return;

  if(G.skillCd>0)G.skillCd=Math.max(0,G.skillCd-dt);
  if(G.finCd>0)G.finCd=Math.max(0,G.finCd-dt);
  if(G.troopCd>0)G.troopCd=Math.max(0,G.troopCd-dt);
  if(P.inv>0)P.inv-=dt;
  if(P.hitT>0)P.hitT-=dt;
  if(P.dodgeT>0)P.dodgeT=Math.max(0,P.dodgeT-dt);
  if(!G.finTip&&G.finMeter>=100&&G.finCd<=0){
    G.finTip=true;msg('狂斩就绪 · 点按钮或快速划屏！',2.4);SFX.skill();
  }
  if(G.moraleT>0){G.moraleT-=dt;if(G.moraleT<=0)msg('奋勇结束',1);}
  G.perf.time+=dt;
  if(G.perf.time>12&&G.perf.hits===0)G.dyn=Math.max(.8,G.dyn-.02*dt);
  else if(G.perf.hits>=4)G.dyn=Math.min(1.35,G.dyn+.015*dt);

  let vx=0,vy=0;
  if(IN.left)vx-=1;if(IN.right)vx+=1;
  if(IN.up)vy-=1;if(IN.down)vy+=1;
  const l=Math.hypot(vx,vy)||1;
  const moraleSpd=G.moraleT>0?1.22:1;
  const spd=(P.state==='atk'?78:186)*(P.block?.45:1)*moraleSpd;
  P.x=clamp(P.x+vx/l*spd*dt,LEFT,RIGHT);
  P.y=clamp(P.y+vy/l*spd*.72*dt,GY0+18,GY1-10);
  if(vx)P.face=vx>0?1:-1;
  P.vx=vx*spd;P.vy=vy*spd;

  if(P.state==='atk'){
    P.t+=dt;
    const wp=WEAPONS[P.weapon];
    const dur=(P.atkStep===2?.38:.3)*wp.speed;
    if(!P.hitDone&&P.t>=dur*.3){
      P.hitDone=true;
      let dmg=(9+P.atkStep*5+P.skillLv*2)*wp.dmg*(G.moraleT>0?1.5:1);
      for(const e of enemies){
        if(e.dead)continue;
        if(Math.abs(e.y-P.y)<55&&((e.x+e.w/2-P.x)*P.face>-18)&&Math.abs(e.x-P.x)<(96+P.atkStep*14)*wp.reach){
          dmg=Math.max(1,Math.round(dmg));e.hp-=dmg;e.hitT=.22;hitFX(e,dmg);
        }
      }
      if(G.boss&&Math.abs(G.boss.y-P.y)<82&&Math.abs(G.boss.x-P.x)<(135+P.atkStep*16)*wp.reach){
        G.boss.hp-=Math.max(1,Math.round(dmg*1.1));G.boss.hitT=.2;hitFX(G.boss,Math.round(dmg));
      }
      if(G.gate&&Math.abs(G.gate.y-P.y)<90&&Math.abs(G.gate.x-P.x)<100){
        G.gate.hp-=Math.round(dmg);hitFX(G.gate,Math.round(dmg));
      }
    }
    if(P.t>=dur){
      if(P.queue){P.queue=0;P.atkStep=(P.atkStep+1)%3;P.t=0;P.hitDone=false;
        SFX[P.atkStep===2?'heavy':'slash']();}
      else{P.state='idle';P.t=0;}
    }
  }else if(P.state==='hurt'){
    P.t+=dt;if(P.t>.32){P.state='idle';P.t=0;}
  }else{
    P.t+=dt;
    P.state=(vx||vy)?'walk':'idle';
  }

  if((P.state==='idle'||P.state==='walk')&&!P.block&&P.dodgeT<=0){
    let near=null,nd=1e9;
    for(const e of enemies){
      if(e.dead)continue;
      const d=Math.abs(e.x-P.x);
      if(d<nd&&Math.abs(e.y-P.y)<60){nd=d;near=e;}
    }
    if(near&&nd<142){
      P.face=near.x>P.x?1:-1;
      if(!G.autoTip){G.autoTip=true;msg('站立自动攻击 · 连斩可三连击',2.4);}
      doAttack();
    }
  }

  if(G.stage===0){
    G.spawnT-=dt;
    if(G.spawnT<=0&&G.spawned<levelQuota()){
      spawnWave();G.spawned=G.wave;
      G.spawnT=Math.max(6,10.5-G.level*.8);
    }
    if(G.wave>=G.waveMax&&enemies.length===0&&G.gate===null){
      const ghp=Math.round((120+G.level*70)*diff().hp);
      G.gate={x:884,y:436,w:80,h:170,hp:ghp,maxHp:ghp,dead:false};
      msg('城门已破防 · 击破城门！',2.4);
    }
    if(G.gate&&G.gate.hp<1){
      G.gate=null;
      const L=LEVELS[G.level-1];
      G.boss={x:790,y:430,w:115,h:147,hp:L.bossHp,maxHp:L.bossHp,
        state:'walk',t:0,hitT:0,inv:0,wait:1.2,face:-1,dead:false,atkT:0};
      msg('敌将登场！',2.4);SFX.warn();shake(10);
    }
  }

  updateHazards(dt);
  updateEnemies(dt);
  updateTroops(dt);
  updateArrows(dt);

  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i];e.life-=dt;
    if(e.life<=0){effects.splice(i,1);continue;}
    e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=420*dt;
    e.vx*=.97;
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];f.life-=dt;f.y-=36*dt;
    if(f.life<=0)floats.splice(i,1);
  }
  if(Math.random()<dt*8)dust.push({x:rnd(0,VW),y:rnd(GY0,VH),s:rnd(.4,1.2),life:rnd(1,3)});
  for(let i=dust.length-1;i>=0;i--){
    const d=dust[i];d.x-=dt*18*d.s;d.life-=dt;
    if(d.life<=0||d.x<-10)dust.splice(i,1);
  }
  for(const e of enemies)if(e.hp<1&&!e.dead)killEnemy(e);
  if(G.boss&&G.boss.hp<1&&!G.boss.dead)defeatBoss();
}
function updateHazards(dt){
  const h=fg(),kind=LEVELS[h].hazard;
  if(kind==='none')return;
  const active=kind==='mixed'?(Math.floor(G.time/12)%2===0?'fire':'rock'):kind;
  if((active==='fire'||active==='rock')&&Math.random()<dt*.55){
    const x=rnd(120,900),y=rnd(GY0+30,GY1-20);
    G.hazards.push({type:active,x:x,y:y,t:0,life:active==='fire'?3:1.6,done:false});
    if(G.hazards.length>14)G.hazards.shift();
  }
  for(let i=G.hazards.length-1;i>=0;i--){
    const z=G.hazards[i];
    z.t+=dt;
    if(z.t>=z.life){G.hazards.splice(i,1);continue;}
    if(z.type==='rock'&&z.t<z.life*.45)continue;
    if(!z.done&&Math.abs(P.x-z.x)<34&&Math.abs(P.y-z.y)<32){
      z.done=true;damagePlayer(z.type==='fire'?7+G.level:12+G.level*2);
      addFX(z.x,z.y,'dot',z.type==='fire'?'#ff9a5a':'#e8c08a',10);
    }
  }
}

function levelQuota(){return G.waveMax;}

function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dead){
      e.deadT+=dt;if(e.deadT>.32)enemies.splice(i,1);continue;
    }
    if(e.hitT>0)e.hitT-=dt;
    if(e.inv>0)e.inv-=dt;
    if(e.hp<1){killEnemy(e);continue;}
    const dx=P.x-e.x,dy=P.y-e.y,ad=Math.abs(dx);
    e.face=dx>0?1:-1;
    if(e.state==='walk'){
      if(ad>e.range*.7){
        e.x+=Math.sign(dx)*e.spd*dt;
        e.y+=clamp(dy,-e.spd*.5*dt,e.spd*.5*dt);
      }
      if(e.wait>0)e.wait-=dt;
      if(e.wait<=0&&ad<e.range&&Math.abs(dy)<50){
        e.state='wind';e.t=0;
      }
      if((e.type==='archer'||e.type==='strategist')&&ad<e.range&&ad>120&&e.wait<=0){
        e.state='wind';e.t=0;
      }
      if(e.type==='strategist'){
        e.healT-=dt;
        if(e.healT<=0){
          e.healT=4;
          for(const o of enemies){
            if(o!==e&&!o.dead&&Math.abs(o.x-e.x)<150){
              o.hp=Math.min(o.maxHp,o.hp+12);
            }
          }
          addFX(e.x,e.y-e.h,'ring','#8fe0ae',8);
        }
      }
      if(e.type==='cavalry'&&ad>e.range&&e.wait<=0){
        e.state='charge';e.t=0;
      }
    }else if(e.state==='wind'){
      e.t+=dt;
      if(e.t>.42){
        e.state='atk';e.t=0;
        if(e.type==='archer'||e.type==='strategist'){
          arrows.push({x:e.x+e.w/2,y:e.y-e.h*.55,
            vx:Math.sign(dx)*340,vy:0,life:2.4,dmg:e.atk,
            friendly:e.type==='strategist'});
          SFX.arrow();
        }
      }
    }else if(e.state==='charge'){
      e.t+=dt;
      e.x+=Math.sign(dx)*e.spd*2.1*dt;
      if(e.t>.45){
        e.state='walk';e.t=0;e.wait=e.cool;
        if(Math.abs(P.x-e.x)<60&&Math.abs(P.y-e.y)<52)damagePlayer(e.atk*1.3);
      }
    }else if(e.state==='atk'){
      e.t+=dt;
      if(e.t>.14){
        e.state='walk';
        e.wait=e.cool*rnd(.8,1.2);
        if(e.type!=='archer'&&e.type!=='strategist'&&ad<e.range+16&&Math.abs(dy)<52){
          damagePlayer(e.atk);
        }
      }
    }
    e.x=clamp(e.x,LEFT,RIGHT);
    e.y=clamp(e.y,GY0+16,GY1-12);
    if(P.inv<=0&&hit(box(P),{x:e.x+4,y:e.y-e.h,w:e.w-8,h:e.h},4))damagePlayer(e.atk*.6);
  }
  if(G.boss){
    const b=G.boss;
    if(b.hitT>0)b.hitT-=dt;
    if(b.hp<=0)return;
    b.t+=dt;b.wait-=dt;
    const dx=P.x-b.x;
    b.face=dx>0?1:-1;
    if(b.state==='walk'){
      if(Math.abs(dx)>80)b.x+=Math.sign(dx)*46*dt;
      if(b.wait<=0){
        const pool=G.level<=1?['wind','charge']:(G.level===2?['wind','charge','summon']:['wind','charge','summon','slam']);
        b.state=pool[ri(0,pool.length-1)];b.t=0;b.wait=Math.max(1.1,2.3-G.level*.14);
      }
    }else if(b.state==='wind'){
      if(b.t>.55){
        b.state='attack';b.t=0;
        for(let k=-2;k<=2;k++){
          arrows.push({x:b.x+b.w/2,y:b.y-b.h*.6,
            vx:Math.sign(dx)*260,vy:k*55,life:2.2,dmg:10+G.level*2});
        }
        SFX.warn();shake(5);
      }
    }else if(b.state==='charge'){
      b.x+=Math.sign(dx)*180*dt;
      if(b.t>.7){b.state='walk';b.t=0;}
      if(P.inv<=0&&Math.abs(P.x-b.x)<70&&Math.abs(P.y-b.y)<60)damagePlayer(15+G.level*2);
    }else if(b.state==='summon'){
      if(b.t>.35){
        b.state='walk';b.t=0;
        for(let k=0;k<2&&enemies.length<14;k++){
          enemies.push(newEnemy(G.level>=4?'spear':'shield',b.x+rnd(-40,40),rnd(GY0+40,GY1-20)));
        }
        addFX(b.x,b.y-b.h*.5,'ring','#f5c451',18);
        msg('敌将召唤援军！',1.4);
      }
    }else if(b.state==='slam'){
      if(b.t>.5){
        b.state='walk';b.t=0;shake(12);
        addFX(b.x,b.y,'ring','#e0503c',26);
        if(Math.abs(P.x-b.x)<190&&Math.abs(P.y-b.y)<90)damagePlayer(18+G.level*3);
        for(const t of troops){if(Math.abs(t.x-b.x)<190)t.hp-=14;}
      }
    }else if(b.state==='attack'){
      if(b.t>.5){b.state='walk';b.t=0;}
    }
    b.x=clamp(b.x,LEFT,RIGHT+30);
    if(P.inv<=0&&hit(box(P),{x:b.x+8,y:b.y-b.h,w:b.w-16,h:b.h},6))damagePlayer(12+G.level*2);
  }
}
function updateTroops(dt){
  const mb=G.moraleT>0?1.35:1;
  for(let i=troops.length-1;i>=0;i--){
    const t=troops[i];
    if(t.hp<=0){addFX(t.x,t.y-20,'dot','#f5c451',8);troops.splice(i,1);continue;}
    if(t.type==='healer'){
      t.healT-=dt;
      if(t.healT<=0){
        t.healT=3.2;
        P.hp=Math.min(P.maxHp,P.hp+9+P.skillLv*2);
        for(const o of troops){
          if(o!==t)o.hp=Math.min(o.maxHp,o.hp+12);
        }
        addFX(t.x,t.y-20,'ring','#8fe0ae',10);
        floatText(P.x,P.y-56,'+体力','#8fe0ae');
      }
    }
    const target=enemies.find(e=>!e.dead&&Math.abs(e.y-t.y)<70)||G.boss;
    if(!target){
      const tx=t.type==='healer'?P.x-50:P.x;
      t.x+=Math.sign(tx-t.x)*Math.min(Math.abs(tx-t.x),70)*dt;
      t.y+=clamp(P.y-t.y,-40*dt,40*dt);
      continue;
    }
    const dx=target.x-t.x;
    t.face=dx>0?1:-1;
    const range=t.type==='archer'?Math.min(t.range,320):t.range;
    if(Math.abs(dx)>range){
      t.x+=Math.sign(dx)*t.spd*dt;
      t.y+=clamp(target.y-t.y,-46*dt,46*dt);
    }else{
      t.wait-=dt;
      if(t.wait<=0){
        t.wait=t.type==='archer'?1.5:(t.type==='healer'?2.2:1.05);
        let mult=mb;
        if(COUNTER[t.type]===target.type)mult*=1.8;
        else if(COUNTER[target.type]===t.type)mult*=.6;
        if(t.type==='cavalry'&&Math.abs(t.vx||0)>80)mult*=1.3;
        const dmg=t.atk*mult;
        if(t.type==='archer'){
          arrows.push({x:t.x+t.face*12,y:t.y-t.h*.6,
            vx:t.face*360,vy:0,life:1.8,dmg:dmg,friendly:true});
        }else{
          target.hp-=Math.max(1,Math.round(dmg));target.hitT=.2;
          addFX(target.x+10,target.y-24,'dot',COUNTER[t.type]===target.type?'#f5c451':'#8fd8ff',7);
          if(target.hp<=0)killEnemy(target);
        }
      }
    }
    t.vx=t.spd*t.face;
    t.x=clamp(t.x,LEFT,RIGHT);
  }
}
function updateArrows(dt){
  for(let i=arrows.length-1;i>=0;i--){
    const a=arrows[i];
    a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;
    if(a.life<=0||a.x<-30||a.x>VW+30){arrows.splice(i,1);continue;}
    if(a.friendly){
      let used=false;
      for(const e of enemies){
        if(e.dead)continue;
        if(hit({x:e.x,y:e.y-e.h,w:e.w,h:e.h},{x:a.x-6,y:a.y-3,w:12,h:6},2)){
          let dmg=a.dmg;
          if(COUNTER['archer']===e.type)dmg*=1.8;
          else if(COUNTER[e.type]==='archer')dmg*=.6;
          e.hp-=Math.max(1,Math.round(dmg));e.hitT=.2;used=true;
          addFX(e.x,e.y-e.h*.5,'dot','#8fd8ff',6);
          if(e.hp<=0)killEnemy(e);
          break;
        }
      }
      if(!used&&G.boss&&hit({x:G.boss.x-G.boss.w/2,y:G.boss.y-G.boss.h,w:G.boss.w,h:G.boss.h},{x:a.x-6,y:a.y-3,w:12,h:6},2)){
        G.boss.hp-=Math.max(1,Math.round(a.dmg));used=true;
      }
      if(used)arrows.splice(i,1);
      continue;
    }
    if(P.inv<=0&&hit(box(P),{x:a.x-6,y:a.y-3,w:12,h:6},2)){
      damagePlayer(a.dmg);arrows.splice(i,1);continue;
    }
    for(const t of troops){
      if(hit(box(t),{x:a.x-6,y:a.y-3,w:12,h:6},2)){
        t.hp-=Math.max(1,Math.round(a.dmg));arrows.splice(i,1);break;
      }
    }
  }
}
function advanceLevel(){
  if(G.level>=LEVELS.length){
    G.state='win';G.result='ALL CLEAR';MUS.stop();
    unlockAch('allclear');
    save.best=Math.max(save.best,G.score);
    save.level=1;save.unlocked=0;save.gold=G.gold;persist();
    SFX.win();return;
  }
  G.level++;
  save.level=G.level;save.gold=G.gold;persist();
  beginLevel();
}


/* ==================== 10. 渲染 ==================== */
function fg(){return clamp(G.level-1,0,LEVELS.length-1);}
function bgColor(){return LEVELS[fg()].bg;}
function drawBackground(){
  const L=LEVELS[fg()];
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#1b1218');g.addColorStop(.55,L.bg);g.addColorStop(1,'#0b0706');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  const off=P.x*.12;
  ctx.fillStyle='rgba(245,196,81,.10)';
  ctx.beginPath();ctx.arc(768,92,62,0,6.283);ctx.fill();
  ctx.fillStyle='rgba(245,196,81,.05)';
  ctx.beginPath();ctx.arc(768,92,96,0,6.283);ctx.fill();
  for(let layer=0;layer<3;layer++){
    const par=[.08,.18,.34][layer];
    const base=[180,250,320][layer];
    ctx.fillStyle=['rgba(40,26,24,.55)','rgba(30,20,18,.75)','rgba(18,12,10,.9)'][layer];
    ctx.beginPath();
    ctx.moveTo(0,VH);
    for(let x=-100;x<=VW+120;x+=60){
      const h=base+Math.sin((x+off*par)*.012+layer*2)*36+Math.sin((x+off*par)*.031)*18;
      ctx.lineTo(x,h);
    }
    ctx.lineTo(VW+120,VH);ctx.closePath();ctx.fill();
  }
  for(let i=0;i<7;i++){
    const x=((i*190-P.x*.28)%(VW+260)+VW+260)%(VW+260)-120;
    ctx.fillStyle=i%2?'rgba(200,60,40,.32)':'rgba(245,196,81,.24)';
    ctx.fillRect(x,176,4,96);
    ctx.fillStyle=i%2?'#c8352c':'#f5c451';
    ctx.fillRect(x-12,180,28,22);
  }
  const floorGrad=ctx.createLinearGradient(0,GY0,0,VH);
  floorGrad.addColorStop(0,'rgba(20,14,10,.15)');floorGrad.addColorStop(1,'rgba(8,5,4,.75)');
  ctx.fillStyle=floorGrad;ctx.fillRect(0,GY0,VW,VH-GY0);
  ctx.strokeStyle='rgba(245,196,81,.06)';ctx.lineWidth=1;
  for(let i=0;i<9;i++){
    const y=GY0+i*(VH-GY0)/9;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(VW,y);ctx.stroke();
  }
  for(const d of dust){
    ctx.globalAlpha=Math.max(0,Math.min(.4,d.life*.3));
    ctx.fillStyle='#e8c9a0';
    ctx.fillRect(Math.round(d.x),Math.round(d.y),d.s*3,d.s*3);
  }
  ctx.globalAlpha=1;
}
function drawWeather(){
  const kind=LEVELS[fg()].hazard;
  if(kind==='night'||kind==='mixed'){
    ctx.fillStyle='rgba(4,8,24,.42)';ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle='rgba(200,230,255,.05)';ctx.fillRect(0,0,VW,VH);
  }
  if(kind==='fog'){
    for(let i=0;i<5;i++){
      const x=((i*260-G.time*22)%(VW+400)+VW+400)%(VW+400)-200;
      const g=ctx.createLinearGradient(x,0,x+260,0);
      g.addColorStop(0,'rgba(220,230,240,0)');
      g.addColorStop(.5,'rgba(220,230,240,.16)');
      g.addColorStop(1,'rgba(220,230,240,0)');
      ctx.fillStyle=g;ctx.fillRect(x,0,260,VH);
    }
  }
}
function drawHazards(){
  for(const z of G.hazards){
    const a=z.type==='rock'&&z.t<z.life*.45?(z.t/(z.life*.45))*.6:1;
    ctx.globalAlpha=clamp(a,0,1);
    if(z.type==='fire'){
      const h=18+Math.sin(G.time*9+z.x)*6;
      ctx.fillStyle='#e0503c';
      ctx.beginPath();ctx.moveTo(z.x-14,z.y);ctx.lineTo(z.x,z.y-h);ctx.lineTo(z.x+14,z.y);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ffd24a';
      ctx.beginPath();ctx.moveTo(z.x-6,z.y);ctx.lineTo(z.x,z.y-h*.6);ctx.lineTo(z.x+6,z.y);ctx.closePath();ctx.fill();
    }else{
      if(z.t<z.life*.45){
        ctx.strokeStyle='#e8c08a';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(z.x,z.y,10+Math.sin(G.time*14)*4,0,6.283);ctx.stroke();
      }else{
        ctx.fillStyle='#6b5a48';
        ctx.beginPath();ctx.arc(z.x,z.y,12,0,6.283);ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  }
}
function drawShadow(x,y,w){
  ctx.fillStyle='rgba(0,0,0,.35)';

function bar(x,y,w,h,ratio,color,bg){
  ctx.fillStyle=bg||'rgba(0,0,0,.6)';ctx.fillRect(x,y,w,h);

function drawEntity(e,set,flip){
  const pose=e.dead?'dead':(e.hitT>0?'hurt':(e.state==='atk'||e.state==='attack'?'atk':(e.state==='wind'?'idle':(e.state==='walk'?'walk':'idle'))));
  const frame=pose==='walk'?Math.floor(G.time*7)%4:(pose==='atk'?Math.min(2,Math.floor(e.t*9)):Math.floor(G.time*3)%2);
  drawArt(set,pose,frame,e.x-e.w/2,e.y-e.h,e.w,e.h,flip);
  if(!e.dead){
    teamRing(e.x,e.y,e.w,false);
    if(e.type!=='boss')teamPennant(e.x,e.y,e.h,false);
    if(e.maxHp>1&&e.type!=='boss')bar(e.x-e.w/2,e.y-e.h-9,e.w,4,e.hp/e.maxHp,'#e0503c');

const touchCache={};
function setBtn(id,txt,cls,on){
  const el=$(id);if(!el)return;

  if(cls&&el.classList&&el.classList.contains!==undefined){

}
function syncTouchUI(){

function render(){
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.clearRect(0,0,VW,VH);
  ctx.save();
  if(G.shake>.2)ctx.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake));
  drawBackground();
  const list=[];
  if(G.gate)list.push({y:G.gate.y,fn:drawGate});
  if(G.boss)list.push({y:G.boss.y,fn:drawBoss});
  for(const e of enemies)list.push({y:e.y,fn:()=>drawEntity(e,ART[e.art]||ART.shield,e.face<0)});
  for(const t of troops)list.push({y:t.y,fn:()=>{
    drawShadow(t.x,t.y,t.w);
    drawArt(ART['troop_'+t.type]||ART.troop,t.state==='walk'?(Math.floor(G.time*8)%2?'walk':'idle'):'idle',0,t.x-t.w/2,t.y-t.h,t.w,t.h,t.face<0);
    teamRing(t.x,t.y,t.w,true);
    teamPennant(t.x,t.y,t.h,true);
    bar(t.x-16,t.y-t.h-9,32,4,t.hp/t.maxHp,'#5fd0b0');
  }});
  list.push({y:P.y,fn:()=>{drawShadow(P.x,P.y,P.w);drawPlayer();teamRing(P.x,P.y,P.w,true);}});
  list.sort((a,b)=>a.y-b.y);
  drawShadow(P.x,P.y,P.w);
  for(const it of list)it.fn();
  for(const a of arrows){
    ctx.save();ctx.translate(a.x,a.y);
    if(a.vx<0)ctx.scale(-1,1);
    ctx.drawImage(ART.arrow,-7,-2,14,4);
    ctx.restore();
  }
  drawHazards();
  drawEffects();
  ctx.restore();
  drawWeather();
  drawHUD();
  syncTouchUI();
  overlay();
  if(G.flash>0){
    ctx.fillStyle='rgba(255,240,200,'+Math.min(.6,G.flash*2)+')';
    ctx.fillRect(0,0,VW,VH);
  }
}

/* ==================== 11. 主循环与启动 ==================== */
let last=0,acc=0;
function frame(ts){
  let dt=(ts-last)/1000;last=ts;
  if(!isFinite(dt)||dt<0)dt=0;
  if(dt>.25)dt=.25;
  acc+=dt;
  let guard=0;
  while(acc>=STEP&&guard<20){update(STEP);acc-=STEP;guard++;}
  if(acc>STEP)acc=0;
  render();
  requestAnimationFrame(frame);
}
function upgrade(k){
  if(G.state!=='clear')return;
  const cost=k===0?40*P.skillLv:(k===1?35*P.troopLv:30*P.armorLv);
  if(G.gold<cost){msg('金币不足',1.2);SFX.ui();return;}
  G.gold-=cost;
  if(k===0)P.skillLv++;
  else if(k===1)P.troopLv++;
  else{P.armorLv++;P.maxHp+=10;P.hp=Math.min(P.maxHp,P.hp+10);}
  save.gold=G.gold;persist();
  G.clearT=0;
  msg('升级成功！',1.4);SFX.skill();
}
addEventListener('keydown',e=>{
  if(G.state!=='clear')return;
  if(e.code==='Digit1')upgrade(0);
  if(e.code==='Digit2')upgrade(1);
  if(e.code==='Digit3')upgrade(2);
});
function setDiff(i){
  save.diff=clamp(i,0,DIFFS.length-1);persist();
  msg('难度 · '+DIFFS[save.diff].name,1.2);SFX.ui();
}
function refreshUI(){
  const c=$('cCont');if(c)c.disabled=!save.unlocked;
  const s=$('cSound');if(s)s.textContent=AU.muted?'音效关':'音效开';
}
$('cNew').onclick=()=>{AU.resume();startNew();};
$('cCont').onclick=()=>{AU.resume();continueGame();};
$('cSound').onclick=()=>{AU.resume();AU.setMuted(!AU.muted);save.muted=AU.muted;persist();refreshUI();};
$('cPause').onclick=()=>{AU.resume();togglePause();};
$('cBack').onclick=()=>{window.location.assign('../../index.html');};

function updateFullBtn(){
  const b=$('cFull');
  if(b)b.textContent=document.fullscreenElement?'退出横屏':'横屏';
}
async function enterFull(){
  try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();}catch(e){}
  try{
    if(screen.orientation&&screen.orientation.lock){
      try{await screen.orientation.lock('landscape');}
      catch(e){try{await screen.orientation.lock('landscape-primary');}catch(e2){}}
    }
  }catch(e){}
  setTimeout(resize,260);updateFullBtn();
  if(!document.fullscreenElement){const b=$('cFull');if(b){b.textContent='请手动旋转';setTimeout(updateFullBtn,3000);}}
}
async function exitFull(){
  try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}
  try{if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen();}catch(e){}
  setTimeout(resize,260);updateFullBtn();
}
$('cFull').onclick=()=>{AU.resume();if(document.fullscreenElement)exitFull();else enterFull();};
$('cExitFull').onclick=()=>{exitFull();};
document.addEventListener('fullscreenchange',()=>{
  document.body.classList.toggle('fullscreen',!!document.fullscreenElement);
  updateFullBtn();setTimeout(resize,220);
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&G.state==='playing')G.state='paused';
  if(document.hidden)MUS.stop();
  else if(!document.hidden&&G.state==='playing')MUS.start();
});
addEventListener('blur',()=>{if(G.state==='playing')G.state='paused';});

try{
  buildArt();
  resize();
  refreshUI();
  G.state='menu';
  requestAnimationFrame(frame);
}catch(err){
  const d=document.createElement('div');
  d.textContent='加载失败: '+err.message;
  d.style.cssText='position:absolute;left:10px;top:10px;color:#ff6666;background:#000;padding:10px;z-index:99;font:14px sans-serif';
  const sc=document.getElementById('screen');
  if(sc)sc.appendChild(d);
  console.error(err);
}
})();
</script>
