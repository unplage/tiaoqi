<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#064e3b">
    <title>麻将 · Mahjong</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body {
            min-height: 100dvh; height: 100dvh; overflow: hidden;
            display: grid; grid-template-rows: auto 1fr auto; gap: 6px; padding: 6px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ecfdf5; background: radial-gradient(900px 500px at 15% -10%, #10b98122, transparent 60%), linear-gradient(160deg, #022c22 0%, #064e3b 50%, #0f172a 100%);
        }
        .topbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .topbar a { color:#6ee7b7; text-decoration:none; padding:8px 10px; background:#052e16; border:1px solid #065f46; border-radius:10px; }
        .title { flex:1; font-size:clamp(1.1rem,4vw,1.45rem); font-weight:900; }
        .hud { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
        .hud select, .hud button { padding:8px 10px; border:1px solid #065f46; background:#052e16; color:#ecfdf5; border-radius:10px; cursor:pointer; font-size:.8rem; }
        .table { display:grid; grid-template-rows: 1fr auto 1fr; grid-template-columns: 1fr auto 1fr; gap:6px; min-height:0; }
        .seat { background:#052e16aa; border:1px solid #0f3f2e; border-radius:14px; padding:6px; min-height:0; overflow:auto; }
        .top { grid-column:2; grid-row:1; } .left { grid-column:1; grid-row:2; }
        .center { grid-column:2; grid-row:2; display:grid; place-items:center; min-height:0; }
        .right { grid-column:3; grid-row:2; } .bottom { grid-column:2; grid-row:3; }
        .seat-title { font-size:.78rem; color:#6ee7b7; font-weight:700; margin-bottom:4px; }
        .hand { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; min-height:52px; }
        .tile {
            min-width:34px; height:46px; padding:4px 6px; border-radius:8px; background:linear-gradient(#fff,#e2e8f0);
            color:#0f172a; font-weight:800; font-size:.86rem; cursor:pointer; user-select:none;
            box-shadow:0 3px 7px #0005; border:1px solid #94a3b8;
        }
        .tile.selected { transform:translateY(-8px); outline:2px solid #fbbf24; }
        .tile.disabled { opacity:.6; cursor:not-allowed; }
        .meld-chip { display:inline-block; margin:2px; padding:4px 7px; border-radius:8px; background:#065f46; color:#ecfdf5; font-size:.78rem; font-weight:700; }
        .discard-row { display:flex; flex-wrap:wrap; gap:3px; min-height:20px; }
        .discard-row .t { font-size:.72rem; padding:2px 4px; height:auto; min-width:auto; background:#064e3b; color:#a7f3d0; border-color:#0f3f2e; }
        .board-center { width:min(92vw,74vh,620px); aspect-ratio:1/1; border-radius:20px; background: radial-gradient(circle at center,#0f3f2e,#022c22 70%); border:4px solid #34d399; display:grid; place-items:center; text-align:center; padding:16px; box-shadow:0 20px 50px #0008; }
        .actions { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px; }
        .action-btn { background:#10b981; color:#022c22; border:none; font-weight:900; }
        .action-btn.secondary { background:#0f3f2e; color:#ecfdf5; border:1px solid #065f46; }
        #statusPanel { background:#052e16cc; border:1px solid #0f3f2e; border-radius:12px; padding:8px 12px; min-height:46px; }
        .status-line { min-height:1.35em; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .status-sub { font-size:.8rem; color:#6ee7b7; min-height:1.2em; }
        .modal-backdrop { position:fixed; inset:0; background:#0009; display:none; place-items:center; z-index:1000; }
        .modal { width:min(92vw,480px); background:#052e16; border:1px solid #065f46; border-radius:18px; padding:16px; }
        @media (max-width:760px) { body { padding:4px; gap:4px; } .table { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto auto; } .top,.left,.right,.bottom,.center { grid-column:1; grid-row:auto; } .board-center { width:min(96vw,48vh,420px); } }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../../index.html">← 游戏集</a>
        <div class="title">🀄 麻将</div>
        <div style="color:#6ee7b7;font-size:.8rem;" id="turnText">初始化</div>
    </div>

    <div class="hud">
        <select id="modeSelect"><option value="ai">单机 AI</option><option value="hotseat">本地热座</option></select>
        <select id="playerCount"><option value="4">4人</option><option value="3">3人</option><option value="2">2人</option></select>
        <select id="variantSelect"><option value="standard">国标基础</option><option value="hongkong">香港基础</option><option value="sichuan">四川麻将</option></select>
        <select id="difficultySelect"><option value="easy">简单</option><option value="medium" selected>中等</option><option value="hard">困难</option></select>
        <button onclick="game.newGame()">🔄 新局</button>
        <button onclick="game.toggleAuto()">🤖 AI代打</button>
        <button onclick="game.showHelp()">帮助</button>
    </div>

    <div class="table">
        <div class="seat top" id="seat1">
            <div class="seat-title">上家</div>
            <div class="meld-list" id="melds1"></div>
            <div class="discard-row" id="discards1"></div>
            <div id="handCount1">0张</div>
        </div>
        <div class="seat left" id="seat3">
            <div class="seat-title">左家</div>
            <div class="meld-list" id="melds3"></div>
            <div class="discard-row" id="discards3"></div>
            <div id="handCount3">0张</div>
        </div>
        <div class="seat center">
            <div class="board-center">
                <div>
                    <div style="font-size:1.1rem;font-weight:900;color:#34d399;">麻将对局</div>
                    <div id="centerInfo" style="margin-top:8px;color:#a7f3d0;">牌墙剩余</div>
                </div>
            </div>
        </div>
        <div class="seat right" id="seat2">
            <div class="seat-title">右家</div>
            <div class="meld-list" id="melds2"></div>
            <div class="discard-row" id="discards2"></div>
            <div id="handCount2">0张</div>
        </div>
        <div class="seat bottom" id="seat0">
            <div class="seat-title">自分</div>
            <div class="meld-list" id="melds0"></div>
            <div class="discard-row" id="discards0"></div>
            <div class="hand" id="hand0"></div>
            <div class="actions" style="margin-top:6px;">
                <button class="action-btn" onclick="game.discardSelected()">打出选中 ▶</button>
                <span style="font-size:.8rem;color:#86efac;" id="helpText">点牌选中后打出</span>
            </div>
        </div>
    </div>

    <div id="statusPanel">
        <div class="status-line" id="moveDetail">开始新局</div>
        <div class="status-sub" id="statusSub">单机/热座 AI 会自动出牌；点击牌选中，再点“打出选中”</div>
    </div>

    <div class="modal-backdrop" id="helpModal">
        <div class="modal">
            <h2>说明</h2>
            <p style="line-height:1.75;font-size:.88rem;">
                · 4/3/2 人，变体影响牌组与胡牌校验。<br>
                · 胡牌时自动结算并结束本局。<br>
                · 四川模式要求“缺一门”。<br>
                · AI 会依据牌效率自动出牌。<br>
                · 本版本先聚焦稳定本地对战，联机功能下个版本接入。<br>
            </p>
            <div style="text-align:right;margin-top:10px;"><button onclick="game.closeHelp()">关闭</button></div>
        </div>
    </div>

    <script>
        const SUITS = { standard:['m','p','s','z','f'], hongkong:['m','p','s','z','f'], sichuan:['m','p','s'] };
        const HONOR_LABELS = ['','东风','南风','西风','北风','中','发','白'];
        const SUIT_LABEL = {m:'万',p:'筒',s:'条'};
        function tileLabel(t) { if (t.suit==='z') return HONOR_LABELS[t.rank]||'风'; if (t.suit==='f') return ['','中','发','白'][t.rank]||'字'; return t.rank+SUIT_LABEL[t.suit]; }
        function tileKey(t){ return t.suit+t.rank; }
        function clone(v){ return JSON.parse(JSON.stringify(v)); }
        function shuffle(a){ for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }
        function removeN(hand,key,n){ let r=0; for (let i=hand.length-1;i>=0 && r<n;i--) if (tileKey(hand[i])===key) { hand.splice(i,1); r++; } }

        function createWall(variant) {
            const suits = SUITS[variant] || SUITS.standard;
            const tiles = []; let id=0;
            for (const s of suits) {
                const ranks = (['m','p','s'].includes(s)) ? [1,2,3,4,5,6,7,8,9] : (s==='z'?[1,2,3,4]:[1,2,3]);
                for (const r of ranks) for (let i=0;i<4;i++) tiles.push({suit:s,rank:r,id:id++});
            }
            return tiles;
        }

        class Mahjong {
            constructor() {
                this.playerCount = 4;
                this.variant = 'standard';
                this.mode = 'ai';
                this.wall = [];
                this.hands = [];
                this.melds = [];
                this.discards = [];
                this.current = 0;
                this.state = 'idle';
                this.selected = null;
                this.autoPlay = false;
                this.scores = [];
                this.turnNo = 0;
                document.getElementById('playerCount').addEventListener('change', () => this.sync());
                document.getElementById('variantSelect').addEventListener('change', () => this.sync());
                document.getElementById('modeSelect').addEventListener('change', () => this.sync());
                document.getElementById('difficultySelect').addEventListener('change', e => this.difficulty = e.target.value);
                this.difficulty = 'medium';
                this.newGame();
            }
            sync() { this.newGame(); }
            newGame() {
                this.playerCount = +document.getElementById('playerCount').value;
                this.variant = document.getElementById('variantSelect').value;
                this.mode = document.getElementById('modeSelect').value;
                this.difficulty = document.getElementById('difficultySelect').value;
                const n = this.playerCount;
                this.wall = createWall(this.variant);
                shuffle(this.wall);
                this.hands = Array.from({length:n},()=>[]);
                this.melds = Array.from({length:n},()=>[]);
                this.discards = Array.from({length:n},()=>[]);
                this.scores = Array(n).fill(0);
                this.turnNo = 0;
                for (let i=0;i<13;i++) for (let p=0;p<n;p++) this.hands[p].push(this.wall.pop());
                this.state='playing';
                this.drawTile(0);
                this.renderAll();
                this.flash('新局开始');
            }
            isHumanTurn(p) { return this.mode === 'hotseat' || p === 0; }
            playerName(p) { return p===0 ? '我' : `玩家 ${p+1}`; }

            drawTile(p) {
                if (!this.wall.length) { this.endGameNoWinner(); return; }
                const tile = this.wall.pop();
                this.hands[p].push(tile);
                this.current = p;
                this.state = 'discard';
                this.selected = this.hands[p].length - 1;
                this.renderAll();
                if (this.canHu(this.hands[p])) {
                    this.finishHu(p, null, true); return;
                }
                if (!this.isHumanTurn(p)) this.scheduleAI();
            }

            scheduleAI() {
                if (this.state !== 'discard') return;
                if ((this.mode === 'ai' && !this.isHumanTurn(this.current)) || this.autoPlay) {
                    setTimeout(() => {
                        if (this.state !== 'discard') return;
                        const p = this.current;
                        const idx = this.chooseDiscard(p);
                        this.discard(p, idx);
                    }, 600);
                }
            }

            chooseDiscard(p) {
                const hand = this.hands[p];
                let bestIdx=0, bestScore=-Infinity;
                for (let i=0;i<hand.length;i++) {
                    const remain = hand.filter((_,j)=>j!==i);
                    let ways=0;
                    for (const t of this.allTypes()) {
                        const test = remain.concat([{suit:t[0],rank:+t.slice(1),id:-1}]);
                        if (this.canHu(test)) ways++;
                    }
                    let s = ways*10;
                    const same = hand.filter(t=>tileKey(t)===tileKey(hand[i])).length;
                    if (same <= 1) s += 3;
                    if (this.terminalOrHonor(hand[i])) s += 1;
                    if (this.difficulty === 'easy' && Math.random() < 0.3) s += Math.random()*5;
                    if (s > bestScore) { bestScore=s; bestIdx=i; }
                }
                return bestIdx;
            }

            discard(p, index) {
                if (this.state !== 'discard' || this.current !== p) return;
                const tile = this.hands[p].splice(index,1)[0];
                this.discards[p].push(tile);
                this.selected = null;
                this.turnNo++;
                this.state = 'claimCheck';
                this.renderAll();
                // ron check for others (auto)
                for (let offset=1; offset<this.playerCount; offset++) {
                    const p2 = (p + offset) % this.playerCount;
                    if (this.canHu(this.hands[p2].concat([tile]))) {
                        // auto hu for AI/hotseat? Hotseat: ask via confirm
                        if (this.isHumanTurn(p2) && !this.autoPlay) {
                            const ok = confirm(`${p2===0?'你':('玩家'+(p2+1))} 可胡牌，确认胡？`);
                            if (ok) { this.finishHu(p2, tile, false); return; }
                        } else {
                            this.finishHu(p2, tile, false); return;
                        }
                    }
                }
                this.state = 'playing';
                const next = (p + 1) % this.playerCount;
                this.drawTile(next);
            }

            discardSelected() {
                if (this.state !== 'discard' || !this.isHumanTurn(this.current)) return;
                if (this.selected === null) { this.flash('请先选牌'); return; }
                this.discard(this.current, this.selected);
            }

            finishHu(p, tile, selfDrawn) {
                this.state = 'ended';
                const hand = selfDrawn ? this.hands[p] : this.hands[p].concat([tile?clone(tile):[]].filter(Boolean));
                const pts = this.huScore(hand, selfDrawn);
                this.scores[p] += pts;
                this.renderAll();
                this.flash((p===0?'你':`玩家${p+1}`) + ' 胡牌 +' + pts);
                this.sub('本局结束，点新局重新开始');
            }

            huScore(hand, selfDrawn) {
                let fan = 1;
                const suits = new Set(hand.filter(t=>!['z','f'].includes(t.suit)).map(t=>t.suit));
                const hasHonor = hand.some(t=>t.suit==='z'||t.suit==='f');
                if (suits.size === 1) fan += (hasHonor ? 3 : 6);
                if (this.sevenPairs(hand.map(tileKey).sort())) fan += 2;
                if (selfDrawn) fan += 1;
                return fan * 8;
            }

            canHu(hand) {
                if (this.variant === 'sichuan') {
                    if (!this.hasMissingSuit(hand)) return false;
                }
                const arr = hand.map(tileKey).sort();
                if (arr.length % 3 !== 2) return false;
                if (arr.length === 14 && this.sevenPairs(arr)) return true;
                return this.partitionHu(arr);
            }
            sevenPairs(arr) {
                const cnt={}; for(const x of arr) cnt[x]=(cnt[x]||0)+1;
                let pairs=0; for(const v of Object.values(cnt)){ if(v%2) return false; pairs+=v/2; }
                return pairs===7 && Object.keys(cnt).length===7;
            }
            hasMissingSuit(hand) {
                const suits = new Set(hand.map(t=>t.suit).filter(s=>['m','p','s'].includes(s)));
                const avail = ['m','p','s'].filter(s => SUITS[this.variant].includes(s));
                return suits.size < avail.length;
            }
            partitionHu(arr) {
                const cnt={}; for (const x of arr) cnt[x]=(cnt[x]||0)+1;
                const keys = Object.keys(cnt);
                for (const pair of keys) {
                    if ((cnt[pair]||0) < 2) continue;
                    const c = clone(cnt);
                    c[pair]-=2; if (c[pair]===0) delete c[pair];
                    if (this.canFormSets(c, (arr.length-2)/3)) return true;
                }
                return false;
            }
            canFormSets(counts,left) {
                if (left===0) return Object.keys(counts).length===0;
                const first = Object.keys(counts).sort()[0];
                if (!first) return left===0;
                const c1 = clone(counts);
                if ((c1[first]||0)>=3) { c1[first]-=3; if (c1[first]===0) delete c1[first]; if (this.canFormSets(c1,left-1)) return true; }
                const s=first[0];
                if (s==='m'||s==='p'||s==='s') {
                    const r=+first.slice(1);
                    const k2=s+(r+1), k3=s+(r+2);
                    if ((counts[k2]||0)>0 && (counts[k3]||0)>0) {
                        const c2=clone(counts);
                        for (const k of [first,k2,k3]) { c2[k]--; if (c2[k]===0) delete c2[k]; }
                        if (this.canFormSets(c2,left-1)) return true;
                    }
                }
                return false;
            }
            terminalOrHonor(t){ return ['z','f'].includes(t.suit) || t.rank===1 || t.rank===9; }
            allTypes() {
                const set=new Set();
                for (const s of SUITS[this.variant]) {
                    const ranks = (['m','p','s'].includes(s))?[1,2,3,4,5,6,7,8,9]:(s==='z'?[1,2,3,4]:[1,2,3]);
                    for (const r of ranks) set.add(s+r);
                }
                return [...set];
            }
            toggleAuto() { this.autoPlay=!this.autoPlay; this.flash(this.autoPlay?'AI代打开启':'AI代打关闭'); if (this.autoPlay && !this.isHumanTurn(this.current)) this.scheduleAI(); }
            renderAll() { this.renderHand(); this.renderSeats(); this.renderStatus(); }
            renderHand() {
                const el=document.getElementById('hand0');
                el.innerHTML='';
                const hand=this.hands[0]||[];
                for (let i=0;i<hand.length;i++) {
                    const btn=document.createElement('div');
                    btn.className='tile'+(this.selected===i?' selected':'')+(!this.isHumanTurn(0)||this.state!=='discard'?' disabled':'');
                    btn.textContent=tileLabel(hand[i]);
                    btn.addEventListener('click',()=>{ if (this.isHumanTurn(0)&&this.state==='discard'){
                        if (this.selected === i) this.discardSelected();
                        else { this.selected=i; this.renderHand(); }
                    } });
                    el.appendChild(btn);
                }
                document.getElementById('handCount0').textContent=hand.length+'张';
            }
            renderSeats() {
                document.getElementById('melds0').innerHTML=(this.melds[0]||[]).map(m=>'<span class="meld-chip">'+m.type+'</span>').join('');
                document.getElementById('discards0').innerHTML=(this.discards[0]||[]).map(t=>'<div class="tile t">'+tileLabel(t)+'</div>').join('');
                for (let p=1;p<this.playerCount;p++) {
                    const mc=document.getElementById('melds'+p), dc=document.getElementById('discards'+p), hc=document.getElementById('handCount'+p);
                    if (mc) mc.innerHTML=(this.melds[p]||[]).map(m=>'<span class="meld-chip">'+m.type+'</span>').join('');
                    if (dc) dc.innerHTML=(this.discards[p]||[]).map(t=>'<div class="tile t">'+tileLabel(t)+'</div>').join('');
                    if (hc) hc.textContent=(this.hands[p]?this.hands[p].length:0)+'张';
                }
                document.getElementById('turnText').textContent=`${this.playerName(this.current)}出牌 · ${this.turnNo+1}巡`;
                const ci=document.getElementById('centerInfo'); if (ci) ci.textContent=`牌墙：${this.wall.length}张`;
            }
            renderStatus() {
                document.getElementById('moveDetail').textContent = this.state==='ended' ? '本局结束' : (this.isHumanTurn(this.current)?'请出牌':`${this.playerName(this.current)}出牌中...`);
                document.getElementById('statusSub').textContent = `变体:${this.variant} 模式:${this.mode} 牌墙:${this.wall.length}`;
            }
            flash(msg,ms=1800){ const el=document.getElementById('moveDetail'); const old=el.textContent; el.textContent=msg; el.style.color='#fde68a'; setTimeout(()=>{if(el.textContent===msg){el.textContent=old; el.style.color='';}},ms); }
            sub() {}
            showHelp(){ document.getElementById('helpModal').style.display='grid'; }
            closeHelp(){ document.getElementById('helpModal').style.display='none'; }
            endGameNoWinner(){ this.state='ended'; this.flash('流局'); }
        }

        window.game = new Mahjong();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('../../sw.js').then(r => console.log('SW', r.scope)).catch(console.error);
      }
    </script>
</body>
