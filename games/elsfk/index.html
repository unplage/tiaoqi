    // 事件绑定
    function bindEvents(){
        // ---- 键盘 ----
        const heldKeys=new Set();
        document.addEventListener('keydown',(e)=>{
            if(e.repeat) return;                       // 忽略系统自动重复
            if(e.target&&/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
            if(!gameStarted){
                if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].indexOf(e.key)>=0){
                    e.preventDefault(); startGame();
                }
                return;
            }
            switch(e.key){
                case'ArrowLeft': e.preventDefault(); heldKeys.add('ArrowLeft'); startDAS(-1); break;
                case'ArrowRight': e.preventDefault(); heldKeys.add('ArrowRight'); startDAS(1); break;
                case'ArrowDown': e.preventDefault(); heldKeys.add('ArrowDown'); startSoftDrop(); break;
                case'ArrowUp': e.preventDefault(); rotatePiece(); break;
                case' ': e.preventDefault(); hardDrop(); break;
                case'z':case'Z': rotatePiece(); break;
                case'x':case'X': rotatePiece(); break;
                case'c':case'C': holdPiece(); break;
                case'p':case'P': togglePause(); break;
                case'Escape': toggleSettings(); break;
            }
        });
        document.addEventListener('keyup',(e)=>{
            heldKeys.delete(e.key);
            if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
                // 两个方向同时按住时，松开其中一个不应中断另一个
                if(!(heldKeys.has('ArrowLeft')||heldKeys.has('ArrowRight'))) clearDAS();
                else startDAS(heldKeys.has('ArrowLeft')?-1:1);
            }
            if(e.key==='ArrowDown') stopSoftDrop();
        });
        // 失焦时清空按键状态，避免 DAS 卡死
        window.addEventListener('blur',()=>{ heldKeys.clear(); clearDAS(); stopSoftDrop(); if(gameRunning&&!isPaused) togglePause(); });
        document.addEventListener('visibilitychange',()=>{ if(document.hidden){ heldKeys.clear(); clearDAS(); stopSoftDrop(); if(gameRunning&&!isPaused) togglePause(); } });

        // ---- 触控按钮 ----
        // 统一封装：优先使用 Pointer Events；浏览器不支持时回退到
        // touchstart / mousedown，保证任何环境下按钮都能响应
        const hasPointer = typeof window.PointerEvent!=='undefined';
        const bindPress=(btn,down,up)=>{
            if(!btn) return;
            if(hasPointer){
                btn.addEventListener('pointerdown',(e)=>{ if(e.cancelable) e.preventDefault(); initAudio(); down&&down(); });
                btn.addEventListener('pointerup',(e)=>{ e.preventDefault(); up&&up(); });
                btn.addEventListener('pointercancel',()=>up&&up());
                btn.addEventListener('pointerleave',()=>up&&up());
                btn.addEventListener('contextmenu',(e)=>e.preventDefault());
            } else {
                btn.addEventListener('touchstart',(e)=>{ e.preventDefault(); initAudio(); down&&down(); },{passive:false});
                btn.addEventListener('touchend',(e)=>{ e.preventDefault(); up&&up(); });
                btn.addEventListener('touchcancel',()=>up&&up());
                btn.addEventListener('mousedown',(e)=>{ e.preventDefault(); initAudio(); down&&down(); });
                btn.addEventListener('mouseup',()=>up&&up());
                btn.addEventListener('mouseleave',()=>up&&up());
            }
        };
        bindPress(document.getElementById('btnLeft'), ()=>startDAS(-1), clearDAS);
        bindPress(document.getElementById('btnRight'), ()=>startDAS(1), clearDAS);
        bindPress(document.getElementById('btnDown'), startSoftDrop, stopSoftDrop);
        bindPress(document.getElementById('btnRotate'), rotatePiece);
        bindPress(document.getElementById('btnHardDrop'), hardDrop);
        bindPress(document.getElementById('btnHold'), holdPiece);
        // 在 window 上兜底释放，避免手指抬起时事件落在按钮外导致 DAS 卡住
        window.addEventListener('pointerup',clearDAS);
        window.addEventListener('pointercancel',clearDAS);
        window.addEventListener('touchend',clearDAS);
        window.addEventListener('touchcancel',clearDAS);
        window.addEventListener('mouseup',clearDAS);

        // ---- 棋盘手势：滑动移动/旋转/硬降，点按暂存 ----
        bindGestures();

        // ---- 启动界面 ----
        const startBtn=document.getElementById('btnStart');
        if(startBtn){
            const fire=(e)=>{ if(e.cancelable) e.preventDefault(); startGame(); };
            startBtn.addEventListener('pointerdown',fire);
            startBtn.addEventListener('click',fire);
            startBtn.addEventListener('touchstart',fire,{passive:false});
        }
        const startModes=document.getElementById('startModes');
        if(startModes){
            startModes.addEventListener('click',(e)=>{
                const chip=e.target.closest('[data-mode]');
                if(!chip) return;
                document.getElementById('gameModeSelect').value=chip.dataset.mode;
                gameMode=chip.dataset.mode;
                restart(true);
            });
        }

        // ---- 设置面板 ----
        document.getElementById('dasSlider').addEventListener('input',(e)=>{ document.getElementById('dasValue').textContent=e.target.value; markPreset('dasPresets','das',e.target.value); });
        document.getElementById('arrSlider').addEventListener('input',(e)=>{ document.getElementById('arrValue').textContent=e.target.value; markPreset('arrPresets','arr',e.target.value); });
        document.getElementById('dasPresets').addEventListener('click',(e)=>{
            let b=e.target.closest('[data-das]'); if(!b) return;
            document.getElementById('dasSlider').value=b.dataset.das;
            document.getElementById('dasValue').textContent=b.dataset.das;
            markPreset('dasPresets','das',b.dataset.das);
        });
        document.getElementById('arrPresets').addEventListener('click',(e)=>{
            let b=e.target.closest('[data-arr]'); if(!b) return;
            document.getElementById('arrSlider').value=b.dataset.arr;
            document.getElementById('arrValue').textContent=b.dataset.arr;
            markPreset('arrPresets','arr',b.dataset.arr);
        });

        window.addEventListener('resize',()=>{ updateCanvasSize(); });
        window.addEventListener('orientationchange',()=>setTimeout(updateCanvasSize,200));
        if(window.visualViewport) window.visualViewport.addEventListener('resize',updateCanvasSize);
    }
    function markPreset(containerId,attr,value){
        let box=document.getElementById(containerId); if(!box) return;
        box.querySelectorAll('.preset-btn').forEach(b=>b.classList.toggle('active', b.dataset[attr]===String(value)));
    }
    // 棋盘手势：滑动移动/旋转/硬降，点按暂存
    function bindGestures(){
        let startX=0, startY=0, startT=0, active=false, moved=false;
        const TH=22;   // 触发阈值(px)
        const onDown=(x,y,t)=>{ active=true; moved=false; startX=x; startY=y; startT=t; initAudio(); };
        const onMove=(x,y)=>{
            if(!active||moved) return;
            let dx=x-startX, dy=y-startY;
            if(Math.abs(dx)<TH && Math.abs(dy)<TH) return;
            moved=true;
            if(Math.abs(dx)>Math.abs(dy)){
                let steps=Math.trunc(dx/TH), dir=steps>0?1:-1;
                for(let i=0;i<Math.abs(steps);i++) move(dir);
            } else if(dy<0){
                rotatePiece();
            } else {
                hardDrop();
            }
            startX=x; startY=y;
        };
        const onUp=()=>{
            if(!active) return;
            active=false;
            if(!moved && performance.now()-startT<300) holdPiece();   // 轻点 = 暂存
        };
        if(typeof window.PointerEvent!=='undefined'){
            canvas.addEventListener('pointerdown',(e)=>{
                if(!gameRunning||isPaused) return;
                e.preventDefault();
                onDown(e.clientX,e.clientY,performance.now());
                try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
            });
            canvas.addEventListener('pointermove',(e)=>{ if(!active) return; e.preventDefault(); onMove(e.clientX,e.clientY); });
            canvas.addEventListener('pointerup',onUp);
            canvas.addEventListener('pointercancel',()=>{active=false;});
            canvas.addEventListener('contextmenu',(e)=>e.preventDefault());
        } else {
            // 回退：touch events
            canvas.addEventListener('touchstart',(e)=>{
                if(!gameRunning||isPaused) return;
                e.preventDefault();
                const t=e.touches[0]; onDown(t.clientX,t.clientY,performance.now());
            },{passive:false});
            canvas.addEventListener('touchmove',(e)=>{
                if(!active) return;
                e.preventDefault();
                const t=e.touches[0]; onMove(t.clientX,t.clientY);
            },{passive:false});
            canvas.addEventListener('touchend',(e)=>{ e.preventDefault(); onUp(); });
            canvas.addEventListener('touchcancel',()=>{active=false;});
            canvas.addEventListener('mousedown',(e)=>{ if(!gameRunning||isPaused) return; onDown(e.clientX,e.clientY,performance.now()); });
            canvas.addEventListener('mousemove',(e)=>{ if(active) onMove(e.clientX,e.clientY); });
            canvas.addEventListener('mouseup',onUp);
            canvas.addEventListener('contextmenu',(e)=>e.preventDefault());
        }
    }

    window.addEventListener('load', async()=>{
        // ① 先把界面与交互准备好——绝不能被本地存储阻塞
        bindEvents();
        refreshThemeColors();
        applyGridSize(document.getElementById('gridSizeSelect').value||'12x24');
        updateCanvasSize();
        restart(true);                   // 统一走 restart()，保证首局模式/计时/统计正确
        requestAnimationFrame(updateCanvasSize);   // 首帧布局稳定后再校准一次棋盘尺寸
        animationFrameId=requestAnimationFrame(gameLoop);
        // ② 再异步读取本地数据（失败/超时都不影响上面的可用性）
        try{
            await initDatabase();
        }catch(e){
            console.warn('本地存储不可用，进入无痕模式：', e);
        }
    });
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(e=>console.log);</script>
</body>
</html>
