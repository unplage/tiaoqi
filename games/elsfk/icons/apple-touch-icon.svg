<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="终极方块">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e38"/>
      <stop offset="0.55" stop-color="#16213e"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#4fc3f7" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset in="blur" dx="0" dy="10" result="off"/>
      <feFlood flood-color="#000000" flood-opacity="0.45" result="shc"/>
      <feComposite in="shc" in2="off" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <rect width="512" height="512" fill="url(#halo)"/>
  <rect width="512" height="512" fill="url(#well)"/><g transform="translate(256 256) scale(0.82) translate(-256 -256)">
  <g filter="url(#glow)" opacity="0.7"><rect x="190" y="120" width="132" height="132" fill="#22d3ee"/><rect x="330" y="120" width="132" height="132" fill="#22d3ee"/><rect x="50" y="260" width="132" height="132" fill="#22d3ee"/><rect x="190" y="260" width="132" height="132" fill="#22d3ee"/></g>
  <g filter="url(#drop)">

    <g>
      <rect x="190" y="120" width="132" height="132" fill="#22d3ee"/>
      <rect x="190" y="120" width="132" height="13" fill="#ffffff" fill-opacity="0.30"/>
      <rect x="190" y="120" width="13" height="132" fill="#ffffff" fill-opacity="0.30"/>
      <rect x="309" y="120" width="13" height="132" fill="#000000" fill-opacity="0.30"/>
      <rect x="190" y="239" width="132" height="13" fill="#000000" fill-opacity="0.30"/>
    </g>

    <g>
      <rect x="330" y="120" width="132" height="132" fill="#06b6d4"/>
      <rect x="330" y="120" width="132" height="13" fill="#ffffff" fill-opacity="0.30"/>
      <rect x="330" y="120" width="13" height="132" fill="#ffffff" fill-opacity="0.30"/>
      <rect x="449" y="120" width="13" height="132" fill="#000000" fill-opacity="0.30"/>
      <rect x="330" y="239" width="132" height="13" fill="#000000" fill-opacity="0.30"/>
    </g>

    <g>
      <rect x="50" y="260" width="132" height="132" fill="#a855f7"/>
      <rect x="50" y="260" width="132" height="13" fill="#ffffff" fill-opacity="0.30"/>
      <rect x="50" y="260" width="13" height="132" fill="#ffffff" fill-opacity="0.30"/>
      <rect x="169" y="260" width="13" height="132" fill="#000000" fill-opacity="0.30"/>
      <rect x="50" y="379" width="132" height="13" fill="#000000" fill-opacity="0.30"/>
    </g>

    <g>
      <rect x="190" y="260" width="132" height="132" fill="#8b5cf6"/>
      <rect x="190" y="260" width="132" height="13" fill="#ffffff" fill-opacity="0.30"/>
      <rect x="190" y="260" width="13" height="132" fill="#ffffff" fill-opacity="0.30"/>
      <rect x="309" y="260" width="13" height="132" fill="#000000" fill-opacity="0.30"/>
      <rect x="190" y="379" width="132" height="13" fill="#000000" fill-opacity="0.30"/>
    </g>
  </g></g>
</svg>
