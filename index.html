                pathEl.style.strokeDasharray = length;
                pathEl.style.strokeDashoffset = length;
                pathEl.style.animation = 'draw-path 0.4s ease-out forwards';
                // 只添加一次 keyframe 样式
                if (!document.getElementById('draw-path-style')) {
                    const style = document.createElement('style');
                    style.id = 'draw-path-style';
                    style.textContent = '@keyframes draw-path { to { stroke-dashoffset: 0; } }';
                    document.head.appendChild(style);
                }
                svg.appendChild(pathEl);
                this.board.appendChild(svg);
                setTimeout(() => {
                    svg.remove();
                }, 2000);
            }

            showLastMove(pos) {
                const indicator = document.createElement('div');
                indicator.className = 'last-move';
                const size = Math.max(6, Math.round(16 * this.currentScale));
                indicator.style.left = (pos.x - size) + 'px';
                indicator.style.top = (pos.y - size) + 'px';
                indicator.style.width = (size * 2) + 'px';
                indicator.style.height = (size * 2) + 'px';
                this.board.appendChild(indicator);
                setTimeout(() => indicator.remove(), 2000);
            }

            deselect() {
                if (this.selectedPiece) {
                    this.selectedPiece.classList.remove('selected');
                    this.selectedPiece = null;
                }
                this.validMoves = [];
                this.clearHighlights();
                if (!this.isInJumpChain && !this.freeMode) {
                    document.getElementById('moveDetail').textContent = '选择棋子';
                    document.getElementById('statusBadge').style.display = 'none';
                } else if (this.freeMode) {
                    document.getElementById('moveDetail').textContent = '自由模式 - 点击棋子';
                }
            }

            nextPlayer() {
                const playOrder = this.getPlayOrder();
                const currentIndex = playOrder.indexOf(this.currentPlayer);
                // 轮转时跳过已夺冠（离场）玩家
                for (let k = 1; k <= playOrder.length; k++) {
                    const cand = playOrder[(currentIndex + k) % playOrder.length];
                    if (!this.finishedSet.has(cand)) { this.currentPlayer = cand; break; }
                }
                this.jumpChainCount = 0;
                this.isInJumpChain = false;
                this.originalPiece = null;
                this.jumpStartPosition = null;
                // 回合移交时清除"AI 思考中"等残留提示
                document.getElementById('moveDetail').textContent = '选择棋子';
                document.getElementById('statusBadge').style.display = 'none';
                this.updatePlayerDisplay();
                this.updatePlayersLegend();
                // 人类回合但无子可动：自动跳过（防止对局停滞）
                if (!this.finishedSet.has(this.currentPlayer) && !this.aiPlayers.includes(this.currentPlayer)) {
                    if (!this.humanHasAnyMove(this.currentPlayer)) {
                        this.stuckChain++;
                        if (this.stuckChain >= this.playerCount * 2) {
                            this.showMessage('多位玩家均无子可动，请重置对局');
                            this.stuckChain = 0;
                            return;
                        }
                        this.showMessage(`${this.playerColors[this.currentPlayer]}方无子可动，自动跳过`);
                        this.advanceTurn();
                        return;
                    }
                }
                this.stuckChain = 0;
            }

            humanHasAnyMove(player) {
                const pieces = this.pieces.filter(p =>
                    p.player === player &&
                    this.boardState.get(`${p.pos.row}-${p.pos.col}`) === player
                );
                for (const p of pieces) {
                    if (this.calculateValidMoves(p.pos).length > 0) return true;
                }
                return false;
            }

            updatePlayerDisplay() {
                const indicator = document.getElementById('playerIndicator');
                const text = document.getElementById('playerText');
                const display = document.getElementById('currentPlayer');
                indicator.style.background = this.colorCodes[this.currentPlayer];
                indicator.style.boxShadow = `0 0 15px ${this.colorCodes[this.currentPlayer]}`;
                text.textContent = `${this.playerColors[this.currentPlayer]}方回合`;
                display.style.borderColor = this.colorCodes[this.currentPlayer];
                display.style.boxShadow = `0 0 20px ${this.colorCodes[this.currentPlayer]}40`;
            }

            checkWin(player) {
                // 正确的对角配对：0↔1, 2↔5, 3↔4
                const targetMap = {0:1, 1:0, 2:5, 3:4, 4:3, 5:2};
                const targetPlayer = targetMap[player];
                const allPositions = this.getAllCornerPositions();
                const targetPositions = allPositions[targetPlayer];
                let count = 0;
                for (let pos of targetPositions) {
                    if (this.boardState.get(`${pos.row}-${pos.col}`) === player) count++;
                }
                return count >= 10;
            }

            // 进展分：该玩家 10 子到各自目标角的曼哈顿距离总和（取负，越大=越接近胜利）
            progressScore(player) {
                const targetMap = {0:1, 1:0, 2:5, 3:4, 4:3, 5:2};
                const targetPositions = this.getAllCornerPositions()[targetMap[player]];
                let dist = 0;
                this.boardState.forEach((p, key) => {
                    if (p !== player) return;
                    const [r, c] = key.split('-').map(Number);
                    let md = Infinity;
                    for (const tp of targetPositions) md = Math.min(md, Math.abs(r - tp.row) + Math.abs(c - tp.col));
                    dist += md;
                });
                return -dist;
            }

            // 每次落子后更新僵局计数：走子者取得进展则清零，否则累加
            updateStagnation(mover) {
                if (this.finishedSet.has(mover)) return;
                const score = this.progressScore(mover);
                const best = this.bestProgress[mover] ?? -Infinity;
                if (score > best) {
                    this.bestProgress[mover] = score;
                    this.stagnation = 0;
                } else {
                    this.stagnation++;
                }
            }

            // 僵局检测：连续多步无人取得进展（无吃子规则下，棋子可能把狭道/目标角永久封死，
            // 导致各方都无法再入角）。仅提示，不判和，由玩家决定继续或重置。
            maybeTriggerStalemate() {
                if (this.awaitingStalemate || this.freeMode) return;
                if (this.finishedSet.size >= this.playerCount - 1) return;
                if (this.stagnation < this.STALEMATE_LIMIT) return;
                this.awaitingStalemate = true;
                this.clearPendingAI();
                const modal = document.getElementById('stalemateMessage');
                const text = document.getElementById('stalemateText');
                text.innerHTML = `连续 ${this.stagnation} 步没有任何一方取得进展，<br>所有棋子都已难以再进入对角营地。<br>你可以<b>继续对局</b>寻找机会，或<b>重置</b>再来一局。`;
                modal.style.display = 'block';
            }

            // 玩家选择“继续对局”：关闭弹窗、重新给一轮无进展宽限
            continueAfterStalemate() {
                document.getElementById('stalemateMessage').style.display = 'none';
                this.awaitingStalemate = false;
                this.stagnation = 0;
                this.deselect();
                this.isMoving = false;
                if (this.aiEnabled && this.aiPlayers.includes(this.currentPlayer)) {
                    this.tryExecuteAITurn();
                }
            }

            handleWin(player) {
                this.clearPendingAI();
                this.awaitingContinue = false;
                const modal = document.getElementById('winMessage');
                const text = document.getElementById('winnerText');
                const btn = document.getElementById('winContinueBtn');
                // 自由模式或 2 人：单局即止（原行为）
                if (this.freeMode || this.playerCount === 2) {
                    text.innerHTML = `<div style="font-size: 1.3em; margin-bottom: 8px;"><span style="color: ${this.colorCodes[player]}; text-shadow: 0 0 20px currentColor;">${this.playerColors[player]}方</span></div><div style="color: #94a3b8; font-size: 0.9em;">率先占领对角！</div>`;
                    btn.textContent = '再来一局';
                    modal.style.display = 'block';
                    return;
                }
                // 多人：记录名次、棋子留在棋盘、其余玩家继续争夺 2/3…N 名
                if (this.finishedSet.has(player)) return;
                this.finishedPlayers.push(player);
                this.finishedSet.add(player);
                this.deselect();
                this.isInJumpChain = false;
                this.hideEndTurnButton();
                this.stuckChain = 0;
                const rank = this.finishedPlayers.length;
                this.updatePlayersLegend();
                this.updatePlayerDisplay();
                text.innerHTML = `<div style="font-size: 1.3em; margin-bottom: 8px;"><span style="color: ${this.colorCodes[player]}; text-shadow: 0 0 20px currentColor;">${this.playerColors[player]}方</span></div><div style="color: #fbbf24; font-size: 1em; margin: 6px 0;">第 ${rank} 名 🏅</div><div style="color: #94a3b8; font-size: 0.85em;">棋子留在棋盘，其余玩家继续对局</div>`;
                btn.textContent = '继续对局';
                modal.style.display = 'block';
                this.awaitingContinue = true;
            }

            continueAfterWin() {
                document.getElementById('winMessage').style.display = 'none';
                // 仅剩最后一名：补齐末名并展示总排名
                if (this.finishedPlayers.length === this.playerCount - 1) {
                    const last = this.getPlayOrder().find(p => !this.finishedSet.has(p));
                    if (last !== undefined && !this.finishedSet.has(last)) {
                        this.finishedPlayers.push(last);
                        this.finishedSet.add(last);
                    }
                    this.showFinalRanking();
                    return;
                }
                this.advanceTurn();
            }

            showFinalRanking() {
                this.clearPendingAI();
                this.awaitingContinue = false;
                const modal = document.getElementById('winMessage');
                const text = document.getElementById('winnerText');
                const btn = document.getElementById('winContinueBtn');
                const list = this.finishedPlayers.map((p, i) =>
                    `<div style="margin: 5px 0;"><span style="color: ${this.colorCodes[p]}; text-shadow: 0 0 12px currentColor;">${this.playerColors[p]}方</span> <span style="color: #94a3b8;">第 ${i + 1} 名</span></div>`
                ).join('');
                text.innerHTML = `<div style="font-size: 1.3em; margin-bottom: 10px;">🏆 对局结束</div><div style="color: #fbbf24; font-size: 0.95em; margin-bottom: 8px;">最终排名</div>${list}`;
                btn.textContent = '再来一局';
                modal.style.display = 'block';
            }

            handleWinBtn() {
                document.getElementById('winMessage').style.display = 'none';
                if (this.awaitingContinue) {
                    this.awaitingContinue = false;
                    this.continueAfterWin();
                } else {
                    this.reset();
                }
            }

            updateUndoButton() {
                const btn = document.getElementById('undoBtn');
                if (!btn) return;
                if (!this.hasHuman()) { btn.disabled = true; return; }
                btn.disabled = this.moveHistory.length === 0;
            }

            undo() {
                if (this.isMoving || this.moveHistory.length === 0) return;
                if (!this.hasHuman()) return; // 全 AI 观战：撤销禁用
                if (this.isInJumpChain) {
                    this.isInJumpChain = false;
                    this.jumpChainCount = 0;
                    this.hideEndTurnButton();
                }
                // 取消未决的 AI 走棋
                this.clearPendingAI();
                const undone = [];
                // 弹出顶部所有 AI 步
                while (this.moveHistory.length > 0) {
                    const top = this.moveHistory[this.moveHistory.length - 1];
                    if (this.aiEnabled && this.aiPlayers.includes(top.player)) {
                        undone.push(this.moveHistory.pop());
                    } else break;
                }
                // 再弹出人类的上一步
                if (this.moveHistory.length > 0) undone.push(this.moveHistory.pop());
                if (undone.length === 0) return;
                // 依次还原棋子（先撤 AI 步，再撤人类步）
                for (let i = undone.length - 1; i >= 0; i--) {
                    const m = undone[i];
                    this.boardState.delete(`${m.to.row}-${m.to.col}`);
                    this.boardState.set(`${m.from.row}-${m.from.col}`, m.player);
                    const oldPos = this.positions[m.from.row][m.from.col];
                const pieceSize = Math.max(4, Math.round(13 * this.currentScale));
                    m.piece.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    m.piece.style.left = (oldPos.x - pieceSize) + 'px';
                    m.piece.style.top = (oldPos.y - pieceSize) + 'px';
                    setTimeout(() => {
                        m.piece.dataset.row = m.from.row;
                        m.piece.dataset.col = m.from.col;
                        m.piece.style.transition = '';
                        // 同步棋子记录位置，保证撤销后 p.pos 与棋盘一致
                        const rec = this.pieces.find(p => p.element === m.piece);
                        if (rec) rec.pos = {row: m.from.row, col: m.from.col};
                    }, 400);
                }
                const lastMove = undone[undone.length - 1];
                if (!this.freeMode) {
                    this.currentPlayer = lastMove.player;
                    this.rebuildFinished();
                    this.updatePlayerDisplay();
                    this.updatePlayersLegend();
                }
                // 撤销会改变盘面，重新结算僵局计数并关闭僵局弹窗
                this.stagnation = 0;
                this.bestProgress = {};
                for (const p of this.getPlayOrder()) {
                    if (!this.finishedSet.has(p)) this.bestProgress[p] = this.progressScore(p);
                }
                this.awaitingStalemate = false;
                document.getElementById('stalemateMessage').style.display = 'none';
                this.deselect();
                this.updateUndoButton();
            }

            // 撤销后按当前棋盘重建已夺冠玩家集合（保持名次先后，新增追加）
            rebuildFinished() {
                const playOrder = this.getPlayOrder();
                const completed = new Set(playOrder.filter(p => this.checkWin(p)));
                const kept = this.finishedPlayers.filter(p => completed.has(p));
                for (const p of playOrder) {
                    if (completed.has(p) && !kept.includes(p)) kept.push(p);
                }
                this.finishedPlayers = kept;
                this.finishedSet = new Set(kept);
            }

            reset() {
                if (this.freeMode) this.toggleFreeMode();
                this.moveHistory = [];
                this.isMoving = false;
                this.isInJumpChain = false;
                this.jumpChainCount = 0;
                this.originalPiece = null;
                this.jumpStartPosition = null;
                this.awaitingContinue = false;
                this.awaitingStalemate = false;
                this.stagnation = 0;
                this.bestProgress = {};
                this.finishedPlayers = [];
                this.finishedSet = new Set();
                this.stuckChain = 0;
                this.clearPendingAI();
                this.hideEndTurnButton();
                this.updateUndoButton();
                document.getElementById('winMessage').style.display = 'none';
                document.getElementById('stalemateMessage').style.display = 'none';
                document.getElementById('moveDetail').textContent = '选择棋子';
                document.getElementById('statusBadge').style.display = 'none';
                const activePlayers = this.getActivePlayers();
                this.currentPlayer = activePlayers[0];
                this.deselect();
                this.setupPieces();
                // 记录各方开局进展分，僵局计数从“未能突破开局”的走子开始累计
                for (const p of this.getPlayOrder()) {
                    if (!this.finishedSet.has(p)) this.bestProgress[p] = this.progressScore(p);
                }
                this.updatePlayerDisplay();
                this.updatePlayersLegend();
                // AI 先手时触发（2/4/6 人通用）
                if (this.aiEnabled && this.aiPlayers.includes(this.currentPlayer)) {
                    this.aiTimerId = setTimeout(() => this.tryExecuteAITurn(), 400);
                }
            }
        }

        const game = new ChineseCheckers();
    </script>

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('Service Worker 注册成功，作用域:', reg.scope);
        }).catch(err => {
          console.error('Service Worker 注册失败:', err);
        });
      }
    </script>
