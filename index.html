<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>中国跳棋 - 自由模式版</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            min-height: 100dvh;
            height: 100dvh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: white;
            padding: 6px 10px;
            overflow-x: hidden;
            overflow-y: auto;
            gap: 4px;
        }

        h1 {
            margin-bottom: 4px;
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            background: linear-gradient(45deg, #f59e0b 0%, #fbbf24 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
            letter-spacing: 2px;
            text-align: center;
        }

        .game-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            margin-bottom: 4px;
            width: 100%;
            max-width: 700px;
            flex-shrink: 0;
        }

        .game-info {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .current-player {
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            border: 2px solid;
            transition: all 0.3s;
            backdrop-filter: blur(12px);
            min-width: 140px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            flex: 1;
            max-width: 200px;
        }

        .mode-selector {
            display: flex;
            gap: 6px;
            background: rgba(255,255,255,0.06);
            padding: 5px;
            border-radius: 20px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: clamp(0.8rem, 3vw, 0.95rem);
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before, button:active::before {
            left: 100%;
        }

        button:hover, button:active {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        button.active {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        button.free-mode-active {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        button.ai-active {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4) !important;
        }

        .ai-thinking {
            display: inline-block;
            padding: 2px 10px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            font-size: 0.75em;
            color: #ef4444;
            animation: ai-pulse 1s infinite;
            margin-left: 6px;
        }

        @keyframes ai-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .difficulty-selector {
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.06);
            padding: 3px;
            border-radius: 15px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .difficulty-selector button {
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 12px;
        }

        .ai-count-selector {
            display: flex;
            gap: 4px;
            align-items: center;
            background: rgba(255,255,255,0.06);
            padding: 3px 6px;
            border-radius: 15px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .ai-count-selector button {
            padding: 5px 9px;
            font-size: 0.72rem;
            border-radius: 11px;
        }

        .ai-difficulty-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            padding: 5px 10px;
            border-radius: 15px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .ai-diff-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            color: #cbd5e1;
            background: rgba(255,255,255,0.05);
            padding: 3px 8px;
            border-radius: 12px;
        }

        .ai-diff-item select {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 2px 4px;
            font-size: 0.72rem;
        }

        .rank-badge {
            display: inline-block;
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.4);
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 0.68em;
            margin-left: 3px;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
        }

        .move-info-panel {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            padding: 10px 16px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .move-status {
            font-size: 0.85em;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .move-detail {
            font-size: clamp(0.95rem, 3.5vw, 1.1rem);
            font-weight: 600;
            color: white;
            line-height: 1.4;
        }

        .jump-badge {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.85em;
            margin-left: 6px;
            font-weight: 700;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-top: 4px;
            font-weight: 600;
        }

        .status-badge.continue {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.4);
            animation: pulse-text 1.5s infinite;
        }

        .status-badge.end-turn {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        #board-container {
            position: relative;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #board {
            position: relative;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(139, 92, 43, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(139, 92, 43, 0.3) 0%, transparent 50%),
                linear-gradient(165deg, #8b5a2b 0%, #6b4423 50%, #5d3a1a 100%);
            border-radius: 16px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255,255,255,0.1),
                0 0 0 6px #4a3728;
            padding: clamp(20px, 5vw, 35px);
            user-select: none;
            border: 1px solid rgba(139, 92, 43, 0.5);
            transform-origin: center center;
            transition: transform 0.1s ease;
        }

        .hole {
            position: absolute;
            background: 
                radial-gradient(circle at 30% 30%, rgba(92, 64, 51, 0.8), rgba(45, 31, 22, 0.9));
            border-radius: 50%;
            box-shadow: 
                inset 2px 2px 4px rgba(0, 0, 0, 0.9), 
                inset -1px -1px 2px rgba(255, 255, 255, 0.05),
                0 2px 4px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
        }

        .hole:hover, .hole:active {
            box-shadow: 
                inset 2px 2px 4px rgba(0, 0, 0, 0.8), 
                0 0 20px rgba(255, 255, 255, 0.3);
            transform: scale(1.15);
        }

        .hole.valid-move {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95), rgba(200, 200, 200, 0.8));
            box-shadow: 
                0 0 15px rgba(255, 255, 255, 0.6), 
                inset 0 0 8px rgba(255, 255, 255, 0.4),
                0 0 30px rgba(255, 255, 255, 0.3);
            animation: pulse-glow 2s infinite;
            z-index: 15;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .hole.jump-move {
            background: radial-gradient(circle at 30% 30%, rgba(147, 197, 253, 0.95), rgba(96, 165, 250, 0.9));
            box-shadow: 
                0 0 20px rgba(59, 130, 246, 0.8), 
                inset 0 0 10px rgba(147, 197, 253, 0.6),
                0 0 40px rgba(59, 130, 246, 0.5);
            animation: pulse-blue 1.5s infinite;
            border: 2px solid rgba(147, 197, 253, 0.9);
            z-index: 16;
        }

        .hole.jump-continue {
            background: radial-gradient(circle at 30% 30%, rgba(251, 191, 36, 0.95), rgba(245, 158, 11, 0.9));
            box-shadow: 
                0 0 20px rgba(251, 191, 36, 0.8), 
                inset 0 0 10px rgba(251, 191, 36, 0.6),
                0 0 40px rgba(251, 191, 36, 0.5);
            animation: pulse-gold 1s infinite;
            border: 2px solid rgba(251, 191, 36, 0.9);
            z-index: 17;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }

        @keyframes pulse-blue {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.25); opacity: 0.75; }
        }

        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.3); opacity: 0.8; }
        }

        .piece {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
            pointer-events: auto;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: 
                radial-gradient(circle at 25% 25%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.3) 20%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(0,0,0,0.2) 0%, transparent 40%);
            box-shadow: 
                inset 2px 2px 4px rgba(255,255,255,0.5),
                inset -2px -2px 4px rgba(0,0,0,0.3),
                0 4px 8px rgba(0,0,0,0.4),
                0 0 15px currentColor;
        }

        .piece:hover, .piece:active {
            transform: scale(1.15);
            z-index: 30;
            filter: brightness(1.2);
            box-shadow: 
                inset 2px 2px 6px rgba(255,255,255,0.7),
                inset -2px -2px 6px rgba(0,0,0,0.4),
                0 6px 20px rgba(0,0,0,0.5),
                0 0 30px currentColor;
        }

        .piece.selected {
            animation: selected-glow 1.5s ease-in-out infinite alternate;
            transform: scale(1.15);
            z-index: 40;
            box-shadow: 
                inset 2px 2px 6px rgba(255,255,255,0.9),
                inset -2px -2px 6px rgba(0,0,0,0.5),
                0 0 30px currentColor,
                0 0 60px currentColor;
        }

        @keyframes selected-glow {
            from { box-shadow: inset 2px 2px 6px rgba(255,255,255,0.7), 0 0 20px currentColor, 0 0 40px currentColor; }
            to { box-shadow: inset 2px 2px 8px rgba(255,255,255,0.9), 0 0 40px currentColor, 0 0 80px rgba(255,255,255,0.6); }
        }

        /* 玻璃弹珠颜色 */
        .piece.player-0 { background-color: #ef4444; color: rgba(239, 68, 68, 0.8); }
        .piece.player-1 { background-color: #3b82f6; color: rgba(59, 130, 246, 0.8); }
        .piece.player-2 { background-color: #22c55e; color: rgba(34, 197, 94, 0.8); }
        .piece.player-3 { background-color: #eab308; color: rgba(234, 179, 8, 0.8); }
        .piece.player-4 { background-color: #a855f7; color: rgba(168, 85, 247, 0.8); }
        .piece.player-5 { background-color: #06b6d4; color: rgba(6, 182, 212, 0.8); }

        @keyframes marble-drop {
            0% { transform: translateY(-50px) scale(0.3); opacity: 0; }
            60% { transform: translateY(5px) scale(1.1); opacity: 1; }
            80% { transform: translateY(-3px) scale(0.95); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .hint-text { color: #60a5fa; }
        .jump-text { color: #fbbf24; }

        .win-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: clamp(30px, 8vw, 50px) clamp(25px, 6vw, 60px);
            border-radius: 20px;
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255,255,255,0.1),
                inset 0 1px 0 rgba(255,255,255,0.1);
            z-index: 1000;
            text-align: center;
            display: none;
            border: 2px solid rgba(251, 191, 36, 0.5);
            animation: modal-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            width: 90%;
            max-width: 400px;
        }

        @keyframes modal-in {
            to { transform: translate(-50%, -50%) scale(1); }
        }

        .win-message h2 {
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            margin-bottom: 15px;
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .last-move {
            position: absolute;
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            pointer-events: none;
            animation: fade-ring 2s forwards;
            z-index: 5;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        @keyframes fade-ring {
            0%, 50% { opacity: 1; transform: scale(1); border-width: 3px; }
            100% { opacity: 0; transform: scale(1.5); border-width: 0px; }
        }

        .player-indicator {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
            box-shadow: 0 0 10px currentColor;
            border: 2px solid rgba(255,255,255,0.8);
        }

        .move-path {
            position: absolute;
            pointer-events: none;
            z-index: 18;
        }

        .players-legend {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
            font-size: clamp(0.75rem, 2.8vw, 0.85rem);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .end-turn-btn {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%) !important;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4) !important;
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 4px 25px rgba(34, 197, 94, 0.7); }
        }

        /* 移动端优化 */
        @media (max-width: 480px) {
            .game-panel {
                gap: 4px;
            }
            
            .game-info {
                flex-direction: column;
                gap: 4px;
            }
            
            .current-player {
                width: 100%;
                max-width: none;
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            
            .controls {
                width: 100%;
                justify-content: stretch;
            }
            
            .controls button {
                flex: 1;
                padding: 8px 6px;
                font-size: 0.75rem;
            }
            
            .mode-selector {
                width: 100%;
                justify-content: center;
            }
            
            .mode-selector button {
                flex: 1;
                padding: 6px 8px;
                font-size: 0.75rem;
            }

            .ai-count-selector button {
                padding: 5px 7px;
                font-size: 0.7rem;
            }

            .difficulty-selector button {
                padding: 5px 8px;
                font-size: 0.7rem;
            }
        }

        @media (min-width: 768px) {
            .game-panel {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        /* 高度不足的屏幕上隐藏标题，把空间让给棋盘 */
        @media (max-height: 480px) {
            h1 {
                display: none;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
    </style>
</head>
<body>
    <h1>🔮 玻璃弹珠跳棋</h1>
    
    <div class="game-panel">
        <div class="game-info">
            <div class="current-player" id="currentPlayer">
                <span class="player-indicator" id="playerIndicator"></span>
                <span id="playerText">红方回合</span>
            </div>
            
            <div class="mode-selector">
                <button onclick="game.setMode(2)" id="mode2">2人</button>
                <button onclick="game.setMode(4)" id="mode4">4人</button>
                <button onclick="game.setMode(6)" id="mode6" class="active">6人</button>
                <button onclick="game.toggleAI()" id="aiBtn">🤖 人机</button>
            </div>

            <div class="ai-count-selector" id="aiCountSelector" style="display: none;">
                <span style="font-size: 0.72rem; color: #94a3b8;">AI:</span>
                <button onclick="game.setAICount(0)" id="aiCount0">0</button>
                <button onclick="game.setAICount(1)" id="aiCount1">1</button>
                <button onclick="game.setAICount(2)" id="aiCount2">2</button>
                <button onclick="game.setAICount(3)" id="aiCount3">3</button>
                <button onclick="game.setAICount(4)" id="aiCount4">4</button>
                <button onclick="game.setAICount(5)" id="aiCount5">5</button>
                <button onclick="game.setAICount(6)" id="aiCount6">6</button>
            </div>
            
            <div class="controls">
                <button onclick="game.reset()">🔄 重置</button>
                <button onclick="game.undo()" id="undoBtn" disabled>↩️ 撤销</button>
                <button onclick="game.toggleMoveHint()" id="hintBtn">💡 提示</button>
                <button onclick="game.toggleFreeMode()" id="freeModeBtn">🎲 自由模式</button>
                <button onclick="game.endJumpChain()" id="endTurnBtn" style="display: none;" class="end-turn-btn">✓ 结束回合</button>
            </div>
            
            <div id="aiDifficultyPanel" class="ai-difficulty-panel" style="display: none;"></div>
        </div>
        
        <div class="move-info-panel">
            <div class="move-status">当前状态</div>
            <div class="move-detail" id="moveDetail">选择棋子开始游戏</div>
            <div class="status-badge" id="statusBadge" style="display: none;"></div>
            <div class="players-legend" id="playersLegend"></div>
        </div>
    </div>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <div class="win-message" id="winMessage">
        <h2>🎉 恭喜获胜！</h2>
        <p id="winnerText"></p>
        <button onclick="game.handleWinBtn()" id="winContinueBtn" style="margin-top: 20px; padding: 14px 35px; font-size: 1.1em;">再来一局</button>
    </div>

    <div class="win-message" id="stalemateMessage">
        <h2>⚖️ 对局陷入僵局</h2>
        <p id="stalemateText" style="color: #94a3b8; font-size: 0.95em; line-height: 1.6;"></p>
        <div style="margin-top: 20px; display: flex; gap: 12px; justify-content: center;">
            <button onclick="game.continueAfterStalemate()" style="padding: 12px 24px; font-size: 1em; cursor: pointer; border: none; border-radius: 10px; background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff;">继续对局</button>
            <button onclick="game.reset()" style="padding: 12px 24px; font-size: 1em; cursor: pointer; border: none; border-radius: 10px; background: linear-gradient(135deg, #64748b, #475569); color: #fff;">重置再来</button>
        </div>
    </div>

    <script>
        // ========== 中国跳棋游戏主类 ==========
        class ChineseCheckers {
            constructor() {
                this.board = document.getElementById('board');
                this.playerCount = 6;
                this.currentPlayer = 0;
                this.selectedPiece = null;
                this.validMoves = [];
                this.moveHistory = [];
                this.pieces = [];
                this.holes = [];
                this.boardState = new Map();
                this.showMoveHint = true;
                this.isMoving = false;
                this.freeMode = false;
                
                // AI 相关（支持 2/4/6 人多 AI：可选数量、每 AI 独立难度）
                this.aiEnabled = false;
                this.humanPlayer = 0;              // 人类固定红方
                this.aiPlayers = [];               // 由 AI 控制的玩家 id 数组
                this.aiDifficulties = {};          // playerId -> 'easy'|'medium'|'hard'
                this.aiWorker = null;              // AI Web Worker（搜索与走子动画并行）
                this.aiThinking = false;
                this.aiTimerId = null;             // AI 延迟走棋定时器句柄
                this.aiRequestId = 0;              // AI 请求自增 id（token）
                this.aiPending = {};               // token -> {resolve, generation, watchdog}
                this.aiGeneration = 0;             // AI 代际：重置/撤销/切模式时 ++ 使旧请求失效
                this.precomputedTarget = null;     // 动画期间预计算的下一手 {player, move, pending, generation}
                this.awaitingContinue = false;     // 多人夺冠后等待“继续对局”
                this.finishedPlayers = [];         // 已完成玩家（名次顺序）
                this.finishedSet = new Set();      // 已夺冠（离场）玩家集合
                this.stuckChain = 0;               // 连续无子可动跳过计数（防死循环）
                this.stagnation = 0;               // 连续无进展走子计数（僵局提示用）
                this.bestProgress = {};            // 各玩家历史最佳进展分
                this.awaitingStalemate = false;    // 僵局提示弹窗期间暂停对局
                this.STALEMATE_LIMIT = 40;         // 连续 40 步无任何进展则提示僵局
                
                // 连跳状态追踪
                this.isInJumpChain = false;
                this.jumpChainCount = 0;
                this.originalPiece = null;
                this.jumpStartPosition = null;
                
                this.playerColors = ['红', '蓝', '绿', '黄', '紫', '青'];
                this.colorCodes = ['#ef4444', '#3b82f6', '#22c55e', '#eab308', '#a855f7', '#06b6d4'];
                this.colorNames = ['红色', '蓝色', '绿色', '黄色', '紫色', '青色'];
                
                this.rowCounts = [1, 2, 3, 4, 13, 12, 11, 10, 9, 10, 11, 12, 13, 4, 3, 2, 1];
                this.totalRows = 17;
                
                // 响应式尺寸
                this.boardWidth = 600;
                this.boardHeight = 540;
                this.spacingX = 30;
                this.spacingY = 26;
                this.centerX = 300;
                
                // 缩放相关
                this.currentScale = 1;         // 当前布局缩放比例（随窗口大小变化）
                
                this.init();
                this.setupKeyboardControls();
                this.handleResize();
                this.updateAIButtonState();
                window.addEventListener('resize', () => this.handleResize());
            }

            // ========== 自由模式切换 ==========
            toggleFreeMode() {
                this.freeMode = !this.freeMode;
                const btn = document.getElementById('freeModeBtn');
                if (this.freeMode) {
                    btn.classList.add('free-mode-active');
                    btn.textContent = '🎲 自由模式(开启)';
                    // 清空选中状态，避免干扰
                    this.deselect();
                    this.showMessage('自由模式已开启：可任意移动棋子到任意空位', 3000);
                } else {
                    btn.classList.remove('free-mode-active');
                    btn.textContent = '🎲 自由模式';
                    this.showMessage('自由模式已关闭，恢复正常规则', 2000);
                    this.deselect();
                    // 重置连跳状态
                    if (this.isInJumpChain) {
                        this.endJumpChain();
                    }
                }
                // 刷新提示信息
                this.updateMoveInfo();
                if (this.selectedPiece && this.showMoveHint) {
                    const row = parseInt(this.selectedPiece.dataset.row);
                    const col = parseInt(this.selectedPiece.dataset.col);
                    this.validMoves = this.calculateValidMoves({row, col});
                    this.highlightValidMoves();
                }
            }

            handleResize() {
                const container = document.getElementById('board-container');
                const board = document.getElementById('board');
                if (!container || !board) return;
                // 棋盘区为正方形：边长取容器宽高的较小值，flex 居中
                const side = Math.max(0, Math.min(container.offsetWidth, container.offsetHeight));
                board.style.width = side + 'px';
                board.style.height = side + 'px';
                this.calculatePositions();
                this.updatePiecePositions();
            }

            updatePiecePositions() {
                this.pieces.forEach(p => {
                    const pos = this.positions[p.pos.row][p.pos.col];
                    const size = Math.max(4, Math.round(13 * this.currentScale));
                    p.element.style.left = (pos.x - size) + 'px';
                    p.element.style.top = (pos.y - size) + 'px';
                    p.element.style.width = (size * 2) + 'px';
                    p.element.style.height = (size * 2) + 'px';
                });
                this.holes.forEach(hole => {
                    const row = parseInt(hole.dataset.row);
                    const col = parseInt(hole.dataset.col);
                    const pos = this.positions[row][col];
                    const size = Math.max(3, Math.round(9 * this.currentScale));
                    hole.style.left = (pos.x - size) + 'px';
                    hole.style.top = (pos.y - size) + 'px';
                    hole.style.width = (size * 2) + 'px';
                    hole.style.height = (size * 2) + 'px';
                });
            }

            setupKeyboardControls() {
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        if (this.isInJumpChain) {
                            this.endJumpChain();
                        }
                    }
                    if (e.code === 'Escape') {
                        if (this.selectedPiece && !this.isInJumpChain) {
                            this.deselect();
                        }
                    }
                });
            }

            setMode(count) {
                if (this.freeMode) this.toggleFreeMode();
                this.playerCount = count;
                this.aiEnabled = false;
                this.aiPlayers = [];
                this.aiDifficulties = {};
                this.clearPendingAI();
                document.querySelectorAll('.mode-selector button').forEach(btn => btn.classList.remove('active'));
                document.getElementById(`mode${count}`).classList.add('active');
                document.getElementById('aiBtn').classList.remove('ai-active');
                document.getElementById('aiBtn').textContent = '🤖 人机';
                this.updateAIButtonState();
                this.renderAIDifficultyPanel();
                this.updatePlayersLegend();
                this.reset();
            }

            // 清除未决的 AI 定时器与在途请求，防止迟到的回调乱走棋
            clearPendingAI() {
                if (this.aiTimerId) {
                    clearTimeout(this.aiTimerId);
                    this.aiTimerId = null;
                }
                this.aiThinking = false;
                this.precomputedTarget = null;
                // 代际自增：任何在途请求返回时都会被丢弃
                this.aiGeneration++;
                for (const token in this.aiPending) {
                    const entry = this.aiPending[token];
                    clearTimeout(entry.watchdog);
                    entry.resolve(null);
                    delete this.aiPending[token];
                }
            }

            // 刷新人机相关 UI：2 人用开关，4/6 人用 AI 数量选择器
            updateAIButtonState() {
                const aiBtn = document.getElementById('aiBtn');
                const countSel = document.getElementById('aiCountSelector');
                if (!aiBtn || !countSel) return;
                if (this.playerCount === 2) {
                    aiBtn.style.display = '';
                    aiBtn.disabled = false;
                    countSel.style.display = 'none';
                } else {
                    aiBtn.style.display = 'none';
                    countSel.style.display = 'flex';
                    for (let i = 0; i <= 6; i++) {
                        const b = document.getElementById('aiCount' + i);
                        if (!b) continue;
                        b.style.display = (i <= this.playerCount) ? '' : 'none';
                        b.classList.toggle('active', this.aiEnabled && this.aiPlayers.length === i);
                    }
                }
            }

            toggleAI() {
                // 2 人模式：人机开关（蓝方由 AI 控制）
                if (this.playerCount !== 2) {
                    this.showMessage('4/6 人模式请使用下方 AI 数量选择器', 2500);
                    return;
                }
                this.aiEnabled = !this.aiEnabled;
                const btn = document.getElementById('aiBtn');
                if (this.aiEnabled) {
                    this.aiPlayers = [1];
                    if (!this.aiDifficulties[1]) this.aiDifficulties[1] = 'medium';
                    btn.classList.add('ai-active');
                    btn.textContent = '🤖 人机(开)';
                    this.showMessage('人机模式开启：蓝方由 AI 控制', 2000);
                } else {
                    this.aiPlayers = [];
                    btn.classList.remove('ai-active');
                    btn.textContent = '🤖 人机';
                    this.clearPendingAI();
                }
                this.renderAIDifficultyPanel();
                this.updatePlayersLegend();
                this.reset();
            }

            setAICount(n) {
                if (this.playerCount === 2) return;
                n = Math.max(0, Math.min(n, this.playerCount));
                const playOrder = this.getPlayOrder();
                if (n === playOrder.length) {
                    // 全 AI 观战：红方也由 AI 控制
                    this.aiPlayers = [...playOrder];
                } else {
                    // AI 控制非红方中按 playOrder 倒序取 n 个
                    const nonRed = playOrder.filter(p => p !== this.humanPlayer);
                    this.aiPlayers = n === 0 ? [] : nonRed.slice(-n);
                }
                this.aiEnabled = this.aiPlayers.length > 0;
                for (const p of this.aiPlayers) {
                    if (!this.aiDifficulties[p]) this.aiDifficulties[p] = 'medium';
                }
                this.clearPendingAI();
                this.updateAIButtonState();
                this.renderAIDifficultyPanel();
                this.updatePlayersLegend();
                this.reset();
            }

            setPlayerDifficulty(player, diff) {
                this.aiDifficulties[player] = diff;
            }

            getAIDifficulty(player) {
                return this.aiDifficulties[player] || 'medium';
            }

            // 是否至少有一名人类玩家（全 AI 观战时为 false，撤销禁用）
            hasHuman() {
                if (!this.aiEnabled) return true;
                return !this.aiPlayers.includes(this.humanPlayer);
            }

            // 渲染每 AI 一行难度选择器（各自独立）
            renderAIDifficultyPanel() {
                const panel = document.getElementById('aiDifficultyPanel');
                if (!panel) return;
                if (!this.aiEnabled || this.aiPlayers.length === 0) {
                    panel.style.display = 'none';
                    return;
                }
                panel.style.display = 'flex';
                panel.innerHTML = '';
                for (const p of this.aiPlayers) {
                    const diff = this.getAIDifficulty(p);
                    const row = document.createElement('label');
                    row.className = 'ai-diff-item';
                    const dot = document.createElement('span');
                    dot.style.cssText = `display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;background:${this.colorCodes[p]};`;
                    const name = document.createElement('span');
                    name.textContent = `${this.playerColors[p]}`;
                    const sel = document.createElement('select');
                    for (const [val, label] of [['easy', '简单'], ['medium', '中等'], ['hard', '困难']]) {
                        const opt = document.createElement('option');
                        opt.value = val;
                        opt.textContent = label;
                        if (val === diff) opt.selected = true;
                        sel.appendChild(opt);
                    }
                    sel.addEventListener('change', () => this.setPlayerDifficulty(p, sel.value));
                    row.appendChild(dot);
                    row.appendChild(name);
                    row.appendChild(sel);
                    panel.appendChild(row);
                }
            }

            triggerAI() {
                if (!this.aiEnabled) return;
                if (this.isMoving || this.aiThinking) return;
                if (!this.aiPlayers.includes(this.currentPlayer)) return;
                if (this.finishedSet.has(this.currentPlayer)) return;
                this.aiThinking = true;
                const moveDetail = document.getElementById('moveDetail');
                moveDetail.innerHTML = '🤖 AI 思考中...<span class="ai-thinking">⏳</span>';
                const player = this.currentPlayer;
                this.getAIMoveAsync(player, this.getAIDifficulty(player), this.getActivePlayOrder()).then((bestMove) => {
                    try {
                        if (!this.aiEnabled || this.isMoving) return;
                        if (!this.aiPlayers.includes(this.currentPlayer) || this.currentPlayer !== player) return;
                        if (this.finishedSet.has(this.currentPlayer)) return;
                        if (bestMove) {
                            this.applyAIMove(bestMove);
                        } else {
                            // AI 无子可动：提示并自动跳过
                            this.showMessage('AI 无子可动，自动跳过');
                            this.advanceTurn();
                        }
                    } catch (err) {
                        // 搜索异常不应锁死游戏：提示并跳过本回合
                        console.error('AI 走棋异常:', err);
                        this.showMessage('AI 出现异常，自动跳过');
                        this.advanceTurn();
                    } finally {
                        this.aiThinking = false;
                    }
                });
            }

            // 执行 AI 走法（预计算命中或搜索完成共用）
            applyAIMove(move) {
                const player = this.currentPlayer;
                const piece = this.pieces.find(p =>
                    p.player === player &&
                    p.element.dataset.row == move.from.row &&
                    p.element.dataset.col == move.from.col
                );
                if (piece) {
                    this.selectedPiece = piece.element;
                    piece.element.classList.add('selected');
                    // 跳跃/单步走法统一直接执行到终点
                    this.executeMove({
                        row: move.to.row,
                        col: move.to.col,
                        isJump: move.isJump,
                        jumpCount: move.jumpCount || 0,
                        path: [move.from, move.to],
                        canContinue: false
                    });
                } else {
                    // 找不到对应棋子（走法已失效，如预计算过期）：提示并跳过
                    console.error('AI 走棋失败：找不到棋子', move);
                    this.showMessage('AI 走棋失败，自动跳过');
                    this.advanceTurn();
                }
            }

            // 回合推进：切换到下一名未淘汰玩家，并尝试触发 AI 走棋
            advanceTurn() {
                if (this.awaitingStalemate) return;
                this.nextPlayer();
                this.tryExecuteAITurn();
            }

            // 尝试用预计算结果或触发 AI 搜索；无 AI 回合时返回
            tryExecuteAITurn() {
                if (this.isMoving || this.aiThinking) return;
                if (!this.aiEnabled || this.awaitingContinue || this.awaitingStalemate) return;
                if (!this.aiPlayers.includes(this.currentPlayer)) return;
                if (this.finishedSet.has(this.currentPlayer)) return;
                const pc = this.precomputedTarget;
                if (pc && pc.player === this.currentPlayer && pc.generation === this.aiGeneration && !pc.pending && pc.move) {
                    // 预计算命中；但棋盘可能已被连跳等改变，需校验走法仍合法
                    if (this.isLegalAIMove(pc.move, this.currentPlayer)) {
                        this.precomputedTarget = null;
                        this.applyAIMove(pc.move);
                        return;
                    }
                }
                this.precomputedTarget = null;
                this.triggerAI();
            }

            // 校验走法在当前棋盘上仍合法（防止连跳等造成预计算过期）
            isLegalAIMove(move, player) {
                if (this.boardState.get(`${move.from.row}-${move.from.col}`) !== player) return false;
                if (this.boardState.has(`${move.to.row}-${move.to.col}`)) return false;
                const validMoves = this.calculateValidMoves(move.from);
                return validMoves.some(m => m.row === move.to.row && m.col === move.to.col);
            }

            // 当前走子刚落定（棋盘已更新）即预计算下一手 AI，与动画并行
            scheduleAIAfterMove() {
                if (!this.aiEnabled || this.freeMode || this.awaitingContinue) return;
                const playOrder = this.getPlayOrder();
                const idx = playOrder.indexOf(this.currentPlayer);
                if (idx === -1) return;
                let next = -1;
                for (let k = 1; k <= playOrder.length; k++) {
                    const cand = playOrder[(idx + k) % playOrder.length];
                    if (!this.finishedSet.has(cand)) { next = cand; break; }
                }
                if (next === -1 || !this.aiPlayers.includes(next)) return;
                const pc = this.precomputedTarget;
                if (pc && pc.player === next && !pc.pending) return;
                const generation = this.aiGeneration;
                this.precomputedTarget = { player: next, move: null, pending: true, generation };
                this.getAIMoveAsync(next, this.getAIDifficulty(next), this.getActivePlayOrder()).then((move) => {
                    const cur = this.precomputedTarget;
                    if (!cur || cur.player !== next || cur.generation !== generation) return;
                    cur.move = move;
                    cur.pending = false;
                    this.tryExecuteAITurn();
                });
            }

            getPlayOrder() {
                if (this.playerCount === 2) return [0, 1];
                if (this.playerCount === 4) return [0, 1, 2, 5];
                return [0, 1, 2, 5, 4, 3];
            }

            getActivePlayers() {
                return this.getPlayOrder();
            }

            // 参与本局对弈的玩家顺序（已夺冠/离场玩家不再参与 AI 搜索与轮转）
            getActivePlayOrder() {
                return this.getPlayOrder().filter(p => !this.finishedSet.has(p));
            }

            updatePlayersLegend() {
                const container = document.getElementById('playersLegend');
                const players = this.getPlayOrder();
                container.innerHTML = players.map((p) => {
                    let label = this.playerColors[p];
                    if (this.aiEnabled && this.aiPlayers.includes(p)) label += '(AI)';
                    else if (this.aiEnabled && p === this.humanPlayer) label += '(你)';
                    const rank = this.finishedPlayers.indexOf(p) + 1;
                    const badge = rank ? ` <span class="rank-badge">第${rank}名</span>` : (p === this.currentPlayer ? '(当前)' : '');
                    return `<div class="legend-item">
                        <div class="legend-dot" style="background: ${this.colorCodes[p]}; box-shadow: 0 0 6px ${this.colorCodes[p]}"></div>
                        <span>${label}${badge}</span>
                    </div>`;
                }).join('<span style="color: #64748b">→</span>');
            }

            toggleMoveHint() {
                this.showMoveHint = !this.showMoveHint;
                const btn = document.getElementById('hintBtn');
                btn.textContent = this.showMoveHint ? '💡 提示' : '💡 隐藏';
                if (!this.showMoveHint) {
                    this.clearHighlights();
                } else if (this.selectedPiece) {
                    const row = parseInt(this.selectedPiece.dataset.row);
                    const col = parseInt(this.selectedPiece.dataset.col);
                    this.validMoves = this.calculateValidMoves({row, col});
                    this.highlightValidMoves();
                }
            }

            clearHighlights() {
                document.querySelectorAll('.hole.valid-move, .hole.jump-move, .hole.jump-continue').forEach(h => {
                    h.classList.remove('valid-move', 'jump-move', 'jump-continue');
                });
            }

            init() {
                this.calculatePositions();
                this.createBoard();
                this.updatePlayersLegend();
                this.setupPieces();
                this.updatePlayerDisplay();
                this.initAIWorker();
            }

            // 初始化 AI Web Worker
            initAIWorker() {
                if (typeof Worker !== 'undefined') {
                    try {
                        this.aiWorker = new Worker('./ai-worker.js');
                        this.aiWorker.onmessage = (e) => {
                            const { type, data, token } = e.data;
                            if (type === 'bestMove' || type === 'error') {
                                this.resolvePendingAI(token, type === 'bestMove' ? data : null);
                            }
                        };
                        this.aiWorker.onerror = (err) => {
                            console.error('AI Worker 加载失败:', err);
                            this.aiWorker = null;
                        };
                        console.log('AI Web Worker 已初始化');
                    } catch (err) {
                        console.error('创建 AI Worker 失败:', err);
                        this.aiWorker = null;
                    }
                } else {
                    console.warn('浏览器不支持 Web Worker，AI 无法运行');
                }
            }

            // 按 token 结算 AI 请求（代际不符的旧结果直接丢弃）
            resolvePendingAI(token, move) {
                const entry = this.aiPending[token];
                if (!entry) return;
                clearTimeout(entry.watchdog);
                delete this.aiPending[token];
                if (entry.generation !== this.aiGeneration) return;
                entry.resolve(move);
            }

            // 将 boardState Map 转换为可序列化的对象
            serializeBoardState() {
                const obj = {};
                this.boardState.forEach((value, key) => {
                    obj[key] = value;
                });
                return obj;
            }

            // 通过 Web Worker 获取 AI 最佳走法（带超时看门狗，防止卡死）
            getAIMoveAsync(player, difficulty, playOrder) {
                return new Promise((resolve) => {
                    if (!this.aiWorker) {
                        resolve(null);
                        return;
                    }
                    const token = ++this.aiRequestId;
                    const entry = { resolve, generation: this.aiGeneration, watchdog: null };
                    this.aiPending[token] = entry;
                    const timeoutMs = { easy: 3000, medium: 4000, hard: 6000 }[difficulty] || 4000;
                    entry.watchdog = setTimeout(() => {
                        if (this.aiPending[token]) {
                            delete this.aiPending[token];
                            console.warn('AI 计算超时，自动跳过本回合');
                            resolve(null);
                        }
                    }, timeoutMs);
                    this.aiWorker.postMessage({
                        type: 'getBestMove',
                        token,
                        data: {
                            boardState: this.serializeBoardState(),
                            currentPlayer: player,
                            difficulty: difficulty,
                            playOrder: playOrder
                        }
                    });
                });
            }

            calculatePositions() {
                this.positions = [];
                const container = document.getElementById('board-container');
                const containerWidth = container?.offsetWidth || this.boardWidth;
                const containerHeight = container?.offsetHeight || this.boardHeight;
                // 正方形棋盘区：按边长（宽高较小值）适配，最大化棋子展示
                const side = Math.max(0, Math.min(containerWidth, containerHeight));
                // 按棋盘内容本身（最宽行 13 格、总高 17 行）适配
                const layoutW = (this.rowCounts[4] - 1) * this.spacingX;   // 12 * 30 = 360
                const layoutH = (this.totalRows - 1) * this.spacingY;      // 16 * 26 = 416
                const margin = 20;
                const scale = Math.min((side - 2 * margin) / layoutW, (side - 2 * margin) / layoutH);
                this.currentScale = scale;
                const spacingX = this.spacingX * scale;
                const spacingY = this.spacingY * scale;
                // 棋子/孔洞是 #board（边长 side 的正方形）的子元素，坐标一律以 #board 为基准
                const centerX = side / 2;
                // 垂直居中，保证内容始终完整可见
                const baseY = (side + layoutH * scale) / 2;
                
                for (let row = 0; row < this.totalRows; row++) {
                    const count = this.rowCounts[row];
                    const rowPositions = [];
                    const rowWidth = (count - 1) * spacingX;
                    const startX = centerX - rowWidth / 2;
                    for (let col = 0; col < count; col++) {
                        rowPositions.push({
                            x: startX + col * spacingX,
                            y: baseY - row * spacingY,
                            row: row,
                            col: col,
                            id: `${row}-${col}`
                        });
                    }
                    this.positions.push(rowPositions);
                }
            }

            createBoard() {
                this.board.innerHTML = '';
                this.holes = [];
                for (let row = 0; row < this.totalRows; row++) {
                    for (let pos of this.positions[row]) {
                        const hole = document.createElement('div');
                        hole.className = 'hole';
                        const holeSize = Math.max(3, Math.round(9 * this.currentScale));
                        hole.style.left = (pos.x - holeSize) + 'px';
                        hole.style.top = (pos.y - holeSize) + 'px';
                        hole.style.width = (holeSize * 2) + 'px';
                        hole.style.height = (holeSize * 2) + 'px';
                        hole.dataset.row = row;
                        hole.dataset.col = pos.col;
                        hole.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.onHoleClick(pos);
                        });
                        hole.addEventListener('touchstart', (e) => {
                            e.preventDefault();
                            this.onHoleClick(pos);
                        }, {passive: false});
                        this.board.appendChild(hole);
                        this.holes.push(hole);
                    }
                }
            }

            setupPieces() {
                document.querySelectorAll('.piece').forEach(p => p.remove());
                this.pieces = [];
                this.boardState.clear();
                this.isInJumpChain = false;
                this.jumpChainCount = 0;
                this.hideEndTurnButton();
                const activePlayers = this.getActivePlayers();
                const allCornerPositions = this.getAllCornerPositions();
                for (let player of activePlayers) {
                    const positions = allCornerPositions[player];
                    for (let pos of positions) {
                        if (this.isValidPosition(pos.row, pos.col)) {
                            this.createPiece(player, pos);
                        }
                    }
                }
            }

            getAllCornerPositions() {
                return [
                    [{row: 16, col: 0}, {row: 15, col: 0}, {row: 15, col: 1}, {row: 14, col: 0}, {row: 14, col: 1}, {row: 14, col: 2}, {row: 13, col: 0}, {row: 13, col: 1}, {row: 13, col: 2}, {row: 13, col: 3}],
                    [{row: 0, col: 0}, {row: 1, col: 0}, {row: 1, col: 1}, {row: 2, col: 0}, {row: 2, col: 1}, {row: 2, col: 2}, {row: 3, col: 0}, {row: 3, col: 1}, {row: 3, col: 2}, {row: 3, col: 3}],
                    [{row: 4, col: 0}, {row: 4, col: 1}, {row: 5, col: 0}, {row: 4, col: 2}, {row: 5, col: 1}, {row: 6, col: 0}, {row: 4, col: 3}, {row: 5, col: 2}, {row: 6, col: 1}, {row: 7, col: 0}],
                    [{row: 4, col: 12}, {row: 4, col: 11}, {row: 5, col: 11}, {row: 4, col: 10}, {row: 5, col: 10}, {row: 6, col: 10}, {row: 4, col: 9}, {row: 5, col: 9}, {row: 6, col: 9}, {row: 7, col: 9}],
                    [{row: 12, col: 0}, {row: 11, col: 0}, {row: 12, col: 1}, {row: 10, col: 0}, {row: 11, col: 1}, {row: 12, col: 2}, {row: 9, col: 0}, {row: 10, col: 1}, {row: 11, col: 2}, {row: 12, col: 3}],
                    [{row: 12, col: 12}, {row: 11, col: 11}, {row: 12, col: 11}, {row: 10, col: 10}, {row: 11, col: 10}, {row: 12, col: 10}, {row: 9, col: 9}, {row: 10, col: 9}, {row: 11, col: 9}, {row: 12, col: 9}]
                ];
            }

            isValidPosition(row, col) {
                return row >= 0 && row < this.totalRows && col >= 0 && col < this.rowCounts[row];
            }

            // 与渲染一致的几何相邻判定：同行 |Δx|=1 格，跨行 |Δx|=半格
            getNeighbors(row, col) {
                const neighbors = [];
                for (const dc of [-1, 1]) {
                    if (this.isValidPosition(row, col + dc)) neighbors.push({row: row, col: col + dc});
                }
                for (const dr of [-1, 1]) {
                    const nr = row + dr;
                    if (nr < 0 || nr >= this.totalRows) continue;
                    const px = this.positions[row][col].x;
                    for (let nc = 0; nc < this.rowCounts[nr]; nc++) {
                        if (Math.abs(this.positions[nr][nc].x - px) <= this.spacingX * this.currentScale / 2 + 0.5) {
                            neighbors.push({row: nr, col: nc});
                        }
                    }
                }
                return neighbors;
            }

            // 跳跃落点 = 当前格关于被跳棋子的几何对称点
            getJumpLanding(pos, adj) {
                const jumpRow = adj.row + (adj.row - pos.row);
                if (jumpRow < 0 || jumpRow >= this.totalRows) return null;
                const mirrorX = 2 * this.positions[adj.row][adj.col].x - this.positions[pos.row][pos.col].x;
                for (let c = 0; c < this.rowCounts[jumpRow]; c++) {
                    if (Math.abs(this.positions[jumpRow][c].x - mirrorX) <= 1) {
                        return {row: jumpRow, col: c};
                    }
                }
                return null;
            }

            // 是否位于自己的目标角内（进入后不得移出）
            isInTargetCorner(row, col, player) {
                const targetMap = {0:1, 1:0, 2:5, 3:4, 4:3, 5:2};
                const positions = this.getAllCornerPositions()[targetMap[player]];
                return positions.some(p => p.row === row && p.col === col);
            }

            createPiece(player, pos) {
                const piece = document.createElement('div');
                piece.className = `piece player-${player}`;
                const position = this.positions[pos.row][pos.col];
                const pieceSize = Math.max(4, Math.round(13 * this.currentScale));
                piece.style.left = (position.x - pieceSize) + 'px';
                piece.style.top = (position.y - pieceSize) + 'px';
                piece.style.width = (pieceSize * 2) + 'px';
                piece.style.height = (pieceSize * 2) + 'px';
                piece.dataset.player = player;
                piece.dataset.row = pos.row;
                piece.dataset.col = pos.col;
                piece.style.animation = 'marble-drop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                setTimeout(() => piece.style.animation = '', 500);
                const handleClick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const currentPos = {
                        row: parseInt(piece.dataset.row),
                        col: parseInt(piece.dataset.col)
                    };
                    this.onPieceClick(piece, currentPos);
                };
                piece.addEventListener('click', handleClick);
                piece.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    handleClick(e);
                }, {passive: false});
                this.board.appendChild(piece);
                this.pieces.push({element: piece, player: player, pos: pos});
                this.boardState.set(`${pos.row}-${pos.col}`, player);
            }

            onPieceClick(pieceElement, pos) {
                if (this.isMoving || this.aiThinking || this.awaitingStalemate) return;
                if (this.aiEnabled && this.aiPlayers.includes(this.currentPlayer)) return;
                const player = parseInt(pieceElement.dataset.player);
                
                // 自由模式：允许移动任意棋子，不检查当前玩家
                if (this.freeMode) {
                    // 如果已经选中同一个棋子，则取消选中
                    if (this.selectedPiece === pieceElement) {
                        this.deselect();
                        return;
                    }
                    this.deselect();
                    this.selectedPiece = pieceElement;
                    pieceElement.classList.add('selected');
                    // 自由模式下所有空位都可移动（除了自己当前位置）
                    this.validMoves = [];
                    for (let row = 0; row < this.totalRows; row++) {
                        for (let col = 0; col < this.rowCounts[row]; col++) {
                            if (!this.boardState.has(`${row}-${col}`)) {
                                this.validMoves.push({
                                    row, col, isJump: false, jumpCount: 0,
                                    path: [pos, {row, col}], canContinue: false
                                });
                            }
                        }
                    }
                    this.updateMoveInfo();
                    if (this.showMoveHint) this.highlightValidMoves();
                    return;
                }
                
                // 正常模式：保留原有规则
                if (this.isInJumpChain) {
                    if (pieceElement !== this.selectedPiece) {
                        this.showMessage('连跳中，请继续移动当前棋子');
                        return;
                    }
                } else {
                    if (player !== this.currentPlayer) {
                        this.shakeElement(pieceElement);
                        return;
                    }
                }
                if (this.selectedPiece === pieceElement) {
                    if (this.isInJumpChain) {
                        this.showMessage('请按"结束回合"或空格键结束连跳');
                        return;
                    }
                    this.deselect();
                    return;
                }
                this.deselect();
                this.selectedPiece = pieceElement;
                pieceElement.classList.add('selected');
                if (this.isInJumpChain) {
                    this.validMoves = this.calculateJumpOnlyMoves(pos);
                } else {
                    this.validMoves = this.calculateValidMoves(pos);
                }
                this.updateMoveInfo();
                if (this.showMoveHint) this.highlightValidMoves();
            }

            calculateJumpOnlyMoves(startPos) {
                const moves = [];
                const visited = new Set();
                const queue = [{pos: startPos, path: [startPos], jumpCount: 0}];
                visited.add(`${startPos.row}-${startPos.col}`);
                while (queue.length > 0) {
                    const {pos, path, jumpCount} = queue.shift();
                    const restricted = this.isInTargetCorner(pos.row, pos.col, this.currentPlayer);
                    for (const n of this.getNeighbors(pos.row, pos.col)) {
                        if (!this.boardState.has(`${n.row}-${n.col}`)) continue;
                        const landing = this.getJumpLanding(pos, n);
                        if (!landing) continue;
                        if (this.boardState.has(`${landing.row}-${landing.col}`)) continue;
                        if (landing.row === this.jumpStartPosition.row && landing.col === this.jumpStartPosition.col) continue;
                        if (restricted && !this.isInTargetCorner(landing.row, landing.col, this.currentPlayer)) continue;
                        const stateKey = `${landing.row}-${landing.col}`;
                        if (visited.has(stateKey)) continue;
                        visited.add(stateKey);
                        const newPath = [...path, landing];
                        const newJumpCount = jumpCount + 1;
                        moves.push({
                            row: landing.row,
                            col: landing.col,
                            isJump: true,
                            jumpCount: newJumpCount,
                            path: newPath,
                            canContinue: true
                        });
                        queue.push({
                            pos: landing,
                            path: newPath,
                            jumpCount: newJumpCount
                        });
                    }
                }
                return moves;
            }

            calculateValidMoves(startPos) {
                // 自由模式下不会调用此函数，但保留以防意外
                if (this.freeMode) return [];
                const moves = [];
                const visited = new Set();
                const queue = [{pos: startPos, path: [startPos], isJump: false, jumpCount: 0}];
                const startRestricted = this.isInTargetCorner(startPos.row, startPos.col, this.currentPlayer);
                // 单步
                for (const n of this.getNeighbors(startPos.row, startPos.col)) {
                    if (this.boardState.has(`${n.row}-${n.col}`)) continue;
                    if (startRestricted && !this.isInTargetCorner(n.row, n.col, this.currentPlayer)) continue;
                    moves.push({
                        row: n.row, col: n.col, isJump: false, jumpCount: 0,
                        path: [startPos, n], canContinue: false
                    });
                }
                visited.add(`${startPos.row}-${startPos.col}`);
                // 跳跃（BFS 找所有可达跳跃终点）
                while (queue.length > 0) {
                    const {pos, path, isJump, jumpCount} = queue.shift();
                    const restricted = this.isInTargetCorner(pos.row, pos.col, this.currentPlayer);
                    for (const n of this.getNeighbors(pos.row, pos.col)) {
                        if (!this.boardState.has(`${n.row}-${n.col}`)) continue;
                        const landing = this.getJumpLanding(pos, n);
                        if (!landing) continue;
                        if (this.boardState.has(`${landing.row}-${landing.col}`)) continue;
                        if (restricted && !this.isInTargetCorner(landing.row, landing.col, this.currentPlayer)) continue;
                        const stateKey = `${landing.row}-${landing.col}`;
                        if (visited.has(stateKey)) continue;
                        visited.add(stateKey);
                        const newPath = [...path, landing];
                        const newJumpCount = jumpCount + 1;
                        moves.push({
                            row: landing.row, col: landing.col, isJump: true, jumpCount: newJumpCount,
                            path: newPath, canContinue: true
                        });
                        queue.push({
                            pos: landing,
                            path: newPath,
                            isJump: true,
                            jumpCount: newJumpCount
                        });
                    }
                }
                return moves.filter(m => !(m.row === startPos.row && m.col === startPos.col));
            }

            highlightValidMoves() {
                this.clearHighlights();
                this.validMoves.forEach(move => {
                    const hole = this.findHole(move.row, move.col);
                    if (hole) {
                        if (this.freeMode) {
                            hole.classList.add('valid-move');
                        } else if (this.isInJumpChain) {
                            hole.classList.add('jump-continue');
                        } else {
                            if (move.isJump) hole.classList.add('jump-move');
                            else hole.classList.add('valid-move');
                        }
                    }
                });
            }

            showEndTurnButton() {
                const btn = document.getElementById('endTurnBtn');
                btn.style.display = 'inline-block';
            }

            hideEndTurnButton() {
                const btn = document.getElementById('endTurnBtn');
                btn.style.display = 'none';
            }

            updateMoveInfo() {
                const moveDetail = document.getElementById('moveDetail');
                const statusBadge = document.getElementById('statusBadge');
                
                if (this.freeMode) {
                    if (this.selectedPiece) {
                        moveDetail.innerHTML = `自由模式 | 可选空位: ${this.validMoves.length}`;
                    } else {
                        moveDetail.innerHTML = '🎲 自由模式 - 点击任意棋子可移动';
                    }
                    statusBadge.style.display = 'none';
                    this.hideEndTurnButton();
                    return;
                }
                
                if (this.isInJumpChain) {
                    if (this.validMoves.length > 0) {
                        moveDetail.innerHTML = `连跳中！已跳 <span class="jump-badge">${this.jumpChainCount}</span> 次`;
                        statusBadge.textContent = '可继续跳跃';
                        statusBadge.className = 'status-badge continue';
                        statusBadge.style.display = 'inline-block';
                        this.showEndTurnButton();
                    } else {
                        moveDetail.innerHTML = `连跳结束！共 <span class="jump-badge">${this.jumpChainCount}</span> 次`;
                        statusBadge.textContent = '无可用跳跃';
                        statusBadge.className = 'status-badge';
                        statusBadge.style.display = 'inline-block';
                        statusBadge.style.background = 'rgba(107, 114, 128, 0.3)';
                        statusBadge.style.color = '#9ca3af';
                        this.hideEndTurnButton();
                        setTimeout(() => this.endJumpChain(), 1200);
                    }
                    return;
                }
                
                if (!this.selectedPiece) {
                    moveDetail.textContent = '选择棋子';
                    statusBadge.style.display = 'none';
                    return;
                }
                if (this.validMoves.length === 0) {
                    moveDetail.textContent = '无法移动';
                    statusBadge.style.display = 'none';
                    return;
                }
                const jumpMoves = this.validMoves.filter(m => m.isJump);
                const normalMoves = this.validMoves.filter(m => !m.isJump);
                if (jumpMoves.length > 0) {
                    const maxJumps = Math.max(...jumpMoves.map(m => m.jumpCount));
                    moveDetail.innerHTML = `可${normalMoves.length > 0 ? '走或' : ''}跳 <span class="jump-badge">最多${maxJumps}跳</span>`;
                    statusBadge.textContent = '点击蓝色开始连跳';
                    statusBadge.className = 'status-badge';
                    statusBadge.style.display = 'inline-block';
                    statusBadge.style.background = 'rgba(59, 130, 246, 0.2)';
                    statusBadge.style.color = '#60a5fa';
                } else {
                    moveDetail.textContent = `可移动 ${normalMoves.length} 处`;
                    statusBadge.style.display = 'none';
                }
            }

            showMessage(text, duration = 2000) {
                const moveDetail = document.getElementById('moveDetail');
                const originalHTML = moveDetail.innerHTML;
                moveDetail.innerHTML = text;
                moveDetail.style.color = '#fbbf24';
                setTimeout(() => {
                    // 期间文本已被其他更新覆盖（如 AI 思考中、回合切换），放弃恢复
                    if (moveDetail.innerHTML !== text) return;
                    moveDetail.innerHTML = originalHTML;
                    moveDetail.style.color = '';
                }, duration);
            }

            shakeElement(element) {
                element.style.animation = 'shake 0.4s';
                setTimeout(() => element.style.animation = '', 400);
            }

            findHole(row, col) {
                return this.holes.find(h => 
                    parseInt(h.dataset.row) === row && parseInt(h.dataset.col) === col
                );
            }

            onHoleClick(pos) {
                if (this.isMoving || this.aiThinking) return;
                if (this.aiEnabled && this.aiPlayers.includes(this.currentPlayer)) return;
                if (!this.selectedPiece) return;
                const move = this.validMoves.find(m => m.row === pos.row && m.col === pos.col);
                if (!move) return;
                this.executeMove(move);
            }

            executeMove(move) {
                this.isMoving = true;
                const oldRow = parseInt(this.selectedPiece.dataset.row);
                const oldCol = parseInt(this.selectedPiece.dataset.col);
                const newRow = move.row;
                const newCol = move.col;
                const player = parseInt(this.selectedPiece.dataset.player);
                
                if (move.path && move.path.length > 1) {
                    this.showMovePath(move.path);
                }
                
                if (!this.isInJumpChain && !this.freeMode) {
                    this.moveHistory.push({
                        piece: this.selectedPiece,
                        from: {row: oldRow, col: oldCol},
                        to: {row: newRow, col: newCol},
                        player: player,
                        path: move.path,
                        isChainStart: true
                    });
                    this.originalPiece = this.selectedPiece;
                    this.jumpStartPosition = {row: oldRow, col: oldCol};
                } else if (!this.freeMode) {
                    const lastMove = this.moveHistory[this.moveHistory.length - 1];
                    if (lastMove) {
                        lastMove.to = {row: newRow, col: newCol};
                        lastMove.path = move.path;
                    }
                } else {
                    // 自由模式历史记录
                    this.moveHistory.push({
                        piece: this.selectedPiece,
                        from: {row: oldRow, col: oldCol},
                        to: {row: newRow, col: newCol},
                        player: player,
                        path: move.path
                    });
                }
                
                this.updateUndoButton();
                this.boardState.delete(`${oldRow}-${oldCol}`);
                this.boardState.set(`${newRow}-${newCol}`, player);
                // 棋盘已落定：更新僵局计数，并在动画期间并行预计算下一手
                this.updateStagnation(player);
                this.stuckChain = 0;
                this.scheduleAIAfterMove();
                const newPos = this.positions[newRow][newCol];
                const pieceSize = Math.max(4, Math.round(13 * this.currentScale));
                this.selectedPiece.style.transition = 'all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)';
                this.selectedPiece.style.left = (newPos.x - pieceSize) + 'px';
                this.selectedPiece.style.top = (newPos.y - pieceSize) + 'px';
                
                setTimeout(() => {
                    this.selectedPiece.dataset.row = newRow;
                    this.selectedPiece.dataset.col = newCol;
                    this.selectedPiece.style.transition = '';
                    this.showLastMove(newPos);
                    // 同步棋子记录位置（p.pos 是后续查找/AI 走棋的唯一依据，必须与棋盘一致）
                    const pieceRec = this.pieces.find(p => p.element === this.selectedPiece);
                    if (pieceRec) pieceRec.pos = {row: newRow, col: newCol};
                    
                    if (this.freeMode) {
                        // 自由模式：移动后不清除选中，保持选中状态以便连续移动
                        this.deselect();
                        // 不切换玩家，直接结束移动状态
                        this.isMoving = false;
                        // 胜利检测依然保留（自由模式下也可获胜）
                        if (this.checkWin(player)) {
                            this.handleWin(player);
                        }
                        return;
                    }
                    
                    // 落子即胜：第 10 子进入目标角立即判胜（防止跳出目标区"解除"胜利）
                    if (this.checkWin(player)) {
                        this.deselect();
                        this.isMoving = false;
                        this.handleWin(player);
                        return;
                    }

                    // 正常模式逻辑
                    if (move.isJump && move.canContinue) {
                        // 连跳次数累计：首次落子直接赋值，续跳在上次基础上累加
                        this.jumpChainCount = (this.isInJumpChain ? this.jumpChainCount : 0) + move.jumpCount;
                        this.isInJumpChain = true;
                        this.validMoves = this.calculateJumpOnlyMoves({row: newRow, col: newCol});
                        if (this.validMoves.length > 0) {
                            this.updateMoveInfo();
                            if (this.showMoveHint) this.highlightValidMoves();
                            this.isMoving = false;
                            if (this.jumpChainCount >= 3) {
                                this.showMessage(`已连跳${this.jumpChainCount}次，可随时结束`);
                            }
                        } else {
                            this.endJumpChain();
                        }
                    } else {
                        this.deselect();
                        this.isMoving = false;
                        this.maybeTriggerStalemate();
                        this.advanceTurn();
                    }
                }, 350);
            }

            endJumpChain() {
                if (!this.isInJumpChain) return;
                this.isInJumpChain = false;
                this.hideEndTurnButton();
                this.deselect();
                this.isMoving = false;
                const player = this.currentPlayer;
                if (this.checkWin(player)) {
                    this.handleWin(player);
                } else {
                    this.maybeTriggerStalemate();
                    this.advanceTurn();
                }
            }

            showMovePath(path) {
                document.querySelectorAll('.move-path').forEach(el => el.remove());
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.classList.add('move-path');
                svg.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:18;';
                let pathData = '';
                for (let i = 0; i < path.length; i++) {
                    const pos = this.positions[path[i].row][path[i].col];
                    if (i === 0) pathData = `M ${pos.x} ${pos.y}`;
                    else pathData += ` L ${pos.x} ${pos.y}`;
                }
                const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
                pathEl.setAttribute("d", pathData);
                pathEl.setAttribute("stroke", this.isInJumpChain ? "#fbbf24" : (this.freeMode ? "#c084fc" : "#60a5fa"));
                pathEl.setAttribute("stroke-width", "3");
                pathEl.setAttribute("fill", "none");
                pathEl.setAttribute("stroke-linecap", "round");
                pathEl.setAttribute("stroke-linejoin", "round");
                pathEl.setAttribute("stroke-dasharray", "6,3");
                pathEl.style.filter = `drop-shadow(0 0 6px ${this.isInJumpChain ? "#fbbf24" : (this.freeMode ? "#c084fc" : "#60a5fa")})`;
                const length = 1000;
